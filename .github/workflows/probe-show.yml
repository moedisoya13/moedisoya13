# Show GN 수집 경로 실측용 일회성 워크플로.
# 개발 세션에서는 hada.io 로 나가는 egress 가 막혀 있어 러너에서 실측한다.
# 확인이 끝나면 이 워크플로와 scripts/probe_show.py 는 삭제한다.
# 시크릿을 쓰지 않고 permissions 는 contents: read 로 제한한다.
name: probe-show

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'scripts/probe_show.py'
      - '.github/workflows/probe-show.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir -r requirements.txt
      - run: python scripts/probe_show.py
