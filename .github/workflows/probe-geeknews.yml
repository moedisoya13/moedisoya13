# 일회성 탐색 워크플로.
#
# 개발 세션에서는 조직 egress 정책 때문에 hada.io 에 접근할 수 없어
# RSS 필드명과 /new 페이지의 HTML 구조를 실물로 확인할 수 없다.
# Actions 러너는 외부망이 열려 있으므로 여기서 실측한 뒤,
# 그 결과를 근거로 tests/fixtures 고정본과 파서를 작성한다.
#
# 시크릿을 일절 사용하지 않으며, 파서 작성이 끝나면 이 워크플로는 삭제한다.
name: probe-geeknews

on:
  workflow_dispatch:
  push:
    branches:
      - claude/gicknews-headline-automation-ljmkqc
    paths:
      - .github/workflows/probe-geeknews.yml
      - scripts/probe_geeknews.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe deps
        run: pip install --no-cache-dir requests==2.32.3 beautifulsoup4==4.12.3 feedparser==6.0.11

      - name: Probe GeekNews endpoints
        run: python scripts/probe_geeknews.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geeknews-probe
          path: probe-out/
          retention-days: 7
