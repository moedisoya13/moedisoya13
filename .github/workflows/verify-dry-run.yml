# 임시 검증 워크플로.
#
# geeknews-daily 는 schedule / workflow_dispatch 로만 돈다. 그런데 workflow_dispatch 는
# 워크플로 파일이 기본 브랜치에 있어야 동작하므로, 병합 전에는 실제 피드를 상대로
# 파이프라인을 돌려볼 방법이 없다. 이 워크플로는 그 검증만 하고 삭제한다.
#
# 시크릿을 일절 쓰지 않고 --dry-run 으로만 실행하므로 발송도 커밋도 하지 않는다.
name: verify-dry-run

on:
  push:
    branches:
      - claude/gicknews-headline-automation-ljmkqc
    paths:
      - .github/workflows/verify-dry-run.yml
      - geeknews/**
      - tests/**
      - pyproject.toml
      - requirements*.txt
      - scripts/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: pytest -q
      - name: 실제 피드로 dry-run
        run: python -m geeknews.main --dry-run
      - name: 시크릿 스캔
        run: python scripts/scan_output.py
