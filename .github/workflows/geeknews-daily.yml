# 긱뉴스 일일 다이제스트 → 카카오톡 '나에게 보내기'
#
# 스케줄 의도:
#   목표 도착 시각은 KST 08:50 이다. 다만 GitHub Actions 의 schedule 은 정시를
#   보장하지 않고 통상 수 분~수십 분 지연되므로, 10분 앞당긴 UTC 23:40(KST 08:40)에
#   걸어 실제 도착이 08:50 근처가 되도록 유도한다. 정확한 시각은 보장되지 않는다.
#
# 트리거는 schedule 과 workflow_dispatch 뿐이다. pull_request 트리거를 두지 않아
# fork PR 에서 시크릿에 닿을 경로 자체를 만들지 않는다.
#
# 액션 버전:
#   공급망 관점에서는 커밋 SHA 핀이 낫지만, 이 세션은 actions/* 저장소에 접근할 수
#   없어 SHA 를 검증할 수 없었다. 검증하지 않은 SHA 를 적어 넣는 편이 더 위험하므로
#   메이저 태그를 쓴다. SHA 를 확인할 수 있는 환경에서 교체하는 것을 권장한다.
name: geeknews-daily

on:
  schedule:
    - cron: '40 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '발송·커밋 없이 수집/요약 결과만 출력'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: geeknews-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      # 시크릿은 이 스텝에만 주입한다. 뒤따르는 커밋·푸시 스텝은 받지 않는다.
      - name: Build and send digest
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m geeknews.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Scan output for leaked secrets
        run: python scripts/scan_output.py

      - name: Commit digest and state
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain digests state)" ]; then
            echo "커밋할 변경이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests state
          git commit -m "chore: 긱뉴스 다이제스트 $(TZ=Asia/Seoul date +%F)"
          git push
