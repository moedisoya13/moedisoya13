const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function angApproach(a, b, d) { const df = angDiff(a, b); return Math.abs(df) <= d ? b : a + Math.sign(df) * d; }
const Ease = {
  outCubic: (t) => 1 - (1 - t) ** 3,
  inCubic: (t) => t * t * t,
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; },
  outElastic: (t) => (t === 0 || t === 1 ? t : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
};

// Seedable RNG (?seed=123 reproduces a map)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = Math.random;
const rand = (a = 0, b = 1) => a + rnd() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

const LETTERS = ['S', 'H', 'A', 'Z', 'A', 'M'];

// ── 01_screen.js ──
// ─────────────────────────────────────────────────────────────
// Screen: low-res pixel buffer upscaled by an integer factor onto the
// device-resolution canvas. Hi-res overlays (title cards, comic scene)
// draw straight onto the device canvas afterwards.
// ─────────────────────────────────────────────────────────────

const Screen = { app: null, cv: null, ctx: null, lo: null, W: 196, H: 400, S: 2, dpr: 1, pw: 0, ph: 0, cssW: 0, cssH: 0 };
let L = null; // low-res 2D context — every pixel primitive draws here

function setupScreen() {
  Screen.app = document.getElementById('app');
  Screen.cv = document.getElementById('cv');
  Screen.ctx = Screen.cv.getContext('2d', { alpha: false });
  Screen.lo = document.createElement('canvas');
  L = Screen.lo.getContext('2d');
  resizeScreen();
  window.addEventListener('resize', resizeScreen);
  window.addEventListener('orientationchange', () => setTimeout(resizeScreen, 120));
}

function resizeScreen() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = Screen.app.getBoundingClientRect();
  const cw = Math.max(1, Math.round(r.width)), ch = Math.max(1, Math.round(r.height));
  const pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
  const S = Math.max(1, Math.round(pw / CFG.TARGET_W));
  Screen.dpr = dpr; Screen.cssW = cw; Screen.cssH = ch; Screen.pw = pw; Screen.ph = ph; Screen.S = S;
  Screen.W = Math.ceil(pw / S); Screen.H = Math.ceil(ph / S);
  Screen.cv.width = pw; Screen.cv.height = ph;
  Screen.lo.width = Screen.W; Screen.lo.height = Screen.H;
  L.imageSmoothingEnabled = false;
  if (typeof onScreenResized === 'function') onScreenResized();
}

// Upscale the low-res frame. zoom>1 crops around (zx,zy) for the close-up.
function presentFrame(shakeX = 0, shakeY = 0, zoom = 1, zx = 0, zy = 0) {
  const ctx = Screen.ctx, S = Screen.S;
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (zoom <= 1.0001) {
    ctx.drawImage(Screen.lo, Math.round(shakeX) * S, Math.round(shakeY) * S, Screen.W * S, Screen.H * S);
  } else {
    const sw = Screen.W / zoom, sh = Screen.H / zoom;
    const sx = clamp(zx - sw / 2, 0, Screen.W - sw), sy = clamp(zy - sh / 2, 0, Screen.H - sh);
    ctx.fillStyle = C.void; ctx.fillRect(0, 0, Screen.pw, Screen.ph);
    ctx.drawImage(Screen.lo, sx, sy, sw, sh, 0, 0, Screen.W * S, Screen.H * S);
  }
}

// ── pixel primitives (low-res) ──────────────────────────────
function rect(x, y, w, h, c) { L.fillStyle = c; L.fillRect(Math.round(x), Math.round(y), w, h); }
function px(x, y, c) { L.fillStyle = c; L.fillRect(Math.round(x), Math.round(y), 1, 1); }

function disc(cx, cy, r, c) {
  L.fillStyle = c;
  if (r < 0.75) { L.fillRect(Math.round(cx - 0.5), Math.round(cy - 0.5), 1, 1); return; }
  const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
  for (let py = y0; py <= y1; py++) {
    const dy = py + 0.5 - cy;
    if (dy * dy > r * r) continue;
    const half = Math.sqrt(r * r - dy * dy);
    const x0 = Math.ceil(cx - half - 0.5), x1 = Math.floor(cx + half - 0.5);
    if (x1 >= x0) L.fillRect(x0, py, x1 - x0 + 1, 1);
  }
}

// Rotated filled ellipse via exact per-row spans (crisp, no AA)
function ellipse(cx, cy, rx, ry, ang, c) {
  L.fillStyle = c;
  if (rx < 0.6 && ry < 0.6) { L.fillRect(Math.round(cx - 0.5), Math.round(cy - 0.5), 1, 1); return; }
  const co = Math.cos(ang), si = Math.sin(ang);
  const irx = 1 / (rx * rx), iry = 1 / (ry * ry);
  const A = co * co * irx + si * si * iry;
  const Bk = 2 * co * si * (irx - iry);
  const Ck = si * si * irx + co * co * iry;
  const ext = Math.max(rx, ry) + 1;
  const y0 = Math.floor(cy - ext), y1 = Math.ceil(cy + ext);
  for (let py = y0; py <= y1; py++) {
    const y = py + 0.5 - cy;
    const B = Bk * y, Cc = Ck * y * y - 1;
    const disc2 = B * B - 4 * A * Cc;
    if (disc2 < 0) continue;
    const sq = Math.sqrt(disc2);
    const xa = (-B - sq) / (2 * A), xb = (-B + sq) / (2 * A);
    const x0 = Math.ceil(cx + xa - 0.5), x1 = Math.floor(cx + xb - 0.5);
    if (x1 >= x0) L.fillRect(x0, py, x1 - x0 + 1, 1);
  }
}

function line(x0, y0, x1, y1, c) {
  L.fillStyle = c;
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, guard = 0;
  for (;;) {
    L.fillRect(x0, y0, 1, 1);
    if ((x0 === x1 && y0 === y1) || guard++ > 2000) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

function thickLine(x0, y0, x1, y1, w, c) {
  const len = Math.hypot(x1 - x0, y1 - y0);
  const n = Math.max(1, Math.ceil(len / 0.8));
  const r = w / 2;
  for (let i = 0; i <= n; i++) { const t = i / n; disc(lerp(x0, x1, t), lerp(y0, y1, t), r, c); }
}

// Scanline polygon fill (flat [x0,y0,x1,y1,...]), even-odd
function poly(pts, c) {
  L.fillStyle = c;
  const n = pts.length / 2;
  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < n; i++) { minY = Math.min(minY, pts[i * 2 + 1]); maxY = Math.max(maxY, pts[i * 2 + 1]); }
  const xs = [];
  for (let py = Math.floor(minY); py <= Math.ceil(maxY); py++) {
    const y = py + 0.5;
    xs.length = 0;
    for (let i = 0; i < n; i++) {
      const ax = pts[i * 2], ay = pts[i * 2 + 1];
      const j = (i + 1) % n, bx = pts[j * 2], by = pts[j * 2 + 1];
      if ((ay <= y && by > y) || (by <= y && ay > y)) xs.push(ax + ((y - ay) / (by - ay)) * (bx - ax));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const x0 = Math.ceil(xs[k] - 0.5), x1 = Math.floor(xs[k + 1] - 0.5);
      if (x1 >= x0) L.fillRect(x0, py, x1 - x0 + 1, 1);
    }
  }
}

function ring(cx, cy, r, c, frac = 1, start = -Math.PI / 2) {
  L.fillStyle = c;
  const n = Math.max(12, Math.ceil(r * 7 * frac));
  let lx = null, ly = null;
  for (let i = 0; i <= n; i++) {
    const a = start + (i / n) * TAU * frac;
    const x = Math.round(cx + Math.cos(a) * r - 0.5), y = Math.round(cy + Math.sin(a) * r - 0.5);
    if (x !== lx || y !== ly) { L.fillRect(x, y, 1, 1); lx = x; ly = y; }
  }
}

// ── pixel text ─────────────────────────────────────────────
function textW3(str, s = 1) { return str.length ? (str.length * 4 - 1) * s : 0; }
function text3(str, x, y, c, s = 1, align = 'left') {
  str = String(str).toUpperCase();
  const w = textW3(str, s);
  let cx = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  y = Math.round(y);
  L.fillStyle = c;
  for (const ch of str) {
    const g = FONT3[ch] || FONT3[ch.toLowerCase()] || FONT3[' '];
    for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) if (g[r][q] === '#') L.fillRect(cx + q * s, y + r * s, s, s);
    cx += 4 * s;
  }
  return w;
}
function text5(ch, x, y, c) {
  const g = FONT5[ch];
  if (!g) return;
  L.fillStyle = c;
  for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++) if (g[r][q] === '#') L.fillRect(Math.round(x) + q, Math.round(y) + r, 1, 1);
}

// hash noise for deterministic texturing
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// shade a hex colour (k<1 darker, >1 lighter)
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * k), 0, 255), g = clamp(Math.round(((n >> 8) & 255) * k), 0, 255), b = clamp(Math.round((n & 255) * k), 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }

// ── 02_audio.js ──
// ─────────────────────────────────────────────────────────────
// Audio — everything is synthesised with Web Audio (no files).
// iOS only allows sound after a user gesture → Sfx.init() runs from the first tap.
// ─────────────────────────────────────────────────────────────

const Sfx = {
  ctx: null, out: null, noiseBuf: null, ok: false, drone: null,

  init() {
    if (this.ctx) { this.resume(); return; }
    try {
      // Play even with the iPhone silent switch on (Safari 17+)
      if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) { /* ignore */ } }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4;
      const out = ctx.createGain(); out.gain.value = 0.85;
      out.connect(comp); comp.connect(ctx.destination);
      const len = ctx.sampleRate * 2;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.ctx = ctx; this.out = out; this.noiseBuf = buf; this.ok = true;
      // iOS unlock: a silent blip inside the gesture
      const o = ctx.createOscillator(), g = ctx.createGain(); g.gain.value = 0; o.connect(g); g.connect(out); o.start(); o.stop(ctx.currentTime + 0.02);
      this.resume();
    } catch (e) { this.ok = false; }
  },
  resume() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  get t() { return this.ctx ? this.ctx.currentTime : 0; },

  // ── building blocks ──
  tone(f0, f1, dur, o = {}) {
    if (!this.ok) return;
    const ctx = this.ctx, t0 = ctx.currentTime + (o.at || 0);
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, f0), t0);
    if (f1 !== f0) {
      if (o.lin) osc.frequency.linearRampToValueAtTime(Math.max(1, f1), t0 + dur);
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    }
    if (o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain();
    const vol = o.vol ?? 0.2, att = o.attack ?? 0.005;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = osc;
    if (o.vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
      l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + dur + 0.05);
    }
    if (o.filter) {
      const f = ctx.createBiquadFilter(); f.type = o.filter[0]; f.frequency.value = o.filter[1]; f.Q.value = o.filter[2] || 1;
      node.connect(f); node = f;
    }
    node.connect(g); g.connect(this.out);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noise(dur, o = {}) {
    if (!this.ok) return;
    const ctx = this.ctx, t0 = ctx.currentTime + (o.at || 0);
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.f0 || 1200, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
    const g = ctx.createGain(); const vol = o.vol ?? 0.2, att = o.attack ?? 0.004;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + att); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.out);
    src.start(t0, Math.random() * 1.5); src.stop(t0 + dur + 0.05);
  },

  // Voice-like sweep through two formant filters → the "cute scream" timbre
  voice(pts, o = {}) {
    if (!this.ok) return;
    const ctx = this.ctx, t0 = ctx.currentTime + (o.at || 0);
    const dur = pts[pts.length - 1][0];
    const mk = (type, det) => { const s = ctx.createOscillator(); s.type = type; s.detune.value = det; return s; };
    const a = mk('sawtooth', 0), b = mk('square', 7);
    for (const s of [a, b]) {
      s.frequency.setValueAtTime(pts[0][1], t0);
      for (let i = 1; i < pts.length; i++) s.frequency.exponentialRampToValueAtTime(pts[i][1], t0 + pts[i][0]);
    }
    const vib = ctx.createOscillator(), vg = ctx.createGain();
    vib.frequency.value = o.vibRate || 7; vg.gain.value = o.vibDepth || 30;
    vib.connect(vg); vg.connect(a.frequency); vg.connect(b.frequency);
    const mix = ctx.createGain(); mix.gain.value = 0.5; a.connect(mix); b.connect(mix);
    const g = ctx.createGain();
    const vol = o.vol ?? 0.22;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.03);
    g.gain.setValueAtTime(vol, t0 + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const forms = o.formants || [900, 2400];
    for (const ff of forms) {
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = ff; f.Q.value = o.q || 5;
      mix.connect(f); f.connect(g);
    }
    if (o.am) { // amplitude wobble (growl / giggle)
      const am = ctx.createOscillator(), ag = ctx.createGain();
      am.frequency.value = o.am[0]; ag.gain.value = vol * o.am[1];
      am.connect(ag); ag.connect(g.gain); am.start(t0); am.stop(t0 + dur + 0.05);
    }
    g.connect(this.out);
    for (const s of [a, b, vib]) { s.start(t0); s.stop(t0 + dur + 0.05); }
  },

  // ── game sounds ──
  tap() { this.tone(900, 600, 0.06, { type: 'square', vol: 0.05 }); },
  step(vol = 0.05, heavy = false) { this.noise(heavy ? 0.12 : 0.06, { vol, f0: heavy ? 260 : 700, ft: 'lowpass' }); if (heavy) this.tone(70, 40, 0.12, { vol: vol * 1.6 }); },
  key() { [1760, 2350, 2960].forEach((f, i) => this.tone(f, f * 1.01, 0.12, { vol: 0.08, at: i * 0.05, type: 'triangle' })); },
  laurel() { [660, 880, 1320, 1760].forEach((f, i) => this.tone(f, f, 0.18, { vol: 0.07, at: i * 0.045, type: 'triangle' })); },
  slotTick() { this.tone(1400, 1000, 0.025, { type: 'square', vol: 0.035 }); },
  slotLand(good) { if (good) [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, f, 0.32, { vol: 0.07, at: i * 0.05, type: 'triangle' })); else this.tone(520, 380, 0.25, { type: 'triangle', vol: 0.08 }); },
  letter() { [1047, 1319, 1568, 2093].forEach((f, i) => this.tone(f, f, 0.25, { vol: 0.08, at: i * 0.06, type: 'square', filter: ['lowpass', 3000] })); },
  dup() { this.tone(300, 1500, 0.35, { type: 'sawtooth', vol: 0.06, filter: ['lowpass', 2000] }); this.noise(0.3, { vol: 0.06, ft: 'bandpass', f0: 600, f1: 4000, q: 2 }); },
  honeyGet() { this.tone(400, 900, 0.12, { vol: 0.1 }); this.tone(900, 500, 0.12, { vol: 0.08, at: 0.1 }); },
  honeyPlace() { this.noise(0.25, { vol: 0.12, f0: 900, f1: 200 }); this.tone(300, 120, 0.2, { vol: 0.08 }); },
  honeyStick() { this.tone(200, 90, 0.4, { vol: 0.12, type: 'triangle', vib: [12, 20] }); this.noise(0.35, { vol: 0.08, f0: 500, f1: 150 }); },
  unlock() { this.tone(2200, 1800, 0.03, { type: 'square', vol: 0.05 }); this.tone(1500, 1200, 0.04, { type: 'square', vol: 0.05, at: 0.07 }); this.tone(180, 120, 0.5, { type: 'sawtooth', vol: 0.03, at: 0.1, filter: ['bandpass', 500, 4], vib: [9, 15] }); },
  lock() { this.tone(160, 90, 0.1, { vol: 0.15 }); this.tone(1800, 1400, 0.03, { type: 'square', vol: 0.05, at: 0.02 }); },
  bash() { this.noise(0.14, { vol: 0.22, f0: 300 }); this.tone(90, 45, 0.16, { vol: 0.2 }); },
  doorBreak() { this.noise(0.6, { vol: 0.3, f0: 1500, f1: 200 }); this.tone(80, 30, 0.5, { vol: 0.25 }); },
  flush() { this.noise(0.9, { vol: 0.12, ft: 'bandpass', f0: 2500, f1: 300, q: 1.5 }); this.tone(500, 200, 0.6, { vol: 0.03, vib: [18, 40] }); },
  hide() { this.noise(0.18, { vol: 0.1, ft: 'bandpass', f0: 2500, q: 1.2 }); this.tone(140, 90, 0.12, { vol: 0.08 }); },
  hit(big) { this.noise(big ? 0.35 : 0.2, { vol: big ? 0.35 : 0.26, f0: 2200, f1: 300 }); this.tone(big ? 140 : 180, 40, big ? 0.35 : 0.22, { vol: 0.3 }); },
  whoosh() { this.noise(0.18, { vol: 0.08, ft: 'bandpass', f0: 600, f1: 2400, q: 1.5 }); },
  stab() { // Psycho-style string screech when a chase starts
    [1320, 1397, 1480].forEach((f, i) => this.tone(f, f * 1.02, 0.38, { type: 'sawtooth', vol: 0.035, detune: i * 9, vib: [22, 25], filter: ['highpass', 900] }));
    [1320, 1397].forEach((f) => this.tone(f * 1.06, f * 1.08, 0.3, { type: 'sawtooth', vol: 0.03, at: 0.42, vib: [22, 25], filter: ['highpass', 900] }));
  },
  heartbeat(v) { this.tone(58, 38, 0.16, { vol: 0.22 * v, attack: 0.01 }); this.tone(52, 36, 0.14, { vol: 0.15 * v, at: 0.2, attack: 0.01 }); },
  thunder() { this.noise(2.2, { vol: 0.5, f0: 3000, f1: 80, attack: 0.002 }); this.noise(0.25, { vol: 0.35, ft: 'highpass', f0: 2000 }); this.tone(60, 28, 1.6, { vol: 0.35 }); },
  transform() { [262, 330, 392, 523, 659, 784].forEach((f, i) => this.tone(f, f, 0.6, { type: 'sawtooth', vol: 0.05, at: 0.12 + i * 0.07, filter: ['lowpass', 2600] })); },
  revert() { this.tone(600, 120, 0.8, { type: 'sawtooth', vol: 0.06, filter: ['lowpass', 1500] }); },
  zap(level) { const f = 300 + level * 180; this.tone(f, f * 2.2, 0.22, { type: 'square', vol: 0.09, vib: [55, 120], filter: ['bandpass', 1800, 1.2] }); this.noise(0.18, { vol: 0.12, ft: 'highpass', f0: 3000 }); },
  fizz() { this.noise(0.3, { vol: 0.1, f0: 1500, f1: 200 }); this.tone(300, 120, 0.25, { type: 'triangle', vol: 0.05 }); },
  punch(level) { this.noise(0.5 + level * 0.15, { vol: 0.45, f0: 4000, f1: 120, attack: 0.002 }); this.tone(160, 30, 0.6, { vol: 0.5 }); if (level >= 3) this.thunder(); },
  whiff() { this.noise(0.25, { vol: 0.12, ft: 'bandpass', f0: 400, f1: 1800, q: 2 }); },
  victory() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, f, 0.32, { type: 'square', vol: 0.06, at: i * 0.12, filter: ['lowpass', 2600] })); },
  death() { [110, 117, 147].forEach((f) => this.tone(f, f * 0.7, 1.8, { type: 'sawtooth', vol: 0.07, filter: ['lowpass', 600] })); this.noise(1.2, { vol: 0.15, f0: 800, f1: 60 }); },
  wallCrack() { this.noise(0.6, { vol: 0.12, ft: 'bandpass', f0: 300, q: 3 }); this.tone(60, 50, 0.6, { vol: 0.1, vib: [30, 8] }); },
  wallBreak() { this.noise(0.8, { vol: 0.4, f0: 2500, f1: 150 }); this.tone(70, 30, 0.6, { vol: 0.35 }); },
  candlePlace() { this.noise(0.4, { vol: 0.06, ft: 'bandpass', f0: 300, f1: 1200, q: 2 }); this.tone(220, 330, 0.5, { type: 'triangle', vol: 0.04 }); },
  candleOut() { this.noise(0.22, { vol: 0.09, ft: 'highpass', f0: 2500, f1: 800 }); },
  eye() { [440, 466, 494].forEach((f, i) => this.tone(f, f, 0.9, { type: 'sine', vol: 0.04, at: i * 0.03, vib: [5, 6] })); },
  siren() { for (let i = 0; i < 3; i++) { this.tone(700, 1100, 0.25, { type: 'square', vol: 0.05, at: i * 0.5, filter: ['lowpass', 2500] }); this.tone(1100, 700, 0.25, { type: 'square', vol: 0.05, at: i * 0.5 + 0.25, filter: ['lowpass', 2500] }); } },
  whistle() { this.tone(2700, 2900, 0.35, { vol: 0.07, vib: [28, 120] }); },
  flashClick() { this.tone(3000, 2500, 0.025, { type: 'square', vol: 0.06 }); },
  flash() { this.noise(0.35, { vol: 0.15, ft: 'highpass', f0: 5000, f1: 1500 }); this.tone(1200, 400, 0.3, { type: 'triangle', vol: 0.06 }); },
  stamp() { this.tone(120, 60, 0.15, { vol: 0.25 }); this.noise(0.1, { vol: 0.15, f0: 900 }); },
  teleport() { this.tone(200, 2400, 0.3, { type: 'sawtooth', vol: 0.05, filter: ['bandpass', 1500, 2] }); this.tone(2400, 200, 0.3, { type: 'sawtooth', vol: 0.05, at: 0.25, filter: ['bandpass', 1500, 2] }); },
  summon() { this.tone(80, 400, 0.7, { type: 'square', vol: 0.06, filter: ['lowpass', 800], vib: [20, 30] }); this.noise(0.5, { vol: 0.1, ft: 'bandpass', f0: 400, f1: 2000 }); },
  saw() { this.tone(180, 260, 0.6, { type: 'sawtooth', vol: 0.06, vib: [45, 40], filter: ['bandpass', 1400, 1.5] }); },
  drill() { this.tone(120, 140, 0.5, { type: 'square', vol: 0.05, vib: [60, 30], filter: ['lowpass', 900] }); },
  spearWindup() { this.tone(1800, 3400, 0.6, { type: 'triangle', vol: 0.04, vib: [9, 30] }); },
  spear() { this.noise(0.2, { vol: 0.22, ft: 'bandpass', f0: 3000, f1: 800, q: 1.5 }); this.tone(900, 300, 0.12, { type: 'sawtooth', vol: 0.05 }); },
  well() { this.tone(300, 120, 0.4, { vol: 0.1, vib: [10, 40] }); this.noise(0.4, { vol: 0.06, ft: 'bandpass', f0: 900, f1: 300 }); },
  hatch() { this.noise(0.25, { vol: 0.2, ft: 'bandpass', f0: 2500, q: 2 }); this.tone(400, 200, 0.2, { type: 'square', vol: 0.06, at: 0.05 }); },
  evolve() { this.tone(70, 140, 1.2, { type: 'sawtooth', vol: 0.12, vib: [9, 20], filter: ['lowpass', 700] }); this.noise(1.0, { vol: 0.1, f0: 400, f1: 1600 }); },
  tentacle() { this.noise(0.12, { vol: 0.2, ft: 'bandpass', f0: 1800, q: 1 }); this.tone(600, 200, 0.12, { type: 'sawtooth', vol: 0.06 }); },
  beep() { this.tone(1600, 1600, 0.08, { type: 'square', vol: 0.05 }); },
  explosion() { this.noise(2.5, { vol: 0.6, f0: 2500, f1: 50, attack: 0.002 }); this.tone(80, 20, 1.8, { vol: 0.5 }); },
  hellgate() { [55, 58, 82].forEach((f) => this.tone(f, f * 0.6, 3, { type: 'sawtooth', vol: 0.09, filter: ['lowpass', 400] })); this.noise(3, { vol: 0.2, f0: 300, f1: 60 }); },
  machineBreak() { this.noise(0.5, { vol: 0.2, ft: 'bandpass', f0: 2000, f1: 400, q: 1 }); this.tone(400, 80, 0.4, { type: 'square', vol: 0.06 }); },

  // Cute, voice-modulated screams — one personality per killer
  scream(kind) {
    switch (kind) {
      case 'butcher': // baby lion "rawr~"
        this.voice([[0, 260], [0.15, 520], [0.5, 640], [0.9, 380]], { formants: [700, 1700], am: [26, 0.5], vibRate: 6, vibDepth: 40, vol: 0.26 });
        break;
      case 'witch': // toy-like giggle
        for (let i = 0; i < 5; i++) this.voice([[0, 980 - i * 60], [0.07, 1150 - i * 70], [0.11, 900 - i * 60]], { at: i * 0.13, formants: [1100, 2700], q: 6, vol: 0.18 });
        break;
      case 'janitor': // whistle, then a squeaky yelp
        this.whistle();
        this.voice([[0, 600], [0.1, 1250], [0.45, 1350], [0.7, 800]], { at: 0.35, formants: [1000, 2400], vibRate: 9, vibDepth: 45 });
        break;
      case 'evolver': // chirp-chirp-kyuu
        for (let i = 0; i < 3; i++) this.tone(1700, 2700, 0.07, { at: i * 0.1, type: 'triangle', vol: 0.09 });
        this.voice([[0, 1100], [0.12, 1800], [0.45, 900]], { at: 0.32, formants: [1500, 3000], vibRate: 14, vibDepth: 60, vol: 0.2 });
        break;
      case 'doctor': // burp-gurgle then "ueh!"
        this.voice([[0, 150], [0.3, 105]], { formants: [400, 900], am: [24, 0.7], vol: 0.25 });
        this.voice([[0, 420], [0.12, 950], [0.4, 620]], { at: 0.32, formants: [800, 2000], vibDepth: 25 });
        break;
      case 'samurai': // sharp "yah!"
        this.voice([[0, 480], [0.06, 880], [0.35, 720]], { formants: [750, 1250], q: 4, vibDepth: 15, vol: 0.28 });
        break;
      default:
        this.voice([[0, 600], [0.12, 1300], [0.6, 800]]);
    }
  },
  cackle() { this.scream('witch'); },

  // ── hunt mode ──
  victimScream(i) {
    const b = [1100, 1260, 980, 1380][i % 4];
    this.voice([[0, b * 0.7], [0.08, b * 1.3], [0.42, b * 1.15], [0.7, b * 0.8]], { formants: [1250, 3000], vibRate: 11, vibDepth: 70, vol: 0.18 });
  },
  kill() {
    this.noise(0.3, { vol: 0.3, f0: 1800, f1: 200 });
    this.tone(220, 60, 0.3, { vol: 0.28 });
    this.tone(90, 40, 0.5, { vol: 0.24, at: 0.22 });
  },
  baton() { this.tone(800, 2400, 0.18, { type: 'square', vol: 0.08, vib: [70, 200], filter: ['bandpass', 2000, 1.5] }); this.noise(0.15, { vol: 0.1, ft: 'highpass', f0: 3500 }); },
  dawn() {
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 1.6, { type: 'sine', vol: 0.05, at: i * 0.18 }));
    for (let i = 0; i < 6; i++) this.tone(rand(2600, 3600), rand(3000, 4200), 0.07, { type: 'sine', vol: 0.03, at: 0.9 + i * 0.13 });
  },
  huntStart() { this.tone(55, 41, 2.2, { type: 'sawtooth', vol: 0.09, filter: ['lowpass', 260] }); this.noise(1.6, { vol: 0.08, f0: 200, f1: 900 }); },

  startDrone() {
    if (!this.ok || this.drone) return;
    const ctx = this.ctx, t0 = ctx.currentTime;
    const g = ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.06, t0 + 2);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200; f.Q.value = 3;
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
    const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 82.4;
    const o3 = ctx.createOscillator(); o3.type = 'sine'; o3.frequency.value = 58.3;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 70;
    lfo.connect(lg); lg.connect(f.frequency);
    o1.connect(f); o2.connect(f); o3.connect(f); f.connect(g); g.connect(this.out);
    [o1, o2, o3, lfo].forEach((o) => o.start());
    this.drone = { g, nodes: [o1, o2, o3, lfo] };
  },
  stopDrone() {
    if (!this.drone) return;
    const d = this.drone, t = this.ctx.currentTime;
    d.g.gain.cancelScheduledValues(t); d.g.gain.setValueAtTime(d.g.gain.value, t); d.g.gain.linearRampToValueAtTime(0, t + 0.6);
    d.nodes.forEach((o) => o.stop(t + 0.7));
    this.drone = null;
  },
  creak() { this.tone(rand(90, 160), rand(70, 120), rand(0.6, 1.2), { type: 'sawtooth', vol: 0.025, filter: ['bandpass', rand(400, 900), 6], vib: [rand(6, 14), 12] }); },
};

// ── 03_input.js ──
// ─────────────────────────────────────────────────────────────
// Input — floating virtual joystick (touch anywhere), interaction &
// honey buttons, plus keyboard for desktop testing.
// All coordinates are in low-res pixels.
// ─────────────────────────────────────────────────────────────

const Input = {
  joy: { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0, vx: 0, vy: 0, mag: 0 },
  JOY_R: 20,
  keys: Object.create(null),
  // act = interact (run) / attack (hunt) · honey = honey jar · abil = killer ability · ctx = hunt context action
  btn: {
    act: { down: false, pressed: false, released: false, id: null }, honey: { down: false, pressed: false, released: false, id: null },
    abil: { down: false, pressed: false, released: false, id: null }, ctx: { down: false, pressed: false, released: false, id: null },
  },
  layout: { act: null, honey: null, abil: null, ctx: null },  // set by the HUD every frame: {x,y,r,visible}
  taps: [],
  anyKeyTap: false,

  init() {
    const cv = Screen.cv;
    const opts = { passive: false };
    cv.addEventListener('pointerdown', (e) => this.onDown(e), opts);
    window.addEventListener('pointermove', (e) => this.onMove(e), opts);
    window.addEventListener('pointerup', (e) => this.onUp(e), opts);
    window.addEventListener('pointercancel', (e) => this.onUp(e), opts);
    // stop iOS scroll / zoom / callout
    const stop = (e) => { if (e.cancelable) e.preventDefault(); };
    cv.addEventListener('touchstart', stop, opts);
    cv.addEventListener('touchmove', stop, opts);
    cv.addEventListener('touchend', stop, opts);
    document.addEventListener('gesturestart', stop, opts);
    cv.addEventListener('contextmenu', stop);
    window.addEventListener('keydown', (e) => this.onKey(e, true));
    window.addEventListener('keyup', (e) => this.onKey(e, false));
    window.addEventListener('blur', () => this.reset());
  },

  toLo(e) {
    const r = Screen.cv.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * Screen.dpr) / Screen.S, y: ((e.clientY - r.top) * Screen.dpr) / Screen.S };
  },
  hitBtn(name, p) {
    const b = this.layout[name];
    if (!b || !b.visible) return false;
    return dist(p.x, p.y, b.x, b.y) <= b.r + 7;
  },

  onDown(e) {
    if (e.cancelable) e.preventDefault();
    Sfx.init();
    const p = this.toLo(e);
    this.taps.push({ x: p.x, y: p.y, id: e.pointerId });
    for (const name of Object.keys(this.btn)) {
      if (this.hitBtn(name, p)) {
        const b = this.btn[name];
        b.down = true; b.pressed = true; b.id = e.pointerId;
        return;
      }
    }
    const j = this.joy;
    if (!j.active) {
      j.active = true; j.id = e.pointerId; j.ox = p.x; j.oy = p.y; j.x = p.x; j.y = p.y; j.vx = 0; j.vy = 0; j.mag = 0;
    }
  },
  onMove(e) {
    const j = this.joy;
    if (j.active && e.pointerId === j.id) {
      if (e.cancelable) e.preventDefault();
      const p = this.toLo(e);
      j.x = p.x; j.y = p.y;
      let dx = j.x - j.ox, dy = j.y - j.oy;
      const d = Math.hypot(dx, dy), R = this.JOY_R;
      if (d > R) { // floating base follows the thumb
        j.ox = j.x - (dx / d) * R; j.oy = j.y - (dy / d) * R;
        dx = j.x - j.ox; dy = j.y - j.oy;
      }
      const m = Math.min(1, Math.hypot(dx, dy) / R);
      j.mag = m < 0.18 ? 0 : m;
      const dd = Math.hypot(dx, dy) || 1;
      j.vx = (dx / dd) * j.mag; j.vy = (dy / dd) * j.mag;
    }
  },
  onUp(e) {
    const j = this.joy;
    if (j.active && e.pointerId === j.id) { j.active = false; j.id = null; j.vx = 0; j.vy = 0; j.mag = 0; }
    for (const name of Object.keys(this.btn)) {
      const b = this.btn[name];
      if (b.down && b.id === e.pointerId) { b.down = false; b.released = true; b.id = null; }
    }
  },
  onKey(e, down) {
    const k = e.key.toLowerCase();
    const map = { arrowup: 'u', w: 'u', arrowdown: 'd', s: 'd', arrowleft: 'l', a: 'l', arrowright: 'r', d: 'r' };
    if (map[k]) { this.keys[map[k]] = down; e.preventDefault(); }
    if (k === ' ' || k === 'e' || k === 'enter') {
      e.preventDefault();
      const b = this.btn.act;
      if (down && !b.down) { b.pressed = true; this.anyKeyTap = true; Sfx.init(); }
      if (!down && b.down) b.released = true;
      b.down = down;
    }
    const press = (name) => { const b = this.btn[name]; if (down && !b.down) b.pressed = true; if (!down && b.down) b.released = true; b.down = down; };
    if (k === 'q' || k === 'h') { press('honey'); press('ctx'); }
    if (k === 'c') press('ctx');
    if (k === 'r' || k === 'f') press('abil');
    if (down && k === 'k') this.huntKey = true; // menu shortcut: hunt mode
  },
  reset() {
    this.keys = Object.create(null);
    const j = this.joy; j.active = false; j.vx = 0; j.vy = 0; j.mag = 0;
    for (const b of Object.values(this.btn)) { b.down = false; b.pressed = false; b.released = false; }
  },

  // movement vector: joystick first, keyboard otherwise
  vector() {
    const j = this.joy;
    if (j.active && j.mag > 0) return { x: j.vx, y: j.vy, mag: j.mag };
    const k = this.keys;
    const x = (k.r ? 1 : 0) - (k.l ? 1 : 0), y = (k.d ? 1 : 0) - (k.u ? 1 : 0);
    if (!x && !y) return { x: 0, y: 0, mag: 0 };
    const d = Math.hypot(x, y);
    return { x: x / d, y: y / d, mag: 1 };
  },
  // "anything pressed" for menus / rhythm taps
  tapped() { return this.taps.length > 0 || this.anyKeyTap; },
  endFrame() {
    this.taps.length = 0; this.anyKeyTap = false; this.huntKey = false;
    for (const b of Object.values(this.btn)) { b.pressed = false; b.released = false; }
  },
};

// ── 04_map.js ──
// ─────────────────────────────────────────────────────────────
// Map — Pac-Man-style braided maze (no dead ends) with two-door
// pass-through rooms, furniture, and a pre-rendered tile layer.
// ─────────────────────────────────────────────────────────────

const T = { WALL: 0, FLOOR: 1, ROOM: 2, DOOR: 3, RUBBLE: 4 };
let M = null;

const ROOM_KINDS = {
  bathroom: { floor: 'tile', furn: [['toilet'], ['tub', 1], ['sink']] },
  bedroom: { floor: 'carpet', furn: [['bed', 1], ['wardrobe', 1], ['lamp']] },
  study: { floor: 'green', furn: [['bookshelf'], ['wardrobe', 1], ['desk']] },
  kitchen: { floor: 'kitchen', furn: [['pantry', 1], ['stove'], ['counter'], ['table']] },
  parlor: { floor: 'blue', furn: [['clock', 1], ['piano'], ['sofa'], ['plant']] },
};

const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

function genMap() {
  for (let attempt = 0; attempt < 80; attempt++) {
    const m = tryGenMap(CFG.CELLS_W, CFG.CELLS_H);
    if (m) return m;
  }
  throw new Error('map generation failed');
}

function tryGenMap(CW, CH) {
  const cellRoom = new Int16Array(CW * CH).fill(-1);
  const rooms = [];
  const sizes = [[2, 2], [2, 2], [2, 2], [2, 2], [2, 3], [3, 2]];
  let tries = 0;
  while (rooms.length < CFG.ROOMS && tries++ < 600) {
    const [rw, rh] = pick(sizes);
    const x0 = randi(1, CW - rw - 1), y0 = randi(1, CH - rh - 1);
    let ok = true;
    for (let y = y0 - 1; y <= y0 + rh && ok; y++)
      for (let x = x0 - 1; x <= x0 + rw; x++)
        if (x >= 0 && y >= 0 && x < CW && y < CH && cellRoom[y * CW + x] !== -1) { ok = false; break; }
    if (!ok) continue;
    const id = rooms.length;
    rooms.push({ id, cx0: x0, cy0: y0, cw: rw, ch: rh, doors: [] });
    for (let y = y0; y < y0 + rh; y++) for (let x = x0; x < x0 + rw; x++) cellRoom[y * CW + x] = id;
  }
  if (rooms.length < CFG.ROOMS - 1) return null;

  // corridor spanning tree (Kruskal) over non-room cells
  const N = CW * CH;
  const link = new Uint8Array(N); // bit k = connected toward DIRS[k]
  const parent = new Int32Array(N); for (let i = 0; i < N; i++) parent[i] = i;
  const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
  const free = (x, y) => x >= 0 && y >= 0 && x < CW && y < CH && cellRoom[y * CW + x] === -1;
  const addLink = (x, y, k) => { const [dx, dy] = DIRS[k]; link[y * CW + x] |= 1 << k; link[(y + dy) * CW + x + dx] |= 1 << ((k + 2) % 4); };
  const edges = [];
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
    if (!free(x, y)) continue;
    if (free(x + 1, y)) edges.push([x, y, 0]);
    if (free(x, y + 1)) edges.push([x, y, 1]);
  }
  shuffle(edges);
  for (const [x, y, k] of edges) {
    const [dx, dy] = DIRS[k];
    const a = find(y * CW + x), b = find((y + dy) * CW + x + dx);
    if (a !== b) { parent[a] = b; addLink(x, y, k); }
  }
  let root = -1;
  for (let i = 0; i < N; i++) if (cellRoom[i] === -1) { const r = find(i); if (root === -1) root = r; else if (r !== root) return null; }

  // braid: remove every dead end
  const deg = (i) => { let d = 0, l = link[i]; while (l) { d += l & 1; l >>= 1; } return d; };
  const order = [];
  for (let i = 0; i < N; i++) if (cellRoom[i] === -1) order.push(i);
  shuffle(order);
  for (const i of order) {
    if (deg(i) !== 1) continue;
    const x = i % CW, y = (i / CW) | 0;
    const cands = [];
    for (let k = 0; k < 4; k++) {
      const [dx, dy] = DIRS[k];
      if (free(x + dx, y + dy) && !(link[i] & (1 << k))) cands.push(k);
    }
    if (!cands.length) return null;
    const pref = cands.filter((k) => deg((y + DIRS[k][1]) * CW + x + DIRS[k][0]) === 1);
    addLink(x, y, pick(pref.length ? pref : cands));
  }
  for (const i of order) {
    const x = i % CW, y = (i / CW) | 0;
    for (const k of [0, 1]) {
      const [dx, dy] = DIRS[k];
      if (free(x + dx, y + dy) && !(link[i] & (1 << k)) && rnd() < CFG.EXTRA_LOOPS) addLink(x, y, k);
    }
  }

  // tiles
  const W = CW * 2 + 1, H = CH * 2 + 1;
  const t = new Uint8Array(W * H);
  const roomOf = new Int16Array(W * H).fill(-1);
  const roomWall = new Uint8Array(W * H);
  const doorAt = new Int16Array(W * H).fill(-1);
  const furnAt = new Int16Array(W * H).fill(-1);
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
    const i = y * CW + x;
    if (cellRoom[i] !== -1) continue;
    t[(2 * y + 1) * W + 2 * x + 1] = T.FLOOR;
    if (link[i] & 1) t[(2 * y + 1) * W + 2 * x + 2] = T.FLOOR;
    if (link[i] & 2) t[(2 * y + 2) * W + 2 * x + 1] = T.FLOOR;
  }
  const doors = [];
  for (const r of rooms) {
    r.x0 = 2 * r.cx0 + 1; r.y0 = 2 * r.cy0 + 1;
    r.x1 = 2 * (r.cx0 + r.cw - 1) + 1; r.y1 = 2 * (r.cy0 + r.ch - 1) + 1;
    for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) { t[y * W + x] = T.ROOM; roomOf[y * W + x] = r.id; }
    for (let y = r.y0 - 1; y <= r.y1 + 1; y++) for (let x = r.x0 - 1; x <= r.x1 + 1; x++) if (t[y * W + x] === T.WALL) roomWall[y * W + x] = 1;
    // two doors on opposite sides
    const pair = rnd() < 0.5 ? ['W', 'E'] : ['N', 'S'];
    for (const side of pair) {
      let cx, cy, ox, oy;
      if (side === 'W' || side === 'E') {
        cy = r.cy0 + randi(0, r.ch - 1); cx = side === 'W' ? r.cx0 : r.cx0 + r.cw - 1;
        ox = side === 'W' ? cx - 1 : cx + 1; oy = cy;
      } else {
        cx = r.cx0 + randi(0, r.cw - 1); cy = side === 'N' ? r.cy0 : r.cy0 + r.ch - 1;
        oy = side === 'N' ? cy - 1 : cy + 1; ox = cx;
      }
      const tx = cx + ox + 1, ty = cy + oy + 1;
      const d = { id: doors.length, x: tx, y: ty, horiz: side === 'W' || side === 'E', state: 'open', room: r.id, bash: 0, shake: 0, anim: 1 };
      d.inX = 2 * cx + 1; d.inY = 2 * cy + 1;   // interior tile next to the door
      d.outX = 2 * ox + 1; d.outY = 2 * oy + 1; // corridor tile next to the door
      doors.push(d); r.doors.push(d.id);
      t[ty * W + tx] = T.DOOR; doorAt[ty * W + tx] = d.id; roomWall[ty * W + tx] = 0;
    }
  }

  const m = { w: W, h: H, t, roomOf, roomWall, doorAt, furnAt, rooms, doors, furn: [], toilets: [], hideSpots: [], wells: [] };
  if (!furnishRooms(m)) return null;
  // initial locks (bathroom doors stay open so the toilet pair is usable)
  for (const d of doors) if (m.rooms[d.room].kind !== 'bathroom' && rnd() < CFG.LOCKED_DOOR_P) d.state = 'locked';
  return m;
}

function furnishRooms(m) {
  const kinds = ['bathroom', 'bathroom'];
  const rest = shuffle(['bedroom', 'bedroom', 'study', 'kitchen', 'parlor', 'bedroom', 'study', 'parlor']);
  // spread bathrooms apart: first and the farthest room from it
  const rs = m.rooms.slice();
  const a = rs[0];
  let far = rs[1], best = -1;
  for (const r of rs.slice(1)) { const d = Math.abs(r.x0 - a.x0) + Math.abs(r.y0 - a.y0); if (d > best) { best = d; far = r; } }
  a.kind = 'bathroom'; far.kind = 'bathroom';
  let k = 0;
  for (const r of rs) if (!r.kind) r.kind = rest[k++ % rest.length];
  kinds.length = 0;

  for (const r of m.rooms) {
    const spec = ROOM_KINDS[r.kind];
    const inside = [];
    for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) inside.push([x, y]);
    const doorIn = r.doors.map((id) => [m.doors[id].inX, m.doors[id].inY]);
    const isDoorIn = (x, y) => doorIn.some(([a, b]) => a === x && b === y);
    // furniture with a button (hide / toilet) never shares a standing tile with a door or with another kind of button
    const nearDoor = (x, y) => doorIn.some(([a, b]) => Math.abs(a - x) + Math.abs(b - y) <= 1);
    const action = (kind, hide) => (hide ? 'hide' : kind === 'toilet' ? 'toilet' : null);
    const clash = (x, y, act) => act && (nearDoor(x, y) || placed.some((f) => { const o = action(f.kind, f.hide); return o && o !== act && Math.abs(f.x - x) + Math.abs(f.y - y) === 2; }));
    const edge = (x, y) => x === r.x0 || x === r.x1 || y === r.y0 || y === r.y1;
    const occ = new Set();
    const placed = [];
    const connected = () => {
      // BFS over free interior tiles from first door; must reach other door + an access tile for each placed item
      const key = (x, y) => y * m.w + x;
      const seen = new Set([key(...doorIn[0])]);
      const q = [doorIn[0]];
      while (q.length) {
        const [x, y] = q.shift();
        for (const [dx, dy] of DIRS) {
          const nx = x + dx, ny = y + dy;
          if (nx < r.x0 || nx > r.x1 || ny < r.y0 || ny > r.y1) continue;
          const kk = key(nx, ny);
          if (seen.has(kk) || occ.has(kk)) continue;
          seen.add(kk); q.push([nx, ny]);
        }
      }
      if (!doorIn.every(([x, y]) => seen.has(key(x, y)))) return false;
      for (const f of placed) {
        const acc = DIRS.map(([dx, dy]) => [f.x + dx, f.y + dy]).find(([x, y]) => seen.has(key(x, y)));
        if (!acc) return false;
        f.ax = acc[0]; f.ay = acc[1];
      }
      return true;
    };
    for (const [kind, hide] of spec.furn) {
      if (placed.length >= Math.max(2, Math.floor(inside.length / 3))) break;
      const act = action(kind, hide);
      const cands = shuffle(inside.filter(([x, y]) => edge(x, y) && !isDoorIn(x, y) && !occ.has(y * m.w + x) && !clash(x, y, act)));
      for (const [x, y] of cands) {
        occ.add(y * m.w + x);
        const f = { id: m.furn.length + placed.length, kind, x, y, room: r.id, hide: !!hide, ax: x, ay: y, occupied: false, shake: 0 };
        placed.push(f);
        if (connected()) break;
        placed.pop(); occ.delete(y * m.w + x);
      }
    }
    connected();
    if (r.kind === 'bathroom' && !placed.some((f) => f.kind === 'toilet')) return false;
    for (const f of placed) {
      f.id = m.furn.length;
      m.furn.push(f);
      m.furnAt[f.y * m.w + f.x] = f.id;
      if (f.hide) m.hideSpots.push(f);
      if (f.kind === 'toilet') m.toilets.push(f);
    }
  }
  return m.toilets.length === 2;
}

// ── queries ──
const inB = (x, y) => x >= 0 && y >= 0 && x < M.w && y < M.h;
const tAt = (x, y) => (inB(x, y) ? M.t[y * M.w + x] : T.WALL);
function doorAt(x, y) { if (!inB(x, y)) return null; const id = M.doorAt[y * M.w + x]; return id >= 0 ? M.doors[id] : null; }
function furnAt(x, y) { if (!inB(x, y)) return null; const id = M.furnAt[y * M.w + x]; return id >= 0 ? M.furn[id] : null; }
function isFloorish(t) { return t === T.FLOOR || t === T.ROOM || t === T.RUBBLE; }
// walkable for everyone; locked doors handled by the caller where relevant
function walkable(x, y) {
  const t = tAt(x, y);
  if (t === T.WALL) return false;
  if (t === T.DOOR) return doorAt(x, y).state !== 'locked';
  return M.furnAt[y * M.w + x] < 0;
}
function opaque(x, y) {
  const t = tAt(x, y);
  if (t === T.WALL) return true;
  if (t === T.DOOR) return doorAt(x, y).state === 'locked';
  return false;
}
// a floor tile items/spawns can sit on
function openTile(x, y) { const t = tAt(x, y); return isFloorish(t) && M.furnAt[y * M.w + x] < 0; }
function allOpenTiles() {
  const out = [];
  for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) if (openTile(x, y)) out.push([x, y]);
  return out;
}
// a candle here would not share a button tile with a door, hiding spot or toilet
function candleSpotClear(x, y) {
  for (const d of M.doors) if (Math.abs(d.x - x) + Math.abs(d.y - y) <= 2) return false;
  for (const f of M.furn) if ((f.hide || f.kind === 'toilet') && Math.abs(f.x - x) + Math.abs(f.y - y) <= 2) return false;
  return true;
}
function inLockedRoom(x, y) {
  const r = M.roomOf[y * M.w + x];
  if (r < 0) return false;
  return M.rooms[r].doors.every((id) => M.doors[id].state === 'locked');
}
// butcher: a wall tile separating two corridor tiles in a straight line
function breakableWall(x, y) {
  if (x <= 0 || y <= 0 || x >= M.w - 1 || y >= M.h - 1) return false;
  if (tAt(x, y) !== T.WALL || M.roomWall[y * M.w + x]) return false;
  const corr = (a, b) => { const t = tAt(a, b); return (t === T.FLOOR || t === T.RUBBLE) && M.roomOf[b * M.w + a] < 0; };
  return (corr(x - 1, y) && corr(x + 1, y)) || (corr(x, y - 1) && corr(x, y + 1));
}

// ─────────────────────────────────────────────────────────────
// Pre-rendered tile layer (ImageData for speed)
// ─────────────────────────────────────────────────────────────
const MapGfx = { cv: null, ctx: null, img: null, ol: null, olx: null };
const _rgb = {};
function hexRgb(h) { if (_rgb[h]) return _rgb[h]; const n = parseInt(h.slice(1), 16); return (_rgb[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]); }

function renderMap() {
  const TS = CFG.TS;
  MapGfx.cv = document.createElement('canvas');
  MapGfx.cv.width = M.w * TS; MapGfx.cv.height = M.h * TS;
  MapGfx.ctx = MapGfx.cv.getContext('2d');
  const img = MapGfx.ctx.createImageData(M.w * TS, M.h * TS);
  for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) paintTile(img.data, M.w * TS, x, y, 0, 0);
  MapGfx.ctx.putImageData(img, 0, 0);
  // outline layer: drawn over the fog so the maze shape is always readable
  MapGfx.ol = document.createElement('canvas');
  MapGfx.ol.width = M.w * TS; MapGfx.ol.height = M.h * TS;
  MapGfx.olx = MapGfx.ol.getContext('2d');
  for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) paintOutlineTile(MapGfx.olx, x, y);
}
// re-render a tile (and its neighbours whose shading depends on it)
function rerenderTiles(x, y) {
  const TS = CFG.TS;
  for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) {
    if (!inB(xx, yy)) continue;
    const img = MapGfx.ctx.createImageData(TS, TS);
    paintTile(img.data, TS, xx, yy, xx * TS, yy * TS);
    MapGfx.ctx.putImageData(img, xx * TS, yy * TS);
    MapGfx.olx.clearRect(xx * TS, yy * TS, TS, TS);
    paintOutlineTile(MapGfx.olx, xx, yy);
  }
}

// Path outline: a 1px line on every floor edge that touches a wall (Pac-Man style),
// plus the corner pixel where a wall pillar meets two open sides diagonally.
const OUTLINE_C = '#b08a84';
function paintOutlineTile(g, x, y) {
  const open = (a, b) => inB(a, b) && tAt(a, b) !== T.WALL;
  if (!open(x, y)) return;
  const TS = CFG.TS, X = x * TS, Y = y * TS;
  g.fillStyle = OUTLINE_C;
  const n = open(x, y - 1), s = open(x, y + 1), w = open(x - 1, y), e = open(x + 1, y);
  if (!n) g.fillRect(X, Y, TS, 1);
  if (!s) g.fillRect(X, Y + TS - 1, TS, 1);
  if (!w) g.fillRect(X, Y, 1, TS);
  if (!e) g.fillRect(X + TS - 1, Y, 1, TS);
  if (n && e && !open(x + 1, y - 1)) g.fillRect(X + TS - 1, Y, 1, 1);
  if (n && w && !open(x - 1, y - 1)) g.fillRect(X, Y, 1, 1);
  if (s && e && !open(x + 1, y + 1)) g.fillRect(X + TS - 1, Y + TS - 1, 1, 1);
  if (s && w && !open(x - 1, y + 1)) g.fillRect(X, Y + TS - 1, 1, 1);
}

function paintTile(d, stride, tx, ty, offX, offY) {
  const TS = CFG.TS;
  const t = tAt(tx, ty);
  const set = (gx, gy, hex) => { const c = hexRgb(hex); const o = ((gy - offY) * stride + (gx - offX)) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; };
  const rid = M.roomOf[ty * M.w + tx];
  const room = rid >= 0 ? M.rooms[rid] : null;
  for (let j = 0; j < TS; j++) for (let i = 0; i < TS; i++) {
    const gx = tx * TS + i, gy = ty * TS + j;
    let c;

// ─────────────────────────────────────────────────────────────
// Pathfinding (Dijkstra on tiles) and line of sight (grid DDA)
// Edges: 4-neighbour walk · locked door (bash cost or key) ·

// ── 07_fx.js ──
// ─────────────────────────────────────────────────────────────
// FX — particles (world px coords), floor decals, lightning bolts

      const x = d.x - camX, y = d.y - camY;
      if (x < -10 || y < -10 || x > Screen.W + 10 || y > Screen.H + 10) continue;
      if (d.kind === 'blood') disc(x, y, d.r, d.c || C.blood);
      else if (d.kind === 'debris') px(x, y, d.c || C.rubble);
    }
  },

  draw(camX, camY, glowLayer) {
    for (const p of this.parts) {
      if (!!p.glow !== glowLayer) continue;
      const x = p.x - camX, y = p.y - camY;
      if (x < -20 || y < -20 || x > Screen.W + 20 || y > Screen.H + 20) continue;
      const f = p.t / p.life;
      if (p.kind === 'ring') {
        L.globalAlpha = 1 - f;
        ring(x, y, lerp(p.r0, p.r1, Ease.outCubic(f)), p.c);
        L.globalAlpha = 1;
      } else if (p.kind === 'puff') {
        L.globalAlpha = (1 - f) * 0.7;
        disc(x, y, p.size + p.grow * f, p.c);
        L.globalAlpha = 1;
      } else {
        if (f > 0.7) L.globalAlpha = (1 - f) / 0.3;
        rect(x - (p.size >> 1), y - (p.size >> 1), p.size, p.size, p.c);
        L.globalAlpha = 1;
      }
    }
    if (glowLayer) {
      for (const b of this.bolts) {
        const f = b.t / b.life;
        if (f > 0.15 && f < 0.3 && ((b.t * 60) | 0) % 2) continue; // flicker
        L.globalAlpha = f < 0.6 ? 1 : (1 - f) / 0.4;
        const P = b.pts;
        for (let i = 0; i + 3 < P.length; i += 2) {
          thickLine(P[i] - camX, P[i + 1] - camY, P[i + 2] - camX, P[i + 3] - camY, 4, rgba(C.gold, 0.5));
        }
        for (const br of b.branches) for (let i = 0; i + 3 < br.length; i += 2) line(br[i] - camX, br[i + 1] - camY, br[i + 2] - camX, br[i + 3] - camY, C.goldHi);
        for (let i = 0; i + 3 < P.length; i += 2) thickLine(P[i] - camX, P[i + 1] - camY, P[i + 2] - camX, P[i + 3] - camY, 2, '#ffffff');
        L.globalAlpha = 1;
      }
    }
  },
};

// ── 08_rig.js ──
// ─────────────────────────────────────────────────────────────
// Procedural 3D rig → 3/4 projection → crisp pixel primitives.
// Every joint is recomputed each frame from continuous phase/angle,
// so motion is as finely subdivided as the display refresh allows.
// Local space: f = forward, r = right, z = up (pixels).
// ─────────────────────────────────────────────────────────────

const K3 = 0.62; // ground-plane foreshortening for the 3/4 view

class Rig {
  constructor(X, Y, ang, s = 1, tilt = 0, roll = 0) {
    this.X = X; this.Y = Y; this.s = s;
    this.fx = Math.cos(ang); this.fy = Math.sin(ang);
    this.rx = -Math.sin(ang); this.ry = Math.cos(ang);
    this.ct = Math.cos(tilt); this.st = Math.sin(tilt);
    this.cr = Math.cos(roll); this.sr = Math.sin(roll);
    this.ops = [];
    this.flash = null;
  }
  P(f, r, z) {
    const f2 = f * this.ct + z * this.st;
    let z2 = -f * this.st + z * this.ct;
    const r2 = r * this.cr - z2 * this.sr;
    z2 = r * this.sr + z2 * this.cr;
    const wx = (this.fx * f2 + this.rx * r2) * this.s, wy = (this.fy * f2 + this.ry * r2) * this.s;
    return { x: this.X + wx, y: this.Y + wy * K3 - z2 * this.s, d: wy + z2 * 0.002 };
  }
  Pj(j) { return this.P(j[0], j[1], j[2]); }
  line(a, b, w, c, db = 0) { this.ops.push({ k: 0, a, b, w: Math.max(1, w * this.s), c, d: (a.d + b.d) / 2 + db }); }
  disc(p, r, c, db = 0) { this.ops.push({ k: 1, p, r: r * this.s, c, d: p.d + db }); }
  poly(pts, c, db = 0) { let d = 0; for (const p of pts) d += p.d; this.ops.push({ k: 2, pts, c, d: d / pts.length + db }); }
  fn(d, draw) { this.ops.push({ k: 3, d, draw }); }
  render(outline = C.ink) {
    const ops = this.ops.sort((a, b) => a.d - b.d);
    const fl = this.flash;
    if (outline) {
      for (const o of ops) {
        if (o.k === 0) thickLine(o.a.x, o.a.y, o.b.x, o.b.y, o.w + 2, outline);
        else if (o.k === 1) disc(o.p.x, o.p.y, o.r + 1, outline);
        else if (o.k === 2) {
          const n = o.pts.length;
          for (let i = 0; i < n; i++) { const a = o.pts[i], b = o.pts[(i + 1) % n]; thickLine(a.x, a.y, b.x, b.y, 2, outline); }
        }
      }
    }
    for (const o of ops) {
      const c = fl && o.c ? fl : o.c;
      if (o.k === 0) thickLine(o.a.x, o.a.y, o.b.x, o.b.y, o.w, c);
      else if (o.k === 1) disc(o.p.x, o.p.y, o.r, c);
      else if (o.k === 2) { const flat = []; for (const p of o.pts) flat.push(p.x, p.y); poly(flat, c); }
      else if (o.k === 3 && !fl) o.draw();
    }
  }
}

function groundShadow(X, Y, rx, ry, a = 0.45) {
  L.globalAlpha = a;
  ellipse(X, Y + 0.5, rx, ry, 0, '#000000');
  L.globalAlpha = 1;
}

// ── humanoid pose generator ──────────────────────────────────
// o: phase, amt(0..1 stride), lean, hunch, leg, torso, sh, hip, armAmp,
//    breath, handR/handL overrides [f,r,z], crouch, headTurn
function humanPose(o) {
  const s = Math.sin(o.phase), c = Math.cos(o.phase);
  const amt = o.amt;
  const stride = (o.stride ?? 3.4) * amt;
  const leg = o.leg ?? 8, torso = o.torso ?? 5, sh = o.sh ?? 3.2, hip = o.hip ?? 1.8;
  const bob = Math.abs(c) * 0.8 * amt;
  const hipZ = leg - (o.crouch || 0) + bob * 0.6;
  const lean = (o.lean || 0) + amt * 1.1;
  const hunch = o.hunch || 0;
  const J = {};
  const fL = s * stride, fR = -s * stride;
  const liftL = Math.max(0, c) * 2.3 * amt, liftR = Math.max(0, -c) * 2.3 * amt;
  J.hipL = [lean * 0.25, -hip, hipZ];
  J.hipR = [lean * 0.25, hip, hipZ];
  J.hipC = [lean * 0.25, 0, hipZ];
  J.footL = [fL, -hip * 0.95, liftL];
  J.footR = [fR, hip * 0.95, liftR];
  J.kneeL = [(J.hipL[0] + fL) / 2 + 0.9 + liftL * 0.45, -hip, (hipZ + liftL) / 2 + liftL * 0.3];
  J.kneeR = [(J.hipR[0] + fR) / 2 + 0.9 + liftR * 0.45, hip, (hipZ + liftR) / 2 + liftR * 0.3];
  const chestZ = hipZ + torso - hunch * 0.6 + (o.breath || 0);
  J.chest = [lean + hunch, 0, chestZ];
  const tw = -s * 0.24 * amt + (o.twist || 0);
  J.shL = [J.chest[0] + sh * Math.sin(tw), -sh * Math.cos(tw), chestZ - 0.4];
  J.shR = [J.chest[0] - sh * Math.sin(tw), sh * Math.cos(tw), chestZ - 0.4];
  const arm = (o.armAmp ?? 3) * amt;
  const swL = -s * arm, swR = s * arm;
  J.handL = o.handL || [J.shL[0] + swL, J.shL[1] * 1.15, chestZ - 5.2 + Math.max(0, swL) * 0.35];
  J.handR = o.handR || [J.shR[0] + swR, J.shR[1] * 1.15, chestZ - 5.2 + Math.max(0, swR) * 0.35];
  const elbow = (shJ, hand, side) => [(shJ[0] + hand[0]) / 2 - 0.9, (shJ[1] + hand[1]) / 2 + side * 0.5, (shJ[2] + hand[2]) / 2 + 0.2];
  J.elbL = elbow(J.shL, J.handL, -1);
  J.elbR = elbow(J.shR, J.handR, 1);
  J.head = [J.chest[0] + lean * 0.35 + hunch * 0.9, 0, chestZ + (o.neck ?? 3.4) - hunch * 0.5];
  J.headAng = o.headTurn || 0;
  return J;
}

// shared humanoid body: legs, torso, arms, head. Colors in `k`.
function drawHumanBody(rig, J, k, dims) {
  const P = (j) => rig.Pj(j);
  const hl = P(J.hipL), hr = P(J.hipR), kl = P(J.kneeL), kr = P(J.kneeR), fl = P(J.footL), fr = P(J.footR);
  // legs
  rig.line(hl, kl, dims.thigh ?? 2.2, k.legs); rig.line(kl, fl, dims.shin ?? 2, k.legs2 || k.legs);
  rig.line(hr, kr, dims.thigh ?? 2.2, k.legs); rig.line(kr, fr, dims.shin ?? 2, k.legs2 || k.legs);
  rig.disc(fl, dims.foot ?? 1.2, k.boot, 0.01); rig.disc(fr, dims.foot ?? 1.2, k.boot, 0.01);
  // torso
  const hc = P(J.hipC), ch = P(J.chest);
  rig.line(hc, ch, dims.torsoW ?? 5, k.body);
  rig.disc(ch, (dims.torsoW ?? 5) * 0.55, k.body, 0.02);
  if (k.belly) rig.disc(P([J.hipC[0] + 0.6, 0, J.hipC[2] + 1.2]), (dims.torsoW ?? 5) * 0.48, k.belly, 0.03);
  // arms
  const sl = P(J.shL), sr = P(J.shR), el = P(J.elbL), er = P(J.elbR), hal = P(J.handL), har = P(J.handR);
  rig.line(sl, el, dims.arm ?? 1.7, k.sleeve || k.body); rig.line(el, hal, dims.fore ?? 1.5, k.sleeve2 || k.sleeve || k.body);
  rig.line(sr, er, dims.arm ?? 1.7, k.sleeve || k.body); rig.line(er, har, dims.fore ?? 1.5, k.sleeve2 || k.sleeve || k.body);
  rig.disc(hal, dims.hand ?? 1, k.hand); rig.disc(har, dims.hand ?? 1, k.hand);
  return { hl, hr, kl, kr, fl, fr, hc, ch, sl, sr, el, er, hal, har };
}

// face direction helper: returns points on the head sphere
function headPts(rig, J, R, turn = 0) {
  const a = turn;
  const hf = J.head[0], hz = J.head[2];
  const front = (d, side, dz = 0) => rig.P(hf + Math.cos(a) * d - Math.sin(a) * side, Math.sin(a) * d + Math.cos(a) * side, hz + dz);
  return { c: rig.Pj(J.head), front, R };
}

// ═════════════════════════════════════════════════════════════
// Characters

function drawRunner(X, Y, st) {
  const rig = new Rig(X, Y, st.ang, st.scale || 1, st.tilt || 0, st.roll || 0);
  if (st.flash) rig.flash = st.flash;
  const J = humanPose({ phase: st.phase, amt: st.amt, breath: st.breath, lean: st.lean, headTurn: st.headTurn, crouch: st.crouch, handL: st.handL, handR: st.handR });
  // st.pal recolours the raincoat (hunt-mode victims); st.dead draws X eyes
  const pal = st.pal || { coat: C.coat, coat2: C.coat2, legs: '#2d3552' };
  const k = { legs: pal.legs, legs2: shade(pal.legs, 0.78), boot: C.boot, body: pal.coat, sleeve: pal.coat, sleeve2: pal.coat2, hand: C.skin };
  drawHumanBody(rig, J, k, {});
  // coat hem flares behind the hips
  rig.disc(rig.P(J.hipC[0] - 0.6, 0, J.hipC[2] - 1.4), 2.7, pal.coat2, -0.05);
  const H = headPts(rig, J, 3.2, J.headAng);
  rig.disc(H.c, 3.3, pal.coat, 0.05);              // hood
  rig.disc(H.front(1.4, 0, -0.2), 2.2, C.skin, 0.12); // face opening
  rig.disc(H.front(-1.6, 0, 0.6), 2.2, pal.coat2, 0.04);
  rig.fn(rig.Pj(J.head).d + 0.3, () => {
    const e1 = H.front(3.1, -1, 0.2), e2 = H.front(3.1, 1, 0.2);
    if (st.dead) { px(e1.x, e1.y, C.blood2); px(e2.x, e2.y, C.blood2); return; }
    if (rig.fy > -0.25) { px(e1.x, e1.y, '#1b1214'); px(e2.x, e2.y, '#1b1214'); }
  });
  rig.render();
  return rig;
}

// Cape-wearing muscle giant with a lightning chest emblem
function drawHero(X, Y, st, t) {
  const rig = new Rig(X, Y, st.ang, (st.scale || 1) * 1.42, st.tilt || 0, 0);
  if (st.flash) rig.flash = st.flash;
  const J = humanPose({ phase: st.phase, amt: st.amt, breath: st.breath, lean: st.lean, sh: 4.3, hip: 2.1, torso: 5.6, leg: 8.2, armAmp: 3.4, stride: 3.8, handR: st.handR, handL: st.handL });
  // cape (behind)
  // cape hangs from the shoulders and streams back + down with speed
  const fl = Math.sin(t * 9) * 0.7 * (0.4 + st.amt);
  const tipZ = 0.8 + st.amt * 2.2, back = -2.2 - st.amt * 3.2;
  const cL = rig.Pj(J.shL), cR = rig.Pj(J.shR), nape = rig.P(J.chest[0] - 1.4, 0, J.chest[2] + 0.4);
  const tL = rig.P(back + fl, -3.6, tipZ), tR = rig.P(back - fl, 3.6, tipZ + 0.4), tM = rig.P(back - 0.8, 0, tipZ - 0.5 + fl * 0.4);
  rig.poly([cL, nape, tM, tL], '#efe6d2', -0.6);
  rig.poly([cR, tR, tM, nape], '#cfc4ad', -0.6);
  const k = { legs: C.hero, legs2: C.hero2, boot: C.gold, body: C.hero, sleeve: C.hero, sleeve2: C.hero, hand: C.heroSkin };
  const B = drawHumanBody(rig, J, k, { thigh: 2.8, shin: 2.4, torsoW: 7, arm: 2.6, fore: 2.3, hand: 1.4, foot: 1.5 });
  // belt
  rig.line(rig.P(J.hipC[0] + 0.3, -2.4, J.hipC[2] + 0.8), rig.P(J.hipC[0] + 0.3, 2.4, J.hipC[2] + 0.8), 1.2, C.gold, 0.08);
  // chest bolt emblem
  rig.fn(B.ch.d + 0.4, () => {
    if (rig.fy < -0.3) return;
    const p = rig.P(J.chest[0] + 2.6, 0, J.chest[2] - 0.5);
    const c = st.flash || C.gold;
    px(p.x + 1, p.y - 2, c); px(p.x, p.y - 1, c); px(p.x - 1, p.y, c); px(p.x, p.y, c); px(p.x + 1, p.y, c); px(p.x, p.y + 1, c); px(p.x - 1, p.y + 2, c);
  });
  const H = headPts(rig, J, 3.2);
  rig.disc(H.c, 3.0, C.heroSkin, 0.05);
  rig.disc(H.front(-1.2, 0, 1.2), 2.6, '#1a1210', 0.06); // hair (back)
  rig.disc(H.front(0.2, 0, 2.2), 2.3, '#1a1210', 0.07);  // hair (crown, visible from the front)
  rig.fn(B.ch.d + 0.5, () => {
    if (rig.fy > -0.25) { const e1 = H.front(2.7, -1, 0.4), e2 = H.front(2.7, 1, 0.4); px(e1.x, e1.y, '#ffffff'); px(e2.x, e2.y, '#ffffff'); }
  });
  rig.render();
}

// Generic killer humanoid builder (style-driven)
function drawKillerHuman(X, Y, st, style) {
  const rig = new Rig(X, Y, st.ang, (st.scale || 1) * style.scale, st.tilt || 0, st.roll || 0);
  if (st.flash) rig.flash = st.flash;
  const J = humanPose({
    phase: st.phase, amt: st.amt, breath: st.breath, lean: style.lean || 0, hunch: style.hunch || 0,
    sh: style.sh, hip: style.hip, torso: style.torso, leg: style.leg, stride: style.stride, armAmp: style.armAmp,
    handR: st.handR, handL: st.handL, neck: style.neck,
  });
  if (style.behind) style.behind(rig, J, st);
  const B = drawHumanBody(rig, J, style.k, style.dims || {});
  if (style.extra) style.extra(rig, J, st, B);
  rig.render();
  return rig;
}

// attack arm helper: windup (raised back) → strike (forward slash) → recover
function attackHand(st, base) {
  const a = st.atk;
  if (!a) return null;
  if (a.phase === 'windup') { const u = Ease.outCubic(a.f); return [lerp(base[0], -1.5, u), lerp(base[1], 3.4, u), lerp(base[2], 17, u)]; }
  if (a.phase === 'strike') { const u = Ease.outCubic(a.f); return [lerp(-1.5, 6.5, u), lerp(3.4, -1, u), lerp(17, 7, u)]; }
  if (a.phase === 'recover') { const u = Ease.inOutSine(a.f); return [lerp(6.5, base[0], u), lerp(-1, base[1], u), lerp(7, base[2], u)]; }
  return null;
}

// ── 09_cast.js ──
// ─────────────────────────────────────────────────────────────
// Cast — the six killers, the Doctor's machines, the Evolver stages
// ─────────────────────────────────────────────────────────────

function weaponDir(B) {
  const dx = B.har.x - B.er.x, dy = B.har.y - B.er.y, d = Math.hypot(dx, dy) || 1;
  return [dx / d, dy / d];
}
function smear(rig, st, B, c = 'rgba(230,230,240,0.35)') {
  if (!st.atk || st.atk.phase !== 'strike' || st.atk.f > 0.7) return;
  rig.fn(B.har.d + 1, () => {
    const a = st.atk.f;
    L.globalAlpha = 0.5 * (1 - a);
    for (let i = 1; i <= 3; i++) disc(lerp(B.har.x, B.ch.x, i * 0.18), lerp(B.har.y, B.ch.y - 6, i * 0.18), 1.6, '#e8e8f0');
    L.globalAlpha = 1;
  });
}

// ── 도살자 · lion mask, cleaver ──
const STY_BUTCHER = {
  scale: 1.3, sh: 3.8, hip: 2.1, torso: 5.4, leg: 7.6, stride: 3.6, armAmp: 2.4,
  k: { legs: '#3a2a22', legs2: '#2a1d18', boot: '#191214', body: '#d6ccbc', sleeve: '#b9845f', sleeve2: '#a5714f', hand: '#9f6a48', belly: '#cbbfab' },
  dims: { thigh: 2.6, shin: 2.3, torsoW: 6.4, arm: 2.3, fore: 2.1, hand: 1.3 },
  extra(rig, J, st, B) {
    rig.disc(rig.P(J.chest[0] + 2.1, -0.9, J.chest[2] - 2.2), 1.2, C.blood2, 0.25);
    rig.disc(rig.P(J.hipC[0] + 2.2, 1, J.hipC[2] + 1.5), 0.9, C.blood, 0.25);
    const hc = rig.Pj(J.head), s = rig.s;
    // mane (behind the mask)
    rig.fn(hc.d - 0.15, () => {
      const pts = [];
      for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU + Math.sin(st.t * 2) * 0.05; const r = (i % 2 ? 4.2 : 6.0) * s; pts.push(hc.x + Math.cos(a) * r, hc.y - 0.5 + Math.sin(a) * r * 0.92); }
      const out = []; for (let i = 0; i < pts.length; i += 2) { const dx = pts[i] - hc.x, dy = pts[i + 1] - hc.y + 0.5, d = Math.hypot(dx, dy) || 1; out.push(pts[i] + dx / d, pts[i + 1] + dy / d); }
      poly(out, C.ink);
      poly(pts, st.flash || '#b8641e');
      disc(hc.x, hc.y - 0.5, 4.2 * s, st.flash || '#8a4512');
    });
    const H = headPts(rig, J, 3);
    rig.disc(hc, 3.0, '#ddb070', 0.05);
    rig.disc(H.front(-0.4, -2.4, 2.6), 0.9, '#c8924f', 0.06);
    rig.disc(H.front(-0.4, 2.4, 2.6), 0.9, '#c8924f', 0.06);
    rig.disc(H.front(1.9, 0, -0.9), 1.5, '#f0d7a6', 0.1);
    rig.fn(hc.d + 0.3, () => {
      if (rig.fy < -0.25) return;
      const e1 = H.front(2.7, -1.1, 0.7), e2 = H.front(2.7, 1.1, 0.7), n = H.front(3.2, 0, -0.4);
      px(e1.x, e1.y, '#120a0a'); px(e2.x, e2.y, '#120a0a'); px(n.x, n.y, '#3a1a10');
      // crack across the mask
      const c1 = H.front(2.6, -1.8, 1.8); px(c1.x, c1.y, '#6a4020');
    });
    // cleaver
    rig.fn(B.har.d + 0.5, () => {
      const [dx, dy] = weaponDir(B), nx = -dy, ny = dx, s2 = rig.s;
      const b0x = B.har.x + dx * 1.2 * s2, b0y = B.har.y + dy * 1.2 * s2, b1x = B.har.x + dx * 6.5 * s2, b1y = B.har.y + dy * 6.5 * s2;
      const w = 2.6 * s2;
      poly([b0x, b0y, b1x, b1y, b1x + nx * w, b1y + ny * w, b0x + nx * w, b0y + ny * w], st.flash || C.ink);
      poly([b0x + nx * 0.6, b0y + ny * 0.6, b1x - dx * 0.6 + nx * 0.6, b1y - dy * 0.6 + ny * 0.6, b1x - dx * 0.6 + nx * (w - 0.6), b1y - dy * 0.6 + ny * (w - 0.6), b0x + nx * (w - 0.6), b0y + ny * (w - 0.6)], st.flash || '#c4c9cf');
      line(b0x + nx * (w - 0.5), b0y + ny * (w - 0.5), b1x + nx * (w - 0.5), b1y + ny * (w - 0.5), st.flash || '#eef1f4');
      px(b1x + nx, b1y + ny, C.blood2);
      line(B.har.x, B.har.y, B.har.x - dx * 2, B.har.y - dy * 2, '#3a2214');
    });
    smear(rig, st, B);

};

// ── 초진화체 stages ──
function drawEgg(X, Y, t, wobble) {
  const p = 1 + Math.sin(t * 3) * 0.05;
  groundShadow(X, Y, 6, 2.6, 0.5);
  L.globalAlpha = 0.85; ellipse(X, Y, 6.5, 2.6, 0, '#3f4a22'); L.globalAlpha = 1;
  const ox = Math.sin(t * 30) * wobble;
  ellipse(X + ox, Y - 6, 4.6 * p + 1, 6.2 * p + 1, 0, C.ink);
  ellipse(X + ox, Y - 6, 4.6 * p, 6.2 * p, 0, '#d6cfb2');
  ellipse(X + ox - 1.2, Y - 7.5, 2.2, 3, 0, '#ece6cf');
  line(X + ox - 2, Y - 9, X + ox + 1, Y - 5, '#9c6a6a'); line(X + ox + 1, Y - 5, X + ox + 3, Y - 7, '#9c6a6a'); line(X + ox - 3, Y - 4, X + ox - 1, Y - 2, '#7a4a52');
  if (wobble > 0.3) { line(X + ox - 1, Y - 12, X + ox + 1, Y - 9, C.ink); }
}

function drawLarva(X, Y, e, t, flash) {
  // segmented worm following its own trail
  const tr = e.trail, TS = CFG.TS;
  const segs = 4;
  for (let i = segs; i >= 1; i--) {
    const k = Math.min(tr.length - 1, i * 3);
    const q = tr[k] || [e.x, e.y];
    const sx = X + (q[0] - e.x) * TS, sy = Y + (q[1] - e.y) * TS;
    disc(sx, sy - 2, 2.6 - i * 0.3 + 1, C.ink);
    disc(sx, sy - 2, 2.6 - i * 0.3, flash || (i % 2 ? '#7d8c58' : '#9aaa6c'));
    px(sx, sy - 3, '#b9c88a');
  }
  const a = e.ang, fx = Math.cos(a), fy = Math.sin(a);
  disc(X, Y - 3, 3.6, C.ink);
  disc(X, Y - 3, 2.7, flash || '#a7b67c');
  const open = (Math.sin(t * 12) + 1) * 0.6 + (e.atk ? 1 : 0);
  for (const s of [-1, 1]) line(X + fx * 2.5 - fy * s * 1.4, Y - 3 + fy * 1.6 + fx * s * 1.0, X + fx * 4.4 - fy * s * (0.4 + open), Y - 3 + fy * 2.8 + fx * s * (0.4 + open), '#e8e1c8');
  px(X + fx * 1.5 - fy, Y - 4 + fy, '#e0303a'); px(X + fx * 1.5 + fy, Y - 4 - fy, '#e0303a');
}

function drawMantis(X, Y, st, perfect) {
  const rig = new Rig(X, Y, st.ang, (perfect ? 1.35 : 1.12) * (st.scale || 1));
  if (st.flash) rig.flash = st.flash;
  const col = perfect ? { a: '#2a1e2e', b: '#3d2b42', hi: '#c1263a', leg: '#1d1420' } : { a: '#3e5a3a', b: '#557a4c', hi: '#8fbf6a', leg: '#26381f' };
  const s = Math.sin(st.phase), amt = st.amt;
  // legs (4), alternating
  for (let i = 0; i < 4; i++) {
    const side = i % 2 ? 1 : -1, fwd = i < 2 ? 1.5 : -2.5;
    const ph = s * (i === 0 || i === 3 ? 1 : -1) * 2.2 * amt;
    const lift = Math.max(0, Math.cos(st.phase) * (i === 0 || i === 3 ? 1 : -1)) * 1.6 * amt;
    const hipP = rig.P(fwd * 0.6, side * 1.2, 5.5), knee = rig.P(fwd + ph * 0.5, side * 4.2, 6.5 + lift), foot = rig.P(fwd + ph, side * 4.6, lift);
    rig.line(hipP, knee, 1, col.leg); rig.line(knee, foot, 1, col.leg);
  }
  // abdomen + thorax
  rig.disc(rig.P(-3.8, 0, 5), 3.2, col.a, 0);
  rig.disc(rig.P(-5.2, 0, 4.6), 2.2, col.b, 0.01);
  rig.line(rig.P(-1, 0, 6), rig.P(2.8, 0, 9.5), 2.8, col.a);
  // tentacles from the back
  for (const sd of [-1, 1]) {
    const w = Math.sin(st.t * 5 + sd) * 1.5;
    rig.line(rig.P(-3, sd * 1.2, 7.5), rig.P(-5.5 + w, sd * 3, 10), 0.9, col.b);
    rig.line(rig.P(-5.5 + w, sd * 3, 10), rig.P(-7 - w, sd * 3.8, 8), 0.8, col.hi);
  }
  // wings (perfect form, once faster than the player)
  if (perfect && st.wings) {
    const fl = Math.sin(st.t * 22) * 2;
    rig.fn(rig.P(-2, 0, 8).d - 0.4, () => {
      L.globalAlpha = 0.55;
      for (const sd of [-1, 1]) {
        const a = rig.P(0, sd * 1.5, 9), b = rig.P(-7, sd * (8 + fl), 12 + fl), c = rig.P(-9, sd * 4, 7);
        poly([a.x, a.y, b.x, b.y, c.x, c.y], '#cbb8dc');
        line(a.x, a.y, b.x, b.y, '#f0e6ff');
      }
      L.globalAlpha = 1;
    });
  }
  // raptorial scythes
  const strike = st.atk && st.atk.phase === 'strike' ? Ease.outCubic(st.atk.f) : 0;
  const reach = st.tentacleOut || 0;
  for (const sd of [-1, 1]) {
    const sh = rig.P(2.6, sd * 1.6, 9.2);
    const el = rig.P(3.5 + strike * 2, sd * 2.4, 13 - strike * 3);
    const tip = rig.P(5.2 + strike * 5 + reach, sd * 1.4, 8 - strike * 3);
    rig.line(sh, el, 1.4, col.a); rig.line(el, tip, 1.2, col.hi);
  }
  // head with a huge fanged mouth
  const head = rig.P(4.4, 0, 11);
  rig.disc(head, 2.5, col.b, 0.02);
  const open = st.atk ? 1 : (Math.sin(st.t * 4) + 1) * 0.3;
  rig.fn(head.d + 0.3, () => {
    if (rig.fy < -0.3) return;
    const m = rig.P(6, 0, 10);
    disc(m.x, m.y, (1.2 + open) * rig.s, '#4a0a12');
    for (let i = -1; i <= 1; i++) px(m.x + i * 1.2, m.y - (1 + open), '#f4efe6');
    for (let i = -1; i <= 1; i += 2) px(m.x + i * 0.8, m.y + 1 + open * 0.6, '#f4efe6');
    const e1 = rig.P(5, -1.4, 12.2), e2 = rig.P(5, 1.4, 12.2);
    px(e1.x, e1.y, perfect ? '#ff4040' : '#ffe14a'); px(e2.x, e2.y, perfect ? '#ff4040' : '#ffe14a');
  });
  if (perfect) rig.fn(rig.P(-3, 0, 7).d + 0.2, () => { const v = rig.P(-3.5, 0, 8.4); px(v.x, v.y, '#ff3048'); px(v.x + 1, v.y + 1, '#ff3048'); });
  rig.render();
}

// ── 박사's machines ──
function drawMachine(X, Y, st, kind, dormant) {
  const rig = new Rig(X, Y, st.ang, 1.1);
  if (st.flash) rig.flash = st.flash;
  const tread = (st.phase * 2) % 2 < 1;
  for (const sd of [-1, 1]) rig.line(rig.P(-3, sd * 3.6, 1.2), rig.P(3, sd * 3.6, 1.2), 2.4, tread ? '#1c1c22' : '#26262e');
  if (kind === 'saw') {
    rig.disc(rig.P(0, 0, 4), 4.2, '#6b6f78');
    rig.disc(rig.P(-0.4, 0, 6.4), 3, '#8b909a', 0.1);
    const bladeC = rig.P(5.2, 0, 4.5);
    rig.fn(bladeC.d + 0.2, () => {
      const spin = dormant ? 0 : st.t * 30;
      disc(bladeC.x, bladeC.y, 4.4, C.ink);
      disc(bladeC.x, bladeC.y, 3.6, st.flash || '#cfd4dc');
      for (let i = 0; i < 8; i++) { const a = spin + (i / 8) * TAU; px(bladeC.x + Math.cos(a) * 4.2, bladeC.y + Math.sin(a) * 3.2, '#eef2f6'); }
      disc(bladeC.x, bladeC.y, 1, '#555a62');
    });
  } else {
    rig.line(rig.P(-3.5, 0, 4.5), rig.P(2.5, 0, 4.5), 6, '#c9a227');
    rig.line(rig.P(-3, 0, 6.8), rig.P(2, 0, 6.8), 3, '#a8861a', 0.1);
    rig.fn(rig.P(0, 0, 7).d + 0.25, () => { for (let i = -2; i <= 2; i++) { const p = rig.P(i * 1.2, 0, 7.2); px(p.x, p.y, i % 2 ? C.ink : '#ffd23f'); } });
    const a = rig.P(3, -2.2, 4.5), b = rig.P(3, 2.2, 4.5), tip = rig.P(9, 0, 4.5);
    rig.poly([a, b, tip], '#aeb5c0', 0.3);
    rig.fn(tip.d + 0.35, () => {
      const spin = dormant ? 0 : st.t * 20;
      for (let i = 0; i < 3; i++) { const u = ((i / 3) + (spin % 1) / 3); const p = rig.P(3 + u * 6, (1 - u) * 2 * Math.sin(spin * 6 + i), 4.5); px(p.x, p.y, '#6a7280'); }
    });
  }
  const eye = rig.P(1.5, 0, 7.6);
  rig.fn(eye.d + 0.5, () => { px(eye.x, eye.y, dormant ? '#3a2020' : ((st.t * 6) | 0) % 2 ? '#ff2a2a' : '#ff8080'); });
  rig.render();
}

function box(x, y, w, h, top, front, depth = 7) {
  rect(x - 1, y - depth - 1, w + 2, depth + h + 2, C.ink);
  rect(x, y - depth, w, depth, top);
  rect(x, y, w, h, front);
}

function drawFurniture(f, X, Y, t) {
  const TS = CFG.TS, by = Y + TS - 1;
  const sh = f.shake > 0 ? Math.round(Math.sin(t * 60) * Math.min(1, f.shake * 3)) : 0;
  X += sh;
  switch (f.kind) {
    case 'wardrobe': case 'pantry': {
      const top = f.kind === 'wardrobe' ? '#3a2416' : '#5b3d22', fr = f.kind === 'wardrobe' ? '#4e2f1a' : '#6f4c2a';
      box(X + 1, by - 12, 12, 12, top, fr, 6);
      rect(X + 1, by - 12, 12, 1, shade(fr, 1.25));
      line(X + 7, by - 11, X + 7, by - 1, shade(fr, 0.6));
      px(X + 6, by - 6, C.brass); px(X + 8, by - 6, C.brass);
      if (f.kind === 'pantry') { rect(X + 3, by - 10, 3, 3, '#2a1c12'); rect(X + 9, by - 10, 3, 3, '#2a1c12'); }
      if (f.occupied && ((t * 3) | 0) % 5 === 0) px(X + 7, by - 8, '#ffffff');
      break;
    }
    case 'clock': {
      box(X + 4, by - 15, 6, 15, '#3a2214', '#4a2a18', 3);
      disc(X + 7, by - 12, 2.2, '#efe6cc'); px(X + 7, by - 13, C.ink); px(X + 8, by - 12, C.ink);
      rect(X + 5, by - 8, 4, 6, '#20120a');
      const sw = Math.round(Math.sin(t * 3.2) * 1.2); px(X + 7 + sw, by - 4, C.gold); line(X + 7, by - 8, X + 7 + sw, by - 4, C.gold2);
      break;
    }
    case 'bed': {
      box(X + 1, by - 4, 12, 4, '#d8d2c8', '#3a2416', 9);
      rect(X + 2, by - 12, 10, 3, '#f0ece4');
      rect(X + 1, by - 8, 12, 4, '#6e1c2a'); rect(X + 1, by - 8, 12, 1, '#8a2a3a');
      rect(X + 2, by - 1, 10, 1, '#0a0608');
      if (f.occupied && ((t * 2) | 0) % 4 === 0) px(X + 4, by - 1, '#ffffff');
      break;
    }
    case 'tub': {
      box(X + 1, by - 5, 12, 5, '#e8e8e2', '#cfd2cc', 8);
      rect(X + 3, by - 11, 8, 5, '#4f7f8c'); rect(X + 3, by - 11, 8, 1, '#7fb0bc');
      // shower curtain
