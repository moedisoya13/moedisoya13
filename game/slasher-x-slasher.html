// ── 10_player.js ──
// ─────────────────────────────────────────────────────────────
// Grid movement (shared) + the player (도망자 / 망토 히어로)
// Entities ride tile-centre rails like Pac-Man; perpendicular turns
// snap in when within a tolerance of the centre (cornering assist).
// ─────────────────────────────────────────────────────────────

const EPS = 1e-4;

// move up to the next tile centre (or align for a turn); returns distance used
function moveSegment(e, D, d, pass, tol) {
  const dx = D[0], dy = D[1];
  const tx = Math.floor(e.x), ty = Math.floor(e.y), cx = tx + 0.5, cy = ty + 0.5;
  if (dx) {
    const off = e.y - cy;
    if (Math.abs(off) > EPS) {
      if (Math.abs(off) > tol || !pass(tx + dx, ty)) return 0;
      const a = Math.min(Math.abs(off), d); e.y -= Math.sign(off) * a; if (Math.abs(e.y - cy) < EPS) e.y = cy;
      const fw = (e.x - cx) * dx; if (fw > -EPS && fw + a < 0.49) e.x += dx * a; // cut the corner: already sliding into the new lane
      return a;
    }
    e.y = cy;
    let toC = (cx - e.x) * dx;
    if (toC <= EPS) { if (!pass(tx + dx, ty)) { if (toC < -EPS) e.x = cx; return 0; } toC += 1; }
    const a = Math.min(toC, d); e.x += dx * a;
    if (Math.abs(toC - a) < EPS) e.x = Math.floor(e.x) + 0.5;
    return a;
  } else {
    const off = e.x - cx;
    if (Math.abs(off) > EPS) {
      if (Math.abs(off) > tol || !pass(tx, ty + dy)) return 0;
      const a = Math.min(Math.abs(off), d); e.x -= Math.sign(off) * a; if (Math.abs(e.x - cx) < EPS) e.x = cx;
      const fw = (e.y - cy) * dy; if (fw > -EPS && fw + a < 0.49) e.y += dy * a;
      return a;
    }
    e.x = cx;
    let toC = (cy - e.y) * dy;
    if (toC <= EPS) { if (!pass(tx, ty + dy)) { if (toC < -EPS) e.y = cy; return 0; } toC += 1; }
    const a = Math.min(toC, d); e.y += dy * a;
    if (Math.abs(toC - a) < EPS) e.y = Math.floor(e.y) + 0.5;
    return a;
  }
}

function gridMove(e, cands, d, pass, tol = CFG.TURN_TOL, follow = false) {
  let total = 0, guard = 0;
  while (d > EPS && guard++ < 10) {
    let m = 0;
    for (const D of cands) {
      if (!D) continue;
      m = moveSegment(e, D, d, pass, tol);
      if (m > 0) { e.dx = D[0]; e.dy = D[1]; break; }
    }
    if (m <= 0 && follow) {
      const D = bendDir(e, cands[0], pass);
      if (D) { m = moveSegment(e, D, d, pass, tol); if (m > 0) { e.dx = D[0]; e.dy = D[1]; } }
    }
    if (m <= 0) break;
    d -= m; total += m;
  }
  return total;
}

// pushing into a plain wall at an L-bend: follow the corridor round the corner
// (never at a junction, and never away from a door or furniture you're facing)
function bendDir(e, prim, pass) {
  if (!prim || !atCenter(e)) return null;
  const tx = Math.floor(e.x), ty = Math.floor(e.y);
  if (tAt(tx + prim[0], ty + prim[1]) !== T.WALL) return null;
  let out = null;
  for (const D of DIRS) {
    if ((D[0] === -prim[0] && D[1] === -prim[1]) || (D[0] === -e.dx && D[1] === -e.dy) || (D[0] === prim[0] && D[1] === prim[1])) continue;
    if (!pass(tx + D[0], ty + D[1])) continue;
    if (out) return null;
    out = D;
  }
  return out;
}

// joystick → rail candidates: main axis, the other axis, then keep going
function railCands(e, v, moving) {
  const ax = Math.abs(v.x), ay = Math.abs(v.y);
  let horiz = ax >= ay;
  // near the diagonal stay on the axis we're already travelling (no zig-zag at junctions)
  if (moving && (e.dx || e.dy) && Math.abs(ax - ay) < 0.3 * Math.max(ax, ay)) horiz = e.dx !== 0;
  const prim = horiz ? [Math.sign(v.x), 0] : [0, Math.sign(v.y)];
  const sec = horiz ? (ay > 0.22 ? [0, Math.sign(v.y)] : null) : (ax > 0.22 ? [Math.sign(v.x), 0] : null);
  const cands = [prim, sec];
  if (moving && (e.dx || e.dy) && !(e.dx === -prim[0] && e.dy === -prim[1])) cands.push([e.dx, e.dy]);
  return cands;
}
const atCenter = (e) => Math.abs(e.x - Math.floor(e.x) - 0.5) < 1e-3 && Math.abs(e.y - Math.floor(e.y) - 0.5) < 1e-3;

// ── player ──
let P = null;

function makePlayer(tx, ty) {
  return {
    x: tx + 0.5, y: ty + 0.5, dx: 0, dy: 0, ang: -Math.PI / 2, phase: 0, amt: 0, breath: 0, headTurn: 0, idleT: 0,
    hp: CFG.HP, keys: 0, honey: 0, letters: { S: 0, H: 0, A: 0, Z: 0, M: 0 },
    state: 'free', hide: null, stunT: 0, slowT: 0, knock: null, flashT: 0, hurtT: 0, staggerT: 0,
    hero: false, heroStunT: 0, holdT: 0, holdObj: null, toilet: null, pull: null, deadT: 0, interact: null, lastStep: 0,
  };
}

function playerPass(x, y) {
  if (P.hero) { const t = tAt(x, y); if (t === T.DOOR) return true; }
  return walkable(x, y);
}

function playerSpeed() {
  if (P.hero) return G.killer.speed(true) * CFG.HERO_RATIO;
  let s = CFG.PLAYER_SPEED;
  if (G.dupT > 0) s *= CFG.DUP_SPEED;
  if (P.slowT > 0) s *= CFG.FAKE_SLOW_MULT;
  return s;
}

function updatePlayer(dt) {
  P.flashT = Math.max(0, P.flashT - dt);
  P.hurtT = Math.max(0, P.hurtT - dt);
  P.slowT = Math.max(0, P.slowT - dt);
  P.breath = Math.sin(G.time * 2.4) * 0.35;

  if (P.state === 'dead') { P.deadT += dt; P.amt = approach(P.amt, 0, dt * 6); return; }
  if (P.state === 'hidden') { P.amt = 0; handleInteract(dt); return; }
  if (P.state === 'toilet') { updateToiletTravel(dt); return; }
  if (P.state === 'pulled') { updatePull(dt); return; }
  if (P.state === 'stun') {
    P.stunT -= dt; P.amt = approach(P.amt, 0, dt * 6);
    if (P.stunT <= 0) P.state = 'free';
    return;
  }
  if (P.state === 'knock') { updateKnock(dt); return; }
  if (P.heroStunT > 0) { P.heroStunT -= dt; P.amt = approach(P.amt, 0, dt * 8); return; }
  if (P.staggerT > 0) { P.staggerT -= dt; }

  // movement
  const v = Input.vector();
  let moved = 0;
  if (v.mag > 0 && P.staggerT <= 0) {
    const moving = P.amt > 0.2;
    moved = gridMove(P, railCands(P, v, moving), playerSpeed() * dt, playerPass, CFG.TURN_TOL, moving);
    const want = moved > 0 ? Math.atan2(P.dy, P.dx) : Math.atan2(v.y, v.x);
    P.ang = angApproach(P.ang, want, dt * 16);
    if (P.hero) heroSmashDoors();
  }
  const tAmt = moved > 0 ? 1 : 0;
  P.amt = approach(P.amt, tAmt, dt * (tAmt ? 7 : 9));
  if (moved > 0) {
    const before = Math.floor(P.phase / Math.PI);
    P.phase += moved * (P.hero ? 3.3 : 4.1);
    if (Math.floor(P.phase / Math.PI) !== before) Sfx.step(P.hero ? 0.06 : 0.02, P.hero);
    P.idleT = 0;
  } else {
    const k = Math.round(P.phase / Math.PI) * Math.PI;
    P.phase = approach(P.phase, k, dt * 7);
    P.idleT += dt;
  }
  // head: glance at a visible killer, otherwise nervous look-around when idle
  let look = 0;
  const k = G.killer;
  if (k && k.alive && !P.hero && Vision.visible(k.x, k.y) && dist(P.x, P.y, k.x, k.y) < 7) {
    look = clamp(angDiff(P.ang, Math.atan2(k.y - P.y, k.x - P.x)), -1.2, 1.2);
  } else if (P.idleT > 1.4) look = Math.sin(G.time * 1.1) * 0.8;
  P.headTurn = lerp(P.headTurn, look, Math.min(1, dt * 6));

  pickupItems();
  if (!P.hero) { handleInteract(dt); handleHoneyButton(); }
}

function heroSmashDoors() {
  const tx = Math.floor(P.x + P.dx * 0.6), ty = Math.floor(P.y + P.dy * 0.6);
  const d = doorAt(tx, ty);
  if (d && d.state === 'locked') {
    d.state = 'broken';
    Sfx.doorBreak(); G.shake = 5;
    FX.debris(tx * CFG.TS + 7, ty * CFG.TS + 7, 18);
    repathAll();
  }
}

// ── knockback / stun / pull ──
function knockPlayer(fromX, fromY, tiles = CFG.KNOCKBACK) {
  const ax = P.x - fromX, ay = P.y - fromY;
  let best = null, bs = -Infinity;
  for (const D of DIRS) {
    const probe = { x: P.x, y: P.y, dx: 0, dy: 0 };
    if (moveSegment(probe, D, 0.6, walkable, 0.5) <= 0) continue;
    const s = D[0] * ax + D[1] * ay;
    if (s > bs) { bs = s; best = D; }
  }
  if (!best) return;
  P.state = 'knock';
  P.knock = { dir: best, rem: tiles, t: 0 };
  P.ang = Math.atan2(fromY - P.y, fromX - P.x);
}
function updateKnock(dt) {
  const k = P.knock;
  k.t += dt;
  const sp = lerp(11, 4, Math.min(1, k.t / 0.3));
  const d = Math.min(k.rem, sp * dt);
  const m = gridMove(P, [k.dir], d, walkable, 0.5);
  k.rem -= d;
  P.amt = approach(P.amt, 0.6, dt * 6);
  P.phase += m * 6;
  if (k.rem <= 0.001 || m < d * 0.5) { P.state = 'free'; P.knock = null; P.staggerT = 0.12; }
}
function stunPlayer(t) {
  if (P.hero) { P.heroStunT = CFG.HERO_HIT_STUN; FX.sparks(P.x * CFG.TS, P.y * CFG.TS - 10, 8); return; }
  if (P.state === 'dead' || P.state === 'hidden') return;
  P.state = 'stun'; P.stunT = t;
}
function updatePull(dt) {
  const p = P.pull;
  p.t += dt;
  const f = Math.min(1, p.t / p.dur);
  const e = Ease.inCubic(f);
  P.x = lerp(p.sx, p.tx, e); P.y = lerp(p.sy, p.ty, e);
  P.amt = 0.4;
  if (f >= 1) { P.state = 'free'; P.pull = null; if (p.done) p.done(); }
}

function hurtPlayer(dmg, fromX, fromY, o = {}) {
  if (P.state === 'dead') return;
  if (P.hero) { P.heroStunT = CFG.HERO_HIT_STUN; P.flashT = 0.15; Sfx.hit(false); return; }
  if (G.god) dmg = 0;
  if (P.state === 'hidden') forceExitHide();
  if (P.state === 'toilet') return;
  P.hp = Math.max(0, P.hp - dmg);
  P.flashT = 0.3; P.hurtT = 0.45;
  G.shake = 4 + dmg * 2; G.hitStop = 0.07; G.redFlash = 0.35;
  Sfx.hit(dmg >= 2);
  FX.blood(P.x * CFG.TS, P.y * CFG.TS - 7, 8 + dmg * 6, Math.atan2(P.y - fromY, P.x - fromX));
  if (P.hp <= 0) { killPlayer('killed'); return; }
  if (!o.noKnock) knockPlayer(fromX, fromY, CFG.KNOCKBACK * (o.knockMul || 1));
}

function killPlayer(cause) {
  if (P.state === 'dead') return;
  if (P.state === 'hidden') forceExitHide();
  P.state = 'dead'; P.deadT = 0; P.hp = 0;
  G.deathCause = cause;
  startPhase('dying');
}

// ── interactions ──
function findInteract() {
  if (P.state === 'hidden') return { kind: 'exit' };
  if (P.state !== 'free' || P.hero) return null;
  const tx = Math.floor(P.x), ty = Math.floor(P.y);
  const fx = Math.round(Math.cos(P.ang)), fy = Math.round(Math.sin(P.ang));
  const facing = (x, y) => (x - tx === fx && y - ty === fy ? 1.5 : 0);
  let best = null;
  const offer = (o) => { if (!best || o.score > best.score) best = o; };
  for (const c of G.candles) {
    const d = Math.abs(c.x - tx) + Math.abs(c.y - ty);
    if (d <= 1) offer({ kind: 'candle', obj: c, score: 6 + facing(c.x, c.y) - d });
  }
  for (const [dx, dy] of DIRS) {
    const d = doorAt(tx + dx, ty + dy);
    if (!d) continue;
    if (d.state === 'locked') offer({ kind: P.keys > 0 ? 'unlock' : 'locked', obj: d, score: (P.keys > 0 ? 4 : 0.5) + facing(d.x, d.y) });
    else if (d.state === 'open' && !entityOnTile(d.x, d.y)) offer({ kind: 'lock', obj: d, score: 2 + facing(d.x, d.y) });
  }
  for (const f of M.hideSpots) {
    if (f.occupied) continue;
    const adj = Math.abs(f.x - tx) + Math.abs(f.y - ty) === 1;
    if (adj) offer({ kind: 'hide', obj: f, score: 3.5 + facing(f.x, f.y) + (f.ax === tx && f.ay === ty ? 0.5 : 0) });
  }
  for (const f of M.toilets) {
    if (Math.abs(f.x - tx) + Math.abs(f.y - ty) === 1) offer({ kind: G.toiletCd > 0 ? 'toiletWait' : 'toilet', obj: f, score: (G.toiletCd > 0 ? 1 : 3.6) + facing(f.x, f.y) });
  }
  return best;
}
function entityOnTile(x, y) {
  if (Math.floor(P.x) === x && Math.floor(P.y) === y) return true;
  for (const e of G.enemies) if (e.alive && Math.floor(e.x) === x && Math.floor(e.y) === y) return true;
  return false;
}

function handleInteract(dt) {
  const it = findInteract();
  P.interact = it;
  const b = Input.btn.act;
  if (!it) { P.holdT = 0; P.holdObj = null; return; }
  if (it.kind === 'candle') {
    if (b.down) {
      if (P.holdObj !== it.obj) { P.holdObj = it.obj; P.holdT = 0; }
      P.holdT += dt;
      if (P.holdT >= CFG.CANDLE_HOLD) { extinguishCandle(it.obj); P.holdT = 0; P.holdObj = null; }
    } else { P.holdT = 0; P.holdObj = null; }
    return;
  }
  if (!b.pressed) return;
  switch (it.kind) {
    case 'unlock': doUnlock(it.obj); break;
    case 'lock': doLock(it.obj); break;
    case 'hide': doHide(it.obj); break;
    case 'exit': doExitHide(); break;
    case 'toilet': doToilet(it.obj); break;
    case 'locked': Sfx.tone(180, 140, 0.08, { type: 'square', vol: 0.05 }); it.obj.shake = 0.15; break;
  }
}

function doUnlock(d) {
  P.keys--; d.state = 'open'; d.bash = 0;
  Sfx.unlock(); FX.sparks(d.x * CFG.TS + 7, d.y * CFG.TS + 4, 6);
  G.noise(d.x + 0.5, d.y + 0.5, CFG.NOISE_DOOR);
  G.playerAction('key');
  repathAll();
}
function doLock(d) {
  d.state = 'locked'; d.bash = 0;
  Sfx.lock(); FX.dust(d.x * CFG.TS + 7, d.y * CFG.TS + 7, 4);
  G.noise(d.x + 0.5, d.y + 0.5, CFG.NOISE_DOOR * 0.6);
  repathAll();
}
function doHide(f) {
  for (const e of G.enemies) if (e.alive && e.sees) { e.hideTarget = f; e.lastSeen = { x: f.ax + 0.5, y: f.ay + 0.5 }; }
  P.state = 'hidden'; P.hide = f; f.occupied = true; f.shake = 0.35;
  P.x = f.x + 0.5; P.y = f.y + 0.5; P.amt = 0;
  Sfx.hide();
}
function doExitHide() {
  const f = P.hide;
  if (!f) { P.state = 'free'; return; }
  P.state = 'free'; P.hide = null; f.occupied = false; f.shake = 0.35;
  // step out on a free side, away from any killer standing at the spot
  let ex = f.ax, ey = f.ay, best = -Infinity;
  for (const [dx, dy] of DIRS) {
    const x = f.x + dx, y = f.y + dy;
    if (!walkable(x, y)) continue;
    let s = x === f.ax && y === f.ay ? 0.5 : 0;
    for (const e of G.enemies) if (e.alive && e.hostile) { const d = dist(x + 0.5, y + 0.5, e.x, e.y); s += Math.min(d, 6) - (d < 0.8 ? 10 : 0); }
    if (s > best) { best = s; ex = x; ey = y; }
  }
  P.x = ex + 0.5; P.y = ey + 0.5;
  P.ang = Math.atan2(ey - f.y, ex - f.x);
  Sfx.hide();
}
function forceExitHide() { if (P.state === 'hidden') doExitHide(); }

function doToilet(f) {
  const to = M.toilets[0] === f ? M.toilets[1] : M.toilets[0];
  G.toiletCd = CFG.TOILET_CD;
  P.state = 'toilet'; P.toilet = { from: f, to, t: 0, moved: false };
  P.x = f.ax + 0.5; P.y = f.ay + 0.5;
  Sfx.flush();
  G.noise(f.x + 0.5, f.y + 0.5, CFG.NOISE_TOILET);
  G.noise(to.x + 0.5, to.y + 0.5, CFG.NOISE_TOILET);
  G.playerAction('toilet');
}
function updateToiletTravel(dt) {
  const tr = P.toilet;
  tr.t += dt;
  if (!tr.moved && tr.t >= 0.38) {
    tr.moved = true;
    FX.splash(tr.to.x * CFG.TS + 7, tr.to.y * CFG.TS + 6, 14);
    P.x = tr.to.ax + 0.5; P.y = tr.to.ay + 0.5;
    P.ang = Math.atan2(tr.to.ay - tr.to.y, tr.to.ax - tr.to.x);
  }
  if (tr.t >= 0.7) { P.state = 'free'; P.toilet = null; }
}

function handleHoneyButton() {
  if (!Input.btn.honey.pressed || P.honey <= 0 || P.state !== 'free') return;
  const tx = Math.floor(P.x), ty = Math.floor(P.y);
  if (G.honeyTraps.some((h) => h.x === tx && h.y === ty)) return;
  P.honey--;
  G.honeyTraps.push({ x: tx, y: ty, t: 0 });
  Sfx.honeyPlace();
  G.noise(P.x, P.y, CFG.NOISE_HONEY);
  G.playerAction('honey');
}

// ── drawing ──
function playerScreenPos(camX, camY) { return [P.x * CFG.TS - camX, P.y * CFG.TS - camY + 4]; }

function drawPlayer(camX, camY) {
  if (P.state === 'hidden') return;
  let [X, Y] = playerScreenPos(camX, camY);
  const st = { ang: P.ang, phase: P.phase, amt: P.amt, breath: P.breath, headTurn: P.headTurn, lean: 0, scale: 1 };
  if (P.flashT > 0 && ((P.flashT * 30) | 0) % 2) st.flash = '#ffffff';
  if (P.hurtT > 0) { st.tilt = -0.35 * (P.hurtT / 0.45); }
  if (P.state === 'dead') {
    const f = Math.min(1, P.deadT / 0.6);
    st.tilt = -Ease.outBack(f) * 1.45; st.amt = 0;
  }
  if (P.state === 'toilet') {
    const t = P.toilet.t;
    const s = t < 0.38 ? 1 - t / 0.38 : (t - 0.38) / 0.32;
    if (s <= 0.05) return;
    st.scale = s; st.ang = P.ang + (1 - s) * 8;
  }
  if (P.state === 'stun') { st.roll = Math.sin(G.time * 7) * 0.25; }
  if (P.hero) {
    if (G.phase === 'shazam') { st.handR = [1.2, 4.4, 19.5]; st.handL = [1.2, -4.4, 19.5]; st.ang = Math.PI / 2; }
    groundShadow(X, Y, 7, 2.6);
    drawHero(X, Y, st, G.time);
  } else {
    groundShadow(X, Y, 4.6, 1.8);
    drawRunner(X, Y, st);
  }
  if (P.state === 'stun') iconStars(X, Y - 22, G.time);
}

// ── 11_enemy.js ──
// ─────────────────────────────────────────────────────────────
// Enemy — shared killer AI
//   patrol → (sight / noise) → chase → search → check hide spots
//   locked door on the route → bash · attack = windup/strike/recover
//   revenge mode → flee planner (stay where the hero can't get first)
// ─────────────────────────────────────────────────────────────

function centerDir(e) {
  const cx = Math.floor(e.x) + 0.5, cy = Math.floor(e.y) + 0.5;
  if (Math.abs(e.x - cx) > EPS) return [Math.sign(cx - e.x), 0];
  if (Math.abs(e.y - cy) > EPS) return [0, Math.sign(cy - e.y)];
  return null;
}
// abilities trigger near a tile centre (a moving killer rarely lands exactly on one)
function nearCenter(e, tol = 0.17) { return Math.abs(e.x - Math.floor(e.x) - 0.5) < tol && Math.abs(e.y - Math.floor(e.y) - 0.5) < tol; }
function snapCenter(e) { e.x = Math.floor(e.x) + 0.5; e.y = Math.floor(e.y) + 0.5; }
function walkGoal(x, y) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (walkable(tx, ty)) return [tx, ty];
  for (const [dx, dy] of DIRS) if (walkable(tx + dx, ty + dy)) return [tx + dx, ty + dy];
  return null;
}
function nearVol(x, y, maxD = 14) { return P ? clamp(1 - dist(x, y, P.x, P.y) / maxD, 0, 1) : 0; }
function repathAll() {
  if (!G) return;
  for (const list of [G.enemies, G.victims, G.machines]) if (list) for (const e of list) { e.path = null; e.repathT = 0; }
}
function targetable() { return P && !P.hero && (P.state === 'free' || P.state === 'knock' || P.state === 'stun' || P.state === 'pulled'); }

class Enemy {
  constructor(kind, tx, ty) {
    this.kind = kind; this.x = tx + 0.5; this.y = ty + 0.5; this.dx = 0; this.dy = 0;
    this.ang = rand(0, TAU); this.phase = 0; this.amt = 0; this.breath = 0; this.t = 0;
    this.state = 'patrol'; this.path = null; this.pathI = 0; this.goal = null; this.repathT = 0;
    this.lastSeen = null; this.sees = false; this.spotT = 0; this.unseenT = 0;
    this.hideTarget = null; this.checkQueue = []; this.searchT = 0; this.checkT = 0; this.checkSpot = null; this.noiseAt = null;
    this.atk = null; this.atkCd = 0; this.waitT = 0;
    this.stuckT = 0; this.stunT = 0; this.flashT = 0;
    this.bashDoor = null; this.bashT = 0; this.bashSnd = 0; this.bashCheck = 0;
    this.trav = null; this.fleeT = 0; this.keys = 0;
    this.hp = 3; this.main = true; this.hostile = true; this.alive = true;
    this.dmg = 1; this.knockMul = 1; this.bashTime = CFG.DOOR_BASH; this.canBash = true;
    this.useToilets = true; this.useWells = false; this.ratio = CFG.KILLER_RATIO;
    this.phaseRate = 4.0; this.heavy = false; this.headH = 26; this.lastStepIdx = 0;
    this.name = ''; this.title = ''; this.ko = '';
  }
  speed(base = false) { return CFG.PLAYER_SPEED * this.ratio; }
  // fleeing killers (revenge) and hunt-mode victims may spend keys on locked doors
  canUnlock() { return G.mode === 'revenge' && this.keys > 0; }
  tile() { return [Math.floor(this.x), Math.floor(this.y)]; }
  pathOpts() {
    return {
      bash: this.canBash && G.mode !== 'revenge' ? this.bashTime : 0, speed: this.speed(),
      toilets: this.useToilets, wells: this.useWells && M.wells.length === 2 && !M.wells[0].sealed,
      key: this.canUnlock(),
    };
  }

  canSeePlayer() {
    if (!this.hostile || !P || P.hero || P.state === 'hidden' || P.state === 'dead' || P.state === 'toilet') return false;
    const d = dist(this.x, this.y, P.x, P.y);
    if (d > CFG.KILLER_SIGHT) return false;
    if (!los(this.x, this.y, P.x, P.y)) return false;
    if (d <= CFG.KILLER_NEAR) return true;
    return Math.abs(angDiff(this.ang, Math.atan2(P.y - this.y, P.x - this.x))) <= CFG.KILLER_FOV;
  }

  // subclasses: return true to take over this frame
  ability(dt) { return false; }
  onHit() {}

  update(dt) {
    this.t += dt;
    this.flashT = Math.max(0, this.flashT - dt);
    this.spotT = Math.max(0, this.spotT - dt);
    this.atkCd = Math.max(0, this.atkCd - dt);
    this.breath = Math.sin(this.t * 2) * 0.3;
    if (this.stuckT > 0) {
      this.stuckT -= dt; this.amt = approach(this.amt, 0, dt * 8);
      this.sees = this.canSeePlayer(); if (this.sees) this.lastSeen = { x: P.x, y: P.y };
      return;
    }
    if (this.stunT > 0) { this.stunT -= dt; this.amt = approach(this.amt, 0, dt * 8); return; }
    if (this.trav) { this.updateTrav(dt); return; }
    if (this.atk) { this.updateAttack(dt); return; }
    if (this.ability(dt)) return;
    if (G.mode === 'revenge') { if (this.main) this.updateFlee(dt); else this.amt = approach(this.amt, 0, dt * 6); return; }
    this.perceive(dt);
    if (this.state === 'bash') { this.updateBash(dt); return; }
    if (this.state === 'check') { this.updateCheck(dt); return; }
    if (this.state === 'wait') {
      this.waitT -= dt; this.amt = approach(this.amt, 0, dt * 6);
      this.ang += Math.sin(this.t * 1.7) * dt * 1.2; // look around
      if (this.waitT <= 0) this.state = 'patrol';
      return;
    }
    this.decide(dt);
    const moved = this.moveAlong(dt);
    this.animate(moved, dt);
    this.honeyCheck();
    if (this.hostile && this.sees && this.atkCd <= 0 && targetable() && dist(this.x, this.y, P.x, P.y) < CFG.ATTACK_RANGE) this.startAttack();
  }

  perceive(dt) {
    const was = this.sees;
    this.sees = this.canSeePlayer();
    if (this.hostile && G.exposeT > 0 && P.state !== 'hidden' && P.state !== 'dead' && !P.hero) {
      this.lastSeen = { x: P.x, y: P.y };
      if (this.state !== 'chase' && this.state !== 'bash') this.state = 'chase';
    }
    if (this.sees) {
      this.lastSeen = { x: P.x, y: P.y };
      if (!was) this.onSpot();
      if (this.state !== 'bash' || dist(this.x, this.y, P.x, P.y) < 3) this.state = 'chase';
      this.unseenT = 0;
    } else this.unseenT += dt;
  }
  onSpot() {
    this.spotT = 0.9;
    if (this.main && G.time - G.lastStab > 7) { G.lastStab = G.time; Sfx.stab(); }
  }
  hearNoise(x, y) {
    if (!this.hostile || this.state === 'chase' || this.state === 'bash' || this.state === 'check') return;
    this.state = 'investigate'; this.noiseAt = { x, y }; this.goal = null;
  }

  enterSearch() {
    this.state = 'search'; this.searchT = 7; this.goal = null;
    const ls = this.lastSeen || { x: this.x, y: this.y };
    const spots = M.hideSpots.filter((f) => dist(f.x + 0.5, f.y + 0.5, ls.x, ls.y) < 5.5 && !inLockedRoom(f.ax, f.ay));
    spots.sort((a, b) => dist(a.x, a.y, ls.x, ls.y) - dist(b.x, b.y, ls.x, ls.y));
    this.checkQueue = spots.slice(0, 2);
    if (this.hideTarget) { this.checkQueue = [this.hideTarget, ...this.checkQueue.filter((f) => f !== this.hideTarget)]; this.hideTarget = null; }
  }
  patrolGoal() {
    // the house "guides" the killer toward the player's area — keeps chases frequent
    const rad = this.unseenT > 20 ? 4 : 7;
    for (let i = 0; i < 30; i++) {
      const x = Math.floor(P.x) + randi(-rad, rad), y = Math.floor(P.y) + randi(-rad, rad);
      if (inB(x, y) && walkable(x, y) && dist(x, y, this.x, this.y) > 3) return [x, y];
    }
    const t = pick(G.openTiles);
    return [t[0], t[1]];
  }
  reached(g) { return g && Math.floor(this.x) === g[0] && Math.floor(this.y) === g[1]; }

  decide(dt) {
    this.repathT -= dt;
    let goal = null;
    switch (this.state) {
      case 'chase': {
        const tgt = this.sees ? [P.x, P.y] : this.lastSeen ? [this.lastSeen.x, this.lastSeen.y] : null;
        if (!tgt) { this.state = 'patrol'; break; }
        goal = walkGoal(tgt[0], tgt[1]);
        if (!this.sees && goal && this.reached(goal) && atCenter(this)) { this.enterSearch(); goal = null; }
        break;
      }
      case 'investigate': {
        goal = this.noiseAt ? walkGoal(this.noiseAt.x, this.noiseAt.y) : null;
        if (!goal || (this.reached(goal) && atCenter(this))) { this.lastSeen = this.noiseAt; this.enterSearch(); goal = null; }
        break;
      }
      case 'search': {
        this.searchT -= dt;
        if (this.checkQueue.length) {
          const f = this.checkQueue[0];
          goal = [f.ax, f.ay];
          if (this.reached(goal) && atCenter(this)) { this.state = 'check'; this.checkT = 0; this.checkSpot = f; return; }
        } else if (this.searchT <= 0) { this.state = 'patrol'; this.goal = null; }
        else if (!this.goal || this.reached(this.goal)) {
          const ls = this.lastSeen || { x: this.x, y: this.y };
          for (let i = 0; i < 20; i++) { const x = Math.floor(ls.x) + randi(-4, 4), y = Math.floor(ls.y) + randi(-4, 4); if (inB(x, y) && walkable(x, y)) { goal = [x, y]; break; } }
        } else goal = this.goal;
        break;
      }
      default: { // patrol
        if (!this.goal || this.reached(this.goal)) {
          if (this.goal && rnd() < 0.35) { this.state = 'wait'; this.waitT = rand(0.6, 1.6); this.goal = null; return; }
          goal = this.patrolGoal();
        } else goal = this.goal;
      }
    }
    if (goal) this.setGoal(goal);
  }
  setGoal(g) {
    const changed = !this.goal || this.goal[0] !== g[0] || this.goal[1] !== g[1];
    this.goal = g;
    if (changed || this.repathT <= 0 || !this.path) this.repath();
  }
  repath() {
    this.repathT = 0.3 + rnd() * 0.15;
    if (!this.goal) return;
    const [tx, ty] = this.tile();
    this.path = findPath(tx, ty, this.goal[0], this.goal[1], this.pathOpts());
    this.pathI = 0;
    if (!this.path) {
      this.goal = null;
      if (this.state === 'chase' && !this.sees) this.enterSearch();
      else if (this.state === 'search' && this.checkQueue.length) this.checkQueue.shift();
    }
  }

  moveAlong(dt, mult = 1) {
    if (!this.path) return 0;
    let d = this.speed() * mult * dt, total = 0, guard = 0;
    // step onto the current tile's centre — never past it
    const toCenter = () => {
      const cd = centerDir(this);
      if (!cd) return 0;
      const off = cd[0] ? Math.abs(Math.floor(this.x) + 0.5 - this.x) : Math.abs(Math.floor(this.y) + 0.5 - this.y);
      return gridMove(this, [cd], Math.min(d, off), walkable, 0.51);
    };
    while (d > EPS && guard++ < 10) {
      if (!this.path) break; // an unlock re-paths everyone, this one included
      if (this.pathI >= this.path.length) { const m = toCenter(); if (m <= 0) break; d -= m; total += m; continue; }
      const st = this.path[this.pathI];
      const sx = st.i % M.w, sy = (st.i / M.w) | 0;
      const tx = Math.floor(this.x), ty = Math.floor(this.y);
      if (tx === sx && ty === sy) {
        if (atCenter(this)) { this.pathI++; continue; }
        const m = toCenter(); if (m <= 0) break; d -= m; total += m; continue;
      }
      if (st.via === VIA.TOILET || st.via === VIA.WELL) {
        if (!atCenter(this)) { const m = toCenter(); if (m <= 0) break; d -= m; total += m; continue; }
        if (st.via === VIA.TOILET && G.toiletCd > 0) break;
        this.beginTrav(st); break;
      }
      const dir = [sx - tx, sy - ty];
      if (Math.abs(dir[0]) + Math.abs(dir[1]) !== 1) { this.path = null; this.repathT = 0; break; }
      const door = doorAt(sx, sy);
      if (door && door.state === 'locked') {
        if (!atCenter(this)) { const m = toCenter(); if (m <= 0) break; d -= m; total += m; continue; }
        if (this.canUnlock()) { this.keys--; door.state = 'open'; if (nearVol(door.x, door.y, 14) > 0) Sfx.unlock(); FX.sparks(door.x * CFG.TS + 7, door.y * CFG.TS + 5, 6); if (this.onUnlock) this.onUnlock(door); repathAll(); continue; }
        if (this.canBash && G.mode !== 'revenge') this.startBash(door);
        else { this.path = null; this.repathT = 0; }
        break;
      }
      const m = gridMove(this, [dir], d, walkable, 0.51);
      if (m <= 0) { this.path = null; this.repathT = 0; break; }
      d -= m; total += m;
    }
    return total;
  }

  animate(moved, dt) {
    this.amt = approach(this.amt, moved > 0 ? 1 : 0, dt * (moved > 0 ? 7 : 8));
    if (moved > 0) {
      this.ang = angApproach(this.ang, Math.atan2(this.dy, this.dx), dt * 10);
      this.phase += moved * this.phaseRate;
      const idx = Math.floor(this.phase / Math.PI);
      if (idx !== this.lastStepIdx) {
        this.lastStepIdx = idx;
        const v = nearVol(this.x, this.y, 10);
        if (v > 0.05 && this.main) Sfx.step((this.heavy ? 0.12 : 0.06) * v, this.heavy);
      }
    } else this.phase = approach(this.phase, Math.round(this.phase / Math.PI) * Math.PI, dt * 6);
  }

  honeyCheck() {
    const tx = Math.floor(this.x), ty = Math.floor(this.y);
    const i = G.honeyTraps.findIndex((h) => h.x === tx && h.y === ty);
    if (i < 0) return;
    G.honeyTraps.splice(i, 1);
    this.stuckT = CFG.HONEY_STICK;
    Sfx.honeyStick();
    FX.burst(this.x * CFG.TS, this.y * CFG.TS, 10, { c: [C.honey, C.honey2, '#ffd27a'], sp0: 10, sp1: 30, l0: 0.3, l1: 0.6 });
  }

  // ── doors ──
  startBash(door) {
    this.state = 'bash'; this.bashDoor = door; this.bashT = door.bash * this.bashTime; this.bashSnd = 0; this.bashCheck = 1.2;
    this.ang = Math.atan2(door.y + 0.5 - this.y, door.x + 0.5 - this.x);
  }
  updateBash(dt) {
    const d = this.bashDoor;
    this.amt = approach(this.amt, 0, dt * 6);
    if (!d || d.state !== 'locked') { this.state = 'chase'; this.path = null; this.repathT = 0; return; }
    this.bashT += dt; d.bash = this.bashT / this.bashTime; d.shake = 0.12;
    this.bashSnd -= dt;
    if (this.bashSnd <= 0) {
      this.bashSnd = 0.55;
      const v = nearVol(d.x, d.y, 16);
      if (v > 0) Sfx.bash();
      FX.dust(d.x * CFG.TS + 7, d.y * CFG.TS + 7, 3);
    }
    this.bashCheck -= dt;
    if (this.bashCheck <= 0) { // abandon if the door is no longer worth it
      this.bashCheck = 1.2;
      if (this.sees || this.lastSeen) {
        const tgt = this.sees ? walkGoal(P.x, P.y) : walkGoal(this.lastSeen.x, this.lastSeen.y);
        if (tgt) {
          const [tx, ty] = this.tile();
          const p = findPath(tx, ty, tgt[0], tgt[1], this.pathOpts());
          if (p && !p.some((s) => s.i === d.y * M.w + d.x)) { this.state = 'chase'; this.path = p; this.pathI = 0; return; }
        }
      }
    }
    if (this.bashT >= this.bashTime) {
      d.state = 'broken'; d.bash = 0;
      Sfx.doorBreak(); FX.debris(d.x * CFG.TS + 7, d.y * CFG.TS + 7, 16);
      if (nearVol(d.x, d.y, 10) > 0.3) G.shake = 3;
      this.state = 'chase'; this.bashDoor = null;
      repathAll();
    }
  }

  // ── hide-spot check (5 s gauge) ──
  updateCheck(dt) {
    const f = this.checkSpot;
    this.amt = approach(this.amt, 0, dt * 6);
    this.ang = angApproach(this.ang, Math.atan2(f.y - this.y, f.x - this.x), dt * 8);
    if (this.sees) { this.state = 'chase'; f.check = 0; return; }
    this.checkT += dt; f.check = this.checkT / CFG.HIDE_CHECK; f.shake = 0.06;
    if (this.checkT >= CFG.HIDE_CHECK) {
      f.check = 0;
      this.checkQueue.shift();
      if (P.state === 'hidden' && P.hide === f) {
        forceExitHide();
        this.lastSeen = { x: P.x, y: P.y }; this.state = 'chase';
        this.atk = { phase: 'strike', t: 0, f: 0, landed: true };
        hurtPlayer(this.dmg, this.x, this.y, { knockMul: this.knockMul });
        this.onHit();
      } else { this.state = 'search'; this.goal = null; }
    }
  }

  // ── attack ──
  startAttack() { this.atk = { phase: 'windup', t: 0, f: 0, landed: false }; }
  updateAttack(dt) {
    const a = this.atk;
    a.t += dt;
    if (a.phase === 'windup') {
      a.f = Math.min(1, a.t / CFG.ATTACK_WINDUP);
      this.ang = angApproach(this.ang, Math.atan2(P.y - this.y, P.x - this.x), dt * 12);
      if (this.sees) { const g = walkGoal(P.x, P.y); if (g) this.setGoal(g); }
      if (this.path) { const m = this.moveAlong(dt, 0.4); this.phase += m * this.phaseRate; }
      if (a.t >= CFG.ATTACK_WINDUP) {
        a.phase = 'strike'; a.t = 0;
        if (targetable() && dist(this.x, this.y, P.x, P.y) <= CFG.ATTACK_REACH && los(this.x, this.y, P.x, P.y)) {
          a.landed = true;
          hurtPlayer(this.dmg, this.x, this.y, { knockMul: this.knockMul });
          this.onHit();
        } else Sfx.whiff();
      }
    } else if (a.phase === 'strike') {
      a.f = Math.min(1, a.t / 0.14);
      if (a.t >= 0.14) { a.phase = 'recover'; a.t = 0; }
    } else {
      const dur = a.landed ? CFG.ATTACK_RECOVER : 0.5;
      a.f = Math.min(1, a.t / dur);
      if (a.t >= dur) { this.atk = null; this.atkCd = 0.25; }
    }
    this.amt = approach(this.amt, a.phase === 'windup' ? 0.3 : 0, dt * 6);
  }

  // ── toilets / wells ──
  beginTrav(st) {
    const kind = st.via === VIA.TOILET ? 'toilet' : 'well';
    if (this.onTrav) this.onTrav(kind);
    this.trav = { kind, t: 0, to: st.i, moved: false };
    if (kind === 'toilet') { G.toiletCd = CFG.TOILET_CD; if (nearVol(this.x, this.y, 14) > 0) Sfx.flush(); }
    else Sfx.well();
  }
  updateTrav(dt) {
    const tr = this.trav;
    tr.t += dt;
    const mid = tr.kind === 'toilet' ? 0.4 : 0.9;
    if (!tr.moved && tr.t >= mid) {
      tr.moved = true;
      this.x = (tr.to % M.w) + 0.5; this.y = ((tr.to / M.w) | 0) + 0.5;
      FX.splash(this.x * CFG.TS, this.y * CFG.TS, 10);
      this.pathI++;
      if (nearVol(this.x, this.y, 12) > 0) (tr.kind === 'toilet' ? Sfx.flush() : Sfx.well());
    }
    if (tr.t >= mid + 0.35) this.trav = null;
  }
  travScale() {
    if (!this.trav) return 1;
    const tr = this.trav, mid = tr.kind === 'toilet' ? 0.4 : 0.9;
    return tr.t < mid ? Math.max(0, 1 - tr.t / Math.min(mid, 0.4)) : Math.min(1, (tr.t - mid) / 0.35);
  }

  // ── revenge: flee from the hero ──
  updateFlee(dt) {
    this.fleeT -= dt;
    const [tx, ty] = this.tile();
    const near = dist(this.x, this.y, P.x, P.y) < 5;
    if (this.fleeT <= 0 || !this.path || this.pathI >= this.path.length) {
      this.fleeT = near ? 0.25 : 0.5;
      const opts = this.pathOpts();
      const fH = costField(Math.floor(P.x), Math.floor(P.y), { key: true, toilets: true });
      const fK = costField(tx, ty, opts);
      let best = -1, bs = -Infinity;
      for (let i = 0; i < fK.length; i++) {
        const k = fK[i], h = fH[i];
        if (k === Infinity || h === Infinity || k >= h - 0.5) continue;
        const s = h - 0.55 * k + rnd() * 1.2;
        if (s > bs) { bs = s; best = i; }
      }
      if (best >= 0) { this.goal = [best % M.w, (best / M.w) | 0]; this.path = findPath(tx, ty, this.goal[0], this.goal[1], opts); this.pathI = 0; }
    }
    const moved = this.moveAlong(dt);
    this.animate(moved, dt);
    this.honeyCheck();
    // pick up keys while fleeing
    const ki = G.keyItems.findIndex((k) => k.x === tx && k.y === ty);
    if (ki >= 0) { G.keyItems.splice(ki, 1); this.keys++; Sfx.key(); G.keyRespawn.push(CFG.KEY_RESPAWN); }
  }

  // ── drawing ──
  feet(camX, camY) { return [this.x * CFG.TS - camX, this.y * CFG.TS - camY + 4]; }
  pose() {
    const st = { ang: this.ang, phase: this.phase, amt: this.amt, breath: this.breath, t: this.t, scale: this.travScale() };
    if (this.atk) st.atk = this.atk;
    if (this.state === 'bash' && this.bashDoor) {
      const c = (this.bashT * 1.8) % 1;
      st.atk = c < 0.6 ? { phase: 'windup', f: c / 0.6 } : { phase: 'strike', f: (c - 0.6) / 0.4 };
    }
    if (this.flashT > 0 && ((this.flashT * 30) | 0) % 2) st.flash = '#ffffff';
    if (this.stuckT > 0) st.amt = 0.15 + Math.abs(Math.sin(this.t * 9)) * 0.2;
    return st;
  }
  drawBody(X, Y, st) {}
  draw(camX, camY, silhouette) {
    const [X, Y] = this.feet(camX, camY);
    const st = this.pose();
    if (st.scale <= 0.04) return;
    if (silhouette) st.flash = silhouette;
    if (this.stuckT > 0) drawHoney(X, Y, this.t, true);
    groundShadow(X, Y, 5.5 * st.scale, 2 * st.scale);
    this.drawBody(X, Y, st);
    if (this.stuckT > 0) { for (let i = -1; i <= 1; i++) line(X + i * 3, Y, X + i * 2, Y - 6 - Math.sin(this.t * 6 + i) * 2, C.honey); }
  }
  drawOverhead(camX, camY) {
    const [X, Y] = this.feet(camX, camY);
    const top = Y - this.headH;
    if (this.stunT > 0 || this.stuckT > 0) iconStars(X, top + 2, this.t);
    if (this.spotT > 0 && this.hostile) { text3('!', X + 0.5, top - 6 - (this.spotT > 0.7 ? (this.spotT - 0.7) * 20 : 0), C.red, 1, 'center'); }
    if (G.heartsShown && this.main) for (let i = 0; i < 3; i++) iconHeart(X - 9 + i * 7, top - 12, i < this.hp);
  }
}

// ── 12_items.js ──
// ─────────────────────────────────────────────────────────────
// Items — keys, glowing laurels + slot reel (S·H·A·Z·A·M / honey),
// the A-only phase after a revenge ends, honey traps
// ─────────────────────────────────────────────────────────────

const SLOT_SYMS = ['S', 'H', 'A', 'Z', 'M', 'honey'];

function itemOccupancy() {
  const s = new Set();
  const add = (o) => s.add(o.y * M.w + o.x);
  G.keyItems.forEach(add); G.laurels.forEach(add); G.aItems.forEach(add); G.candles.forEach(add); G.honeyTraps.forEach(add);
  for (const w of M.wells) add(w);
  return s;
}

function spawnTile(minD = 6, o = {}) {
  const occ = itemOccupancy();
  const locked = o.lockedP ? G.openTiles.filter(([x, y]) => inLockedRoom(x, y)) : null;
  for (let i = 0; i < 80; i++) {
    let t = null;
    if (locked && locked.length && rnd() < o.lockedP) t = pick(locked);
    if (!t) t = pick(G.openTiles);
    const [x, y] = t;
    if (!openTile(x, y) || occ.has(y * M.w + x)) continue;
    if (P && dist(x + 0.5, y + 0.5, P.x, P.y) < minD) continue;
    if (o.maxD && P && dist(x + 0.5, y + 0.5, P.x, P.y) > o.maxD) continue;
    if (o.noLocked && inLockedRoom(x, y)) continue;
    if (o.hidden && Vision.visibleTile(x, y)) continue;
    if (o.clear && !candleSpotClear(x, y)) continue;
    return [x, y];
  }
  return pick(G.openTiles);
}

function initItems() {
  for (let i = 0; i < CFG.KEYS; i++) { const [x, y] = spawnTile(3, { noLocked: true }); G.keyItems.push({ x, y, t: rand(0, 5) }); }
  for (let i = 0; i < CFG.LAURELS; i++) { const [x, y] = spawnTile(4, { lockedP: 0.3 }); G.laurels.push({ x, y, t: rand(0, 5) }); }
  // a starter key close by so the first locked door is meaningful
  if (P) { const [x, y] = spawnTile(2, { maxD: 6, noLocked: true }); G.keyItems.push({ x, y, t: 0 }); }
}

function updateItems(dt) {
  for (const k of G.keyItems) k.t += dt;
  for (const l of G.laurels) l.t += dt;
  for (const a of G.aItems) a.t += dt;
  for (const c of G.candles) c.t += dt;
  // respawns
  const tick = (arr) => { for (let i = arr.length - 1; i >= 0; i--) { arr[i] -= dt; if (arr[i] <= 0) { arr.splice(i, 1); return true; } } return false; };
  if (tick(G.keyRespawn)) { const [x, y] = spawnTile(6); G.keyItems.push({ x, y, t: 0 }); }
  if (G.keyItems.length + G.keyRespawn.length < CFG.KEYS) G.keyRespawn.push(CFG.KEY_RESPAWN);
  if (!G.aPhase) {
    if (tick(G.laurelRespawn)) { const [x, y] = spawnTile(7, { lockedP: 0.3 }); G.laurels.push({ x, y, t: 0 }); FX.sparks(x * CFG.TS + 7, y * CFG.TS + 7, 10); }
    if (G.laurels.length + G.laurelRespawn.length < CFG.LAURELS && G.mode === 'normal') G.laurelRespawn.push(CFG.LAUREL_RESPAWN);
  } else if (G.mode === 'normal') {
    const need = 2 - P.letters.A;
    if (tick(G.aRespawn)) { const [x, y] = spawnTile(7, { lockedP: 0.25 }); G.aItems.push({ x, y, t: 0 }); }
    if (G.aItems.length + G.aRespawn.length < need) G.aRespawn.push(CFG.LAUREL_RESPAWN);
  }
}

function pickupItems() {
  const tx = Math.floor(P.x), ty = Math.floor(P.y), TS = CFG.TS;
  if (P.hero) return;
  let i = G.keyItems.findIndex((k) => k.x === tx && k.y === ty);
  if (i >= 0 && P.keys < CFG.KEY_MAX) {
    G.keyItems.splice(i, 1); P.keys++;
    Sfx.key(); FX.sparks(tx * TS + 7, ty * TS + 6, 8, [C.key, '#ffffff']);
    G.keyRespawn.push(CFG.KEY_RESPAWN); G.hudPop.keys = 1;
  }
  i = G.laurels.findIndex((l) => l.x === tx && l.y === ty);
  if (i >= 0) {
    G.laurels.splice(i, 1);
    Sfx.laurel(); FX.ring(tx * TS + 7, ty * TS + 6, C.gold, 16); FX.sparks(tx * TS + 7, ty * TS + 6, 14);
    G.slot.queue.push(rollSlot());
    G.laurelRespawn.push(CFG.LAUREL_RESPAWN);
  }
  i = G.aItems.findIndex((a) => a.x === tx && a.y === ty);
  if (i >= 0) {
    G.aItems.splice(i, 1);
    if (P.letters.A < 2) { P.letters.A++; G.letterPop.A = 1; Sfx.letter(); }
    FX.ring(tx * TS + 7, ty * TS + 6, C.gold, 18); FX.sparks(tx * TS + 7, ty * TS + 6, 16);
    checkShazam();
  }
}

function rollSlot() {
  if (PARAMS.slot) return PARAMS.slot;
  if (rnd() < CFG.SLOT_LETTER_P) return LETTERS[randi(0, LETTERS.length - 1)];
  return 'honey';
}

function updateSlot(dt) {
  const S = G.slot;
  if (!S.active && S.queue.length) {
    const res = S.queue.shift();
    S.active = { res, t: 0, dur: CFG.SLOT_SPIN, idx: -1, landed: false, holdT: 0, total: 3 * SLOT_SYMS.length + SLOT_SYMS.indexOf(res) };
  }
  const s = S.active;
  if (!s) return;
  s.t += dt;
  const pos = s.total * Ease.outCubic(Math.min(1, s.t / s.dur));
  const idx = Math.floor(pos);
  if (idx !== s.idx) { s.idx = idx; if (!s.landed) Sfx.slotTick(); }
  s.pos = pos;
  if (s.t >= s.dur && !s.landed) { s.landed = true; applySlot(s.res); }
  if (s.landed) { s.holdT += dt; if (s.holdT > 0.6) S.active = null; }
}

function applySlot(res) {
  if (res === 'honey') {
    if (P.honey < CFG.HONEY_MAX) { P.honey++; G.hudPop.honey = 1; }
    Sfx.honeyGet(); Sfx.slotLand(true);
    return;
  }
  let got = false;
  if (res === 'A') { if (P.letters.A < 2) { P.letters.A++; got = true; } }
  else if (!P.letters[res]) { P.letters[res] = 1; got = true; }
  if (got) { G.letterPop[res] = 1; Sfx.slotLand(true); Sfx.letter(); checkShazam(); }
  else {
    // duplicate: 5 s of reveal + a little speed
    G.dupT = CFG.DUP_BUFF; Sfx.slotLand(false); Sfx.dup();
    FX.ring(P.x * CFG.TS, P.y * CFG.TS - 6, '#7ad0ff', 22);
  }
}

function lettersComplete() { const l = P.letters; return l.S && l.H && l.Z && l.M && l.A >= 2; }
function checkShazam() { if (lettersComplete() && G.mode === 'normal') G.pendingShazam = true; }

function drawItems(camX, camY, t) {
  const TS = CFG.TS;
  for (const h of G.honeyTraps) if (Vision.visibleTile(h.x, h.y)) drawHoney(h.x * TS + 7 - camX, h.y * TS + 8 - camY, t);
  for (const k of G.keyItems) {
    if (!Vision.visibleTile(k.x, k.y)) continue;
    // the Janitor's flashlight blinds you: keys only show up close
    if (G.blackoutT > 0 && dist(k.x + 0.5, k.y + 0.5, P.x, P.y) > CFG.JANITOR_KEY_SEE) continue;
    drawKey(k.x * TS + 7 - camX, k.y * TS + 7 - camY, k.t);
  }
  for (const l of G.laurels) drawLaurel(l.x * TS + 7 - camX, l.y * TS + 5 - camY, l.t);

const BASE_HAND_R = [0.6, 3.6, 7.6];

// ── 6.1 도살자 ───────────────────────────────────────────────
class Butcher extends Enemy {
  constructor(tx, ty) {
    super('butcher', tx, ty);
    this.title = 'THE BUTCHER'; this.ko = '도살자';
    this.dmg = CFG.BUTCHER_DMG; this.bashTime = CFG.BUTCHER_BASH; this.heavy = true; this.phaseRate = 3.4; this.headH = 31;
    this.knockMul = 1.2; this.breakCd = CFG.BUTCHER_BREAK_CD * 0.5; this.breaking = null; this.field = null; this.fieldKey = -1; this.fieldT = 0;
  }
  ability(dt) {
    this.breakCd -= dt; this.fieldT -= dt;
    if (this.breaking) {
      const b = this.breaking;
      b.t += dt; this.amt = approach(this.amt, 0, dt * 8);
      if (rnd() < dt * 12) FX.dust(b.x * CFG.TS + rand(2, 12), b.y * CFG.TS + rand(2, 12), 1);
      if (b.t >= CFG.BUTCHER_BREAK_WINDUP) this.breakWall();
      return true;
    }
    if (this.breakCd > 0 || !nearCenter(this)) return false;
    const [tx, ty] = this.tile();
    if (G.mode === 'revenge') {
      if (dist(this.x, this.y, P.x, P.y) > 6) return false;
      const fH = costField(Math.floor(P.x), Math.floor(P.y), { key: true, toilets: true });
      for (const [dx, dy] of DIRS) {
        const wx = tx + dx, wy = ty + dy, ox = wx + dx, oy = wy + dy;
        if (breakableWall(wx, wy) && fH[oy * M.w + ox] - fH[ty * M.w + tx] >= 5) { this.beginBreak(wx, wy, ox, oy); return true; }
      }
      return false;
    }
    if ((this.state !== 'chase' && this.state !== 'investigate') || !this.goal) return false;
    const key = this.goal[1] * M.w + this.goal[0];
    if (!this.field || this.fieldKey !== key || this.fieldT <= 0) { this.field = costField(this.goal[0], this.goal[1], {}); this.fieldKey = key; this.fieldT = 0.6; }
    const cur = this.field[ty * M.w + tx];
    for (const [dx, dy] of DIRS) {
      const wx = tx + dx, wy = ty + dy, ox = wx + dx, oy = wy + dy;
      if (!breakableWall(wx, wy)) continue;
      const beyond = this.field[oy * M.w + ox];
      if (beyond + 2 <= cur - CFG.BUTCHER_SHORTCUT) { this.beginBreak(wx, wy, ox, oy); return true; }
    }
    return false;
  }
  beginBreak(wx, wy, ox, oy) {
    snapCenter(this);
    this.breaking = { x: wx, y: wy, ox, oy, t: 0 };
    this.ang = Math.atan2(wy + 0.5 - this.y, wx + 0.5 - this.x);
    G.cracks.push(this.breaking);
    if (nearVol(wx, wy, 15) > 0) Sfx.wallCrack();
  }
  breakWall() {
    const b = this.breaking;
    this.breaking = null; this.breakCd = CFG.BUTCHER_BREAK_CD;
    G.cracks = G.cracks.filter((c) => c !== b);
    M.t[b.y * M.w + b.x] = T.RUBBLE;
    rerenderTiles(b.x, b.y); G.openTiles.push([b.x, b.y]);
    Sfx.wallBreak(); FX.debris(b.x * CFG.TS + 7, b.y * CFG.TS + 7, 28);
    G.shake = Math.max(G.shake, 7 * nearVol(b.x, b.y, 12));
    this.atk = { phase: 'strike', t: 0, f: 0, landed: false };
    if (dist(P.x, P.y, b.ox + 0.5, b.oy + 0.5) < 1.3 && P.state !== 'hidden' && P.state !== 'dead') {
      stunPlayer(CFG.BUTCHER_STUN);
      FX.debris(P.x * CFG.TS, P.y * CFG.TS - 8, 8);
    }
    repathAll();
  }
  drawBody(X, Y, st) {
    if (this.breaking) st.atk = { phase: 'windup', f: Math.min(1, this.breaking.t / CFG.BUTCHER_BREAK_WINDUP) };
    st.handR = attackHand(st, BASE_HAND_R);
    drawKillerHuman(X, Y, st, STY_BUTCHER);
  }
}

// ── 6.2 마녀 ─────────────────────────────────────────────────
class Witch extends Enemy {
  constructor(tx, ty) {
    super('witch', tx, ty);
    this.title = 'THE WITCH'; this.ko = '마녀';
    this.phaseRate = 5.2; this.headH = 23; this.candleT = 0; this.placeT = 0; this.fakeT = 0; this.eyeT = 0;
  }
  canSeePlayer() {
    if (super.canSeePlayer()) return true;
    if (!P || P.hero || P.state === 'hidden' || P.state === 'dead' || P.state === 'toilet') return false;
    return G.candles.some((c) => !c.fake && dist(c.x + 0.5, c.y + 0.5, P.x, P.y) <= CFG.CANDLE_RADIUS);
  }
  litCount() { return G.candles.reduce((n, c) => n + (c.fake ? 0 : 1), 0); }
  globalUpdate(dt) {
    if (G.mode !== 'normal') return;
    this.candleT += dt;
    const lit = this.litCount();
    if (lit >= 2) {
      this.fakeT += dt;
      if (this.fakeT >= CFG.WITCH_FAKE_EVERY) {
        this.fakeT = 0;
        if (G.candles.filter((c) => c.fake).length < CFG.WITCH_FAKE_MAX) {
          const [x, y] = spawnTile(5, { maxD: 16, hidden: true, clear: true });
          G.candles.push({ x, y, fake: true, t: 0 });
        }
      }
    }
    if (lit >= 4) {
      this.eyeT += dt;
      if (this.eyeT >= CFG.WITCH_EYE_EVERY) { this.eyeT = 0; G.eyeT = CFG.WITCH_EYE_SHOW; G.exposeT = Math.max(G.exposeT, CFG.WITCH_EYE_SHOW); Sfx.eye(); }
    }
    if (lit >= 6 && G.phase === 'play') startPhase('hellgate');
  }
  ability(dt) {
    if (this.placeT > 0) { this.placeT -= dt; this.amt = approach(this.amt, 0, dt * 8); return true; }
    if (G.mode === 'normal' && this.candleT >= CFG.WITCH_CANDLE_EVERY && nearCenter(this)) {
      const [tx, ty] = this.tile();
      if (openTile(tx, ty) && candleSpotClear(tx, ty) && !G.candles.some((c) => c.x === tx && c.y === ty)) {
        snapCenter(this);
        G.candles.push({ x: tx, y: ty, fake: false, t: 0 });
        this.candleT = 0; this.placeT = CFG.WITCH_PLACE_PAUSE;
        if (nearVol(tx, ty, 16) > 0) Sfx.candlePlace();
        FX.sparks(tx * CFG.TS + 7, ty * CFG.TS + 2, 6, ['#ffb347', '#fff2c0']);
        G.hudPop.candles = 1;
        return true;
      }
    }
    return false;
  }
  drawBody(X, Y, st) {
    Y -= Math.round(Math.sin(this.t * 2.2) * 0.6);
    if (this.placeT > 0) st.handR = [3, 2.5, 3], st.handL = [3, -2.5, 3.5];
    else st.handR = attackHand(st, BASE_HAND_R);
    drawKillerHuman(X, Y, st, STY_WITCH);
  }
}
function extinguishCandle(c) {
  const i = G.candles.indexOf(c);
  if (i < 0) return;
  G.candles.splice(i, 1);
  const x = c.x * CFG.TS + 7, y = c.y * CFG.TS + 2;
  Sfx.candleOut();
  if (!c.fake) {
    G.exposeT = Math.max(G.exposeT, CFG.CANDLE_EXPOSE);
    FX.smoke(x, y, 6);
  } else {
    FX.smoke(x, y, 10, ['#5a2a6a', '#3a1a4a', '#7a3a8a']);
    Sfx.cackle();
    hurtPlayer(1, c.x + 0.5, c.y + 0.5, { noKnock: true });
    P.slowT = CFG.FAKE_SLOW;
  }
}

// ── 6.3 수위 ─────────────────────────────────────────────────

// ── 6.4 초진화체 ─────────────────────────────────────────────
class Evolver extends Enemy {
  constructor(tx, ty) {
    super('evolver', tx, ty);
    this.title = 'THE EVOLVER'; this.ko = '초진화체';
    this.stage = 'egg'; this.hostile = false; this.eggT = 0; this.evoT = 0; this.stillT = 0;
    this.tentCd = 6; this.tentRange = CFG.TENTACLE_RANGE; this.tent = null; this.upgT = 0; this.trail = []; this.headH = 14;
    this.phaseRate = 5.5;
  }
  canSeePlayer() { return this.stage !== 'egg' && super.canSeePlayer(); }
  get stealth() { return this.stage === 'larva' && this.stillT >= CFG.LARVA_STEALTH; }
  globalUpdate(dt) {
    if (this.stage === 'egg') {
      this.eggT += dt;
      const d = dist(this.x, this.y, P.x, P.y);
      if ((Vision.visible(this.x, this.y) && d <= 6) || d <= 2) this.hatch();
      else if (this.eggT >= CFG.EGG_TELEPORT) this.teleportEggNearPlayer();
      return;
    }
    if (G.mode !== 'normal') return;
    this.evoT += dt;
    if (this.stage === 'larva' && this.evoT >= CFG.EVOLVE_ADULT) this.evolve('adult');
    else if (this.stage === 'adult' && this.evoT >= CFG.EVOLVE_PERFECT) this.evolve('perfect');
    else if (this.stage === 'perfect') {
      this.upgT += dt;
      if (this.upgT >= CFG.PERFECT_UPGRADE_EVERY) {
        this.upgT = 0;
        if (rnd() < 0.5) this.ratio += CFG.PERFECT_SPEED_STEP; else this.tentRange += CFG.PERFECT_RANGE_STEP;
        this.flashT = 0.3; FX.ring(this.x * CFG.TS, this.y * CFG.TS - 8, '#c1263a', 16);
        if (nearVol(this.x, this.y, 12) > 0) Sfx.evolve();
      }
    }
  }
  get wings() { return this.stage === 'perfect' && this.speed() > CFG.PLAYER_SPEED; }
  teleportEggNearPlayer() {
    const f = costField(Math.floor(P.x), Math.floor(P.y), {});
    const cands = [];
    for (let i = 0; i < f.length; i++) if (f[i] >= 2 && f[i] <= 4 && openTile(i % M.w, (i / M.w) | 0)) cands.push(i);
    const vis = cands.filter((i) => Vision.visibleTile(i % M.w, (i / M.w) | 0));
    const i = pick(vis.length ? vis : cands.length ? cands : [Math.floor(P.y) * M.w + Math.floor(P.x)]);
    FX.smoke(this.x * CFG.TS, this.y * CFG.TS, 6);
    this.x = (i % M.w) + 0.5; this.y = ((i / M.w) | 0) + 0.5;
    Sfx.teleport();
    this.hatch();
  }
  hatch() {
    this.stage = 'larva'; this.hostile = true; this.state = 'chase'; this.lastSeen = { x: P.x, y: P.y }; this.evoT = 0;
    this.headH = 14;
    Sfx.hatch(); Sfx.scream('evolver');
    FX.burst(this.x * CFG.TS, this.y * CFG.TS - 6, 16, { c: ['#d6cfb2', '#ece6cf', '#9c6a6a'], sp0: 20, sp1: 60, l0: 0.4, l1: 0.8, size: 2, decal: 'debris' });
    G.shake = 3;
  }
  evolve(stage) {
    this.stage = stage; this.flashT = 0.6; this.headH = stage === 'perfect' ? 26 : 22;
    Sfx.evolve();
    FX.ring(this.x * CFG.TS, this.y * CFG.TS - 8, stage === 'perfect' ? '#c1263a' : '#8fbf6a', 26);
    FX.smoke(this.x * CFG.TS, this.y * CFG.TS - 6, 10, ['#3e5a3a', '#253a24', '#6f9a5a']);
    if (nearVol(this.x, this.y, 12) > 0.2) G.shake = 3;
  }
  update(dt) {
    if (this.stage === 'egg') { this.t += dt; return; }
    super.update(dt);
    this.trail.unshift([this.x, this.y]);
    if (this.trail.length > 16) this.trail.pop();
  }
  waitAmbush() { return this.stage === 'larva'; }
  decide(dt) {
    // larvae lie in ambush: when a patrol leg ends they wait long enough to go invisible
    if (this.stage === 'larva' && this.state === 'patrol' && this.goal && this.reached(this.goal) && atCenter(this)) {
      this.state = 'wait'; this.waitT = rand(4.5, 8); this.goal = null; return;
    }
    super.decide(dt);
  }
  ability(dt) {
    this.tentCd -= dt;
    if (this.stage === 'larva') { if (this.amt < 0.05 && !this.atk) this.stillT += dt; else this.stillT = 0; }
    if (this.tent) {
      const tn = this.tent;
      tn.t += dt; this.amt = approach(this.amt, 0, dt * 8);
      if (tn.phase === 'windup' && tn.t >= CFG.TENTACLE_WINDUP) {
        tn.phase = 'shoot'; tn.t = 0; Sfx.tentacle();
        const [tx, ty] = this.tile(), px = Math.floor(P.x), py = Math.floor(P.y);
        const along = tn.dir[0] ? py === ty && Math.sign(px - tx) === tn.dir[0] && Math.abs(px - tx) <= this.tentRange
          : px === tx && Math.sign(py - ty) === tn.dir[1] && Math.abs(py - ty) <= this.tentRange;
        tn.hit = along && los(this.x, this.y, P.x, P.y) && (targetable() || P.hero);
        tn.len = tn.hit ? dist(this.x, this.y, P.x, P.y) : this.tentRange;
        if (tn.hit) {
          if (P.hero) stunPlayer(0);
          else {
            P.state = 'pulled';
            P.pull = { sx: P.x, sy: P.y, tx: tx + tn.dir[0] + 0.5, ty: ty + tn.dir[1] + 0.5, t: 0, dur: 0.25, done: () => { this.atk = { phase: 'strike', t: 0, f: 0, landed: true }; hurtPlayer(this.dmg, this.x, this.y); } };
          }
        }
      } else if (tn.phase === 'shoot' && tn.t >= 0.35) { this.tent = null; this.tentCd = CFG.TENTACLE_CD; }
      return true;
    }
    if (this.stage !== 'larva' && this.tentCd <= 0) {
      const canSee = G.mode === 'revenge' ? los(this.x, this.y, P.x, P.y) : this.sees;
      const [tx, ty] = this.tile(), px = Math.floor(P.x), py = Math.floor(P.y);
      const aligned = (px === tx && Math.abs(py - ty) <= this.tentRange && py !== ty) || (py === ty && Math.abs(px - tx) <= this.tentRange && px !== tx);
      if (canSee && aligned && nearCenter(this) && P.state !== 'hidden') {

  }
  draw(camX, camY, silhouette) {

    if (this.stealth && !silhouette) {

        for (let i = 0; i < 5; i++) { const a = this.t * 3 + i * 1.3; px(X + Math.cos(a) * 3, Y - 3 + Math.sin(a * 1.3) * 2, rgba('#c8d8ff', 0.5)); }
      }

    }

  }
  drawBody(X, Y, st) {
    if (this.stage === 'larva') { drawLarva(X, Y, this, this.t, st.flash); return; }
    if (this.tent) st.tentacleOut = this.tent.phase === 'shoot' ? this.tent.len * 3 : Math.sin(this.tent.t * 40) * 0.8;

  }
  drawWorldUI(camX, camY) {
    if (!this.tent) return;
    const tn = this.tent, TS = CFG.TS;
    const X = this.x * TS - camX, Y = this.y * TS - camY - 6;
    if (tn.phase === 'windup') {

      L.globalAlpha = 1;
    } else {

    }
  }
}

// ── 6.5 박사 ─────────────────────────────────────────────────
// keep the saw / drill mix even as the swarm grows
function machineKind(ms) {
  const saws = ms.filter((m) => m.kind === 'saw').length, drills = ms.length - saws;
  return saws < drills ? 'saw' : drills < saws ? 'drill' : pick(['saw', 'drill']);
}

class Doctor extends Enemy {
  constructor(tx, ty) {
    super('doctor', tx, ty);
    this.title = 'THE DOCTOR'; this.ko = '박사';
    this.hostile = false; this.canBash = false; this.actT = 0; this.headH = 26; this.phaseRate = 4.6; this.beepT = 0;
    G.docT = CFG.DOCTOR_COUNTDOWN;
  }
  globalUpdate(dt) {
    if (G.mode !== 'normal') return;
    G.docT -= dt;
    if (G.docT <= 10) { this.beepT -= dt; if (this.beepT <= 0) { this.beepT = G.docT <= 3 ? 0.33 : 1; Sfx.beep(); } }
    if (G.docT <= 0 && G.phase === 'play') { G.docT = 0; startPhase('explode'); return; }
    this.actT += dt;
    if (this.actT >= CFG.DOCTOR_ACT_EVERY) { this.actT = 0; this.act(); }
  }
  machines() { return G.enemies.filter((e) => e.machine && e.alive); }
  act() {
    const ms = this.machines();

  }
  summon() {
    const ms = this.machines();
    const kind = machineKind(ms);
    const [tx, ty] = this.tile();
    const spot = DIRS.map(([dx, dy]) => [tx + dx, ty + dy]).find(([x, y]) => walkable(x, y)) || [tx, ty];
    G.enemies.push(new Machine(kind, spot[0], spot[1], this));
    Sfx.summon();
    FX.ring(spot[0] * CFG.TS + 7, spot[1] * CFG.TS + 7, '#7dff9a', 18); FX.sparks(spot[0] * CFG.TS + 7, spot[1] * CFG.TS + 7, 12, ['#7dff9a', '#ffffff']);
  }
  teleport(minD) {
    FX.ring(this.x * CFG.TS, this.y * CFG.TS - 8, '#7dff9a', 16);
    let t = null;
    for (let i = 0; i < 60; i++) { const c = pick(G.openTiles); if (dist(c[0] + 0.5, c[1] + 0.5, P.x, P.y) >= minD && walkable(c[0], c[1])) { t = c; break; } }
    if (!t) return;
    this.x = t[0] + 0.5; this.y = t[1] + 0.5; this.path = null; this.goal = null; this.state = 'patrol';
    if (nearVol(this.x, this.y, 18) > 0) Sfx.teleport();
    FX.ring(this.x * CFG.TS, this.y * CFG.TS - 8, '#7dff9a', 16);
  }
  patrolGoal() { const t = pick(G.openTiles); return [t[0], t[1]]; }
  ability(dt) {
    if (G.mode === 'revenge') return false;
    const d = dist(this.x, this.y, P.x, P.y);
    if (d < 0.85 && !P.hero && (P.state === 'free' || P.state === 'knock')) {
      G.docT = CFG.DOCTOR_COUNTDOWN; G.hudPop.timer = 1;
      Sfx.scream('doctor'); FX.sparks(this.x * CFG.TS, this.y * CFG.TS - 10, 14, ['#7dff9a', '#ffffff']);
      this.teleport(12);
      return true;
    }
    if (d < 7 && los(this.x, this.y, P.x, P.y) && P.state !== 'hidden') {
      if (this.state !== 'flee') { this.state = 'flee'; this.fleeT = 0; this.path = null; }
      this.updateFlee(dt);
      return true;
    }
    if (this.state === 'flee') { this.state = 'patrol'; this.goal = null; }
    return false;
  }
  drawBody(X, Y, st) { drawKillerHuman(X, Y, st, STY_DOCTOR); }
  drawOverhead(camX, camY) {
    super.drawOverhead(camX, camY);
    const [X, Y] = this.feet(camX, camY);
    drawTimerPlate(X, Y - this.headH - 4, G.docT);
  }
}
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function drawTimerPlate(X, Y, s) {
  const str = fmtTime(s), w = textW3(str) + 4;
  const urgent = s <= 10 && ((G.time * 4) | 0) % 2;
  rect(X - w / 2 - 1, Y - 1, w + 2, 9, C.ink);
  rect(X - w / 2, Y, w, 7, urgent ? '#7a1010' : '#1d2a1d');
  text3(str, X + 0.5, Y + 1, urgent ? '#ffffff' : '#7dff9a', 1, 'center');
}

class Machine extends Enemy {
  constructor(kind, tx, ty, doc) {
    super(kind, tx, ty);
    this.main = false; this.machine = true; this.doc = doc; this.useToilets = false;
    this.bashTime = kind === 'drill' ? CFG.DRILL_BASH : CFG.DOOR_BASH;
    this.dashCd = 3; this.dash = null; this.dormant = false; this.headH = 14; this.phaseRate = 6; this.sndT = 0;
    this.stunT = 0.6;
  }
  ability(dt) {
    this.dormant = dist(this.x, this.y, this.doc.x, this.doc.y) > CFG.MACHINE_LEASH;
    if (this.dormant) { this.amt = approach(this.amt, 0, dt * 6); this.sees = false; return true; }
    this.sndT -= dt;
    if (this.sndT <= 0 && nearVol(this.x, this.y, 9) > 0.1) { this.sndT = rand(1.4, 2.4); this.kind === 'saw' ? Sfx.saw() : Sfx.drill(); }
    this.dashCd -= dt;
    if (this.dash) {
      const s = this.dash;
      s.t += dt;
      if (s.phase === 'rev') {
        this.amt = approach(this.amt, 0, dt * 8);
        if (s.t >= CFG.SAW_DASH_WINDUP) { s.phase = 'go'; s.t = 0; Sfx.saw(); }
      } else {
        const m = gridMove(this, [s.dir], this.speed() * CFG.SAW_DASH_MULT * dt, walkable, 0.51);
        this.phase += m * 6; this.amt = 1;
        if (!s.hit && targetable() && dist(this.x, this.y, P.x, P.y) < 0.85) { s.hit = true; hurtPlayer(1, this.x, this.y); }
        if (s.t >= CFG.SAW_DASH_TIME || m <= 0) { this.dash = null; this.dashCd = 5; this.path = null; }
      }
      return true;
    }
    if (this.kind === 'saw' && this.dashCd <= 0 && this.sees && nearCenter(this)) {
      const [tx, ty] = this.tile(), px = Math.floor(P.x), py = Math.floor(P.y);
      const aligned = (px === tx && Math.abs(py - ty) <= 4 && py !== ty) || (py === ty && Math.abs(px - tx) <= 4 && px !== tx);
      if (aligned && los(this.x, this.y, P.x, P.y)) { snapCenter(this); this.dash = { phase: 'rev', t: 0, dir: [Math.sign(px - tx), Math.sign(py - ty)], hit: false }; this.ang = Math.atan2(this.dash.dir[1], this.dash.dir[0]); Sfx.saw(); return true; }
    }
    return false;
  }
  drawBody(X, Y, st) {
    if (this.dash && this.dash.phase === 'rev') X += Math.round(Math.sin(this.t * 80));
    drawMachine(X, Y, st, this.kind, this.dormant);
  }
}

// ── 6.6 무사 ─────────────────────────────────────────────────
class Samurai extends Enemy {
  constructor(tx, ty) {
    super('samurai', tx, ty);
    this.title = 'THE SAMURAI'; this.ko = '무사';
    this.heavy = true; this.phaseRate = 3.6; this.headH = 31; this.spearCd = 4; this.thrust = null; this.wellT = 0; this.sealed = false;
  }
  canSeePlayer() {
    if (super.canSeePlayer()) return true;
    if (!P || P.hero || P.state === 'hidden' || P.state === 'dead' || P.state === 'toilet') return false;
    return dist(this.x, this.y, P.x, P.y) <= CFG.SAMURAI_XRAY;
  }
  globalUpdate(dt) {
    if (G.mode !== 'normal' || this.sealed) return;
    this.wellT += dt;
    if (M.wells.length >= 2 || !nearCenter(this)) return;
    const [tx, ty] = this.tile();
    if (!openTile(tx, ty) || G.candles.some((c) => c.x === tx && c.y === ty)) return;
    if (M.wells.length === 0 && this.wellT >= CFG.WELL_FIRST) this.placeWell(tx, ty);
    else if (M.wells.length === 1 && this.wellT >= CFG.WELL_FIRST + 10) {
      const a = M.wells[0];
      const p = findPath(a.x, a.y, tx, ty, {});
      if (p && p.cost >= CFG.WELL_GAP) { this.placeWell(tx, ty); this.useWells = true; }
    }
  }
  placeWell(x, y) {
    M.wells.push({ x, y, sealed: false });
    FX.dust(x * CFG.TS + 7, y * CFG.TS + 7, 10);
    if (nearVol(x, y, 14) > 0) Sfx.well();
  }
  onShazam() { this.sealed = true; this.useWells = false; for (const w of M.wells) w.sealed = true; }
  ability(dt) {
    this.spearCd -= dt;
    if (this.thrust) {
      const s = this.thrust;
      s.t += dt; this.amt = approach(this.amt, 0, dt * 10); this.ang = s.ang;
      if (s.phase === 'aim') {
        if (s.t >= CFG.SPEAR_WINDUP) {
          s.phase = 'strike'; s.t = 0; Sfx.spear();
          const px = Math.floor(P.x), py = Math.floor(P.y);
          const on = s.dir[0] ? py === s.ty && Math.sign(px - s.tx) === s.dir[0] && Math.abs(px - s.tx) <= CFG.SPEAR_RANGE
            : px === s.tx && Math.sign(py - s.ty) === s.dir[1] && Math.abs(py - s.ty) <= CFG.SPEAR_RANGE;
          if (on && P.state !== 'hidden' && P.state !== 'dead' && P.state !== 'toilet') {
            if (P.hero) stunPlayer(0); else hurtPlayer(1, this.x, this.y);
            FX.sparks(P.x * CFG.TS, P.y * CFG.TS - 8, 10, ['#ffffff', '#e6e9ef']);
          }
        }
      } else if (s.t >= 0.4) { this.thrust = null; this.spearCd = CFG.SPEAR_CD; }
      return true;
    }
    if (this.spearCd > 0 || !nearCenter(this) || P.state === 'hidden') return false;
    const can = G.mode === 'revenge' ? dist(this.x, this.y, P.x, P.y) <= CFG.SAMURAI_XRAY : this.sees;
    if (!can) return false;
    const [tx, ty] = this.tile(), px = Math.floor(P.x), py = Math.floor(P.y);
    const R = CFG.SPEAR_RANGE;
    if ((px === tx && py !== ty && Math.abs(py - ty) <= R) || (py === ty && px !== tx && Math.abs(px - tx) <= R)) {
      const dir = [Math.sign(px - tx), Math.sign(py - ty)];
      snapCenter(this);
      this.thrust = { phase: 'aim', t: 0, dir, tx, ty, ang: Math.atan2(dir[1], dir[0]) };
      Sfx.spearWindup();
      return true;
    }
    return false;
  }
  drawBody(X, Y, st) {
    let ext = 0, pull = 0;
    if (this.thrust) {
      if (this.thrust.phase === 'aim') pull = Ease.outCubic(Math.min(1, this.thrust.t / CFG.SPEAR_WINDUP));
      else ext = Math.sin(Math.min(1, this.thrust.t / 0.4) * Math.PI) * 10;
    }
    st.handL = [3.6 - pull * 2.2 + ext * 0.3, -0.8, 9.2];
    st.handR = [-0.4 - pull * 2.2 + ext * 0.3, 1.8, 8.8];
    if (this.atk) { const a = attackHand(st, [3.6, -0.8, 9.2]); if (a) st.handL = a; }
    st.spearExt = ext;
    drawKillerHuman(X, Y, st, STY_SAMURAI);
  }
  drawWorldUI(camX, camY) {
    if (!this.thrust || this.thrust.phase !== 'aim') return;
    const s = this.thrust, TS = CFG.TS;
    const X = (s.tx + 0.5) * TS - camX, Y = (s.ty + 0.5) * TS - camY;
    const len = CFG.SPEAR_RANGE * TS + 6;
    const k = s.t / CFG.SPEAR_WINDUP;
    L.globalAlpha = 0.45 + 0.45 * Math.abs(Math.sin(s.t * 18));
    const ex = X + s.dir[0] * len, ey = Y + s.dir[1] * len;
    line(X, Y, ex, ey, '#ff2a3a');
    if (k > 0.5) line(X + s.dir[1], Y + s.dir[0], ex + s.dir[1], ey + s.dir[0], '#ff6a70');
    L.globalAlpha = 1;
  }
}

const KILLER_TYPES = { butcher: Butcher, witch: Witch, janitor: Janitor, evolver: Evolver, doctor: Doctor, samurai: Samurai };
const KILLER_KINDS = Object.keys(KILLER_TYPES);

// ── 14_comic.js ──
// ─────────────────────────────────────────────────────────────
// Punishment sequence — a full-res comic panel ("극화체").
// Left: the muscle-giant hero holding the killer by the collar, fist
// raised. Right: the killer. Three lightning marks fly into the fist;
// tap on time to charge it (effects only, no judgement text).
// Damage = charge level; 3 = one-hit KO.
// Design space: 1000 × 1800, fitted to the screen.
// ─────────────────────────────────────────────────────────────

const INK = '#0a0608';
const Comic = {
  W: 1000, H: 1800, WIN: 0.17,

  start(k) {
    this.k = k; this.kind = k.kind; this.stage = k.stage || null;
    this.t = 0; this.charge = 0; this.done = false; this.punchT = null; this.impactT = null; this.endT = null;
    this.hpBefore = k.hp; this.hpAfter = k.hp; this.ko = false;
    this.marks = [1.0, 1.75, 2.5].map((t0) => ({ t0, arrive: t0 + 1.0, state: 'fly', resT: 0 }));
    this.parts = []; this.arcs = []; this.shake = 0; this.flash = 0; this.fade = 0;
    this.seed = Math.random() * 1000;
    this.layout();
    this.cache = null;
    Sfx.stopDrone();
  },
  layout() {
    const pw = Screen.pw, ph = Screen.ph;
    const s = Math.min(pw / this.W, ph / this.H * 1.08);
    this.s = s; this.ox = (pw - this.W * s) / 2; this.oy = Math.max(0, (ph - this.H * s) / 2);
  },

  update(dt) {
    this.t += dt;
    this.shake = Math.max(0, this.shake - dt * 40);
    this.flash = Math.max(0, this.flash - dt * 2.5);
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.r2 = (p.r2 || 0) + (p.spin || 0) * dt;
      if (p.t > p.life) this.parts.splice(i, 1);
    }
    if (!this.punchT && Input.tapped()) {
      let best = null, bd = Infinity;
      for (const m of this.marks) if (m.state === 'fly') { const d = Math.abs(this.t - m.arrive); if (d < bd) { bd = d; best = m; } }
      if (best && bd <= this.WIN) this.hitMark(best);
    }
    for (const m of this.marks) if (m.state === 'fly' && this.t > m.arrive + this.WIN) this.missMark(m);
    if (!this.punchT && this.marks.every((m) => m.state !== 'fly')) this.punchT = this.t + 0.45;
    if (this.punchT && !this.impactT && this.t >= this.punchT + 0.2) this.impact();
    if (this.impactT && !this.endT && this.t >= this.impactT + (this.ko ? 2.4 : 1.6)) this.endT = this.t;
    if (this.endT) { this.fade = Math.min(1, (this.t - this.endT) / 0.45); if (this.fade >= 1) this.done = true; }
  },
  fist() { return [200 + Math.sin(this.t * 3) * 6, 360 + Math.sin(this.t * 2.2) * 8]; },
  hitMark(m) {
    m.state = 'hit'; m.resT = this.t;
    this.charge++;
    Sfx.zap(this.charge);
    this.shake = 10 + this.charge * 4; this.flash = 0.25;
    const [fx, fy] = this.fist();
    for (let i = 0; i < 26; i++) { const a = rand(0, TAU), sp = rand(300, 900); this.parts.push({ kind: 'spark', x: fx, y: fy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.55), t: 0, c: pick(['#ffffff', '#fff3b0', '#ffd23f', '#9fe8ff']) }); }
    this.parts.push({ kind: 'ring', x: fx, y: fy, vx: 0, vy: 0, life: 0.35, t: 0, c: '#fff3b0' });
  },
  missMark(m) {
    m.state = 'miss'; m.resT = this.t;
    Sfx.fizz();
    const [x, y] = this.markPos(m.arrive);
    for (let i = 0; i < 10; i++) this.parts.push({ kind: 'smoke', x: x + rand(-20, 20), y: y + rand(-20, 20), vx: rand(-60, 60), vy: rand(-120, -30), life: rand(0.4, 0.8), t: 0, c: '#5a5560' });
  },
  impact() {
    this.impactT = this.t;
    const dmg = this.charge;
    this.hpAfter = Math.max(0, this.hpBefore - dmg);
    this.ko = this.hpAfter <= 0;
    if (dmg === 0) { Sfx.whiff(); return; }
    Sfx.punch(dmg);
    this.shake = 30 + dmg * 10; this.flash = 0.9;
    const hx = 760, hy = 740;
    for (let i = 0; i < 14 + dmg * 8; i++) { const a = rand(-1.2, 0.6), sp = rand(500, 1400); this.parts.push({ kind: 'spark', x: hx, y: hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.7), t: 0, c: pick(['#ffffff', '#fff3b0', '#ffd23f']) }); }
    for (let i = 0; i < 2 + dmg; i++) this.parts.push({ kind: 'tooth', x: hx + 40, y: hy + 40, vx: rand(200, 700), vy: rand(-700, -300), g: 2200, life: 1.4, t: 0, spin: rand(-12, 12) });
    for (let i = 0; i < 6; i++) this.parts.push({ kind: 'sweat', x: hx + rand(-60, 60), y: hy - 80, vx: rand(-300, 400), vy: rand(-600, -200), g: 1800, life: 1.0, t: 0 });
  },
  markPos(tArrive, now = this.t) {
    // bezier from top-right into the raised fist
    const u = clamp(1 - (tArrive - now) / 1.0, 0, 1.15);
    const [fx, fy] = this.fist();
    const p0 = [1120, 120], p1 = [700, -40], p2 = [fx, fy];
    const v = Math.min(u, 1);
    const x = (1 - v) * (1 - v) * p0[0] + 2 * (1 - v) * v * p1[0] + v * v * p2[0];
    const y = (1 - v) * (1 - v) * p0[1] + 2 * (1 - v) * v * p1[1] + v * v * p2[1];
    return [x, y, u];
  },

  // ── drawing ──
  draw() {
    const ctx = Screen.ctx;
    if (!this.cache || this.cache.pw !== Screen.pw || this.cache.ph !== Screen.ph) { this.layout(); this.buildCache(); }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#120306'; ctx.fillRect(0, 0, Screen.pw, Screen.ph);
    const sh = this.shake;
    const jx = sh ? rand(-sh, sh) * this.s : 0, jy = sh ? rand(-sh, sh) * this.s : 0;
    const intro = Math.min(1, this.t / 0.35);
    const zoom = 1 + (1 - Ease.outBack(intro)) * 0.25;
    ctx.translate(Screen.pw / 2 + jx, Screen.ph / 2 + jy);
    ctx.scale(zoom, zoom);
    ctx.translate(-Screen.pw / 2, -Screen.ph / 2);
    ctx.drawImage(this.cache.bg, 0, 0);
    ctx.setTransform(this.s * zoom, 0, 0, this.s * zoom, Screen.pw / 2 + jx - (Screen.pw / 2 - this.ox) * zoom, Screen.ph / 2 + jy - (Screen.ph / 2 - this.oy) * zoom);
    const t = this.t;

    // punch kinematics
    let lunge = 0, punchF = 0;
    if (this.punchT && t >= this.punchT) { punchF = clamp((t - this.punchT) / 0.2, 0, 1); lunge = Ease.outCubic(punchF) * 150; }
    if (this.impactT) lunge = 150 - Ease.outCubic(clamp((t - this.impactT - 0.4) / 0.6, 0, 1)) * 60;
    const whiff = this.impactT && this.charge === 0;
    // killer recoil
    let rec = 0;
    if (this.impactT && !whiff) rec = Math.exp(-(t - this.impactT) * 3) * (this.ko ? 1.3 : 1);
    const duck = whiff ? Math.min(1, (t - this.impactT) * 6) : (this.punchT && this.charge === 0 && t > this.punchT ? clamp((t - this.punchT) / 0.15, 0, 1) : 0);
    const tremble = Math.sin(t * 40) * 3;
    ctx.save();
    ctx.translate(rec * 90 + (this.ko && this.impactT ? Math.min(1, (t - this.impactT) / 1.2) * 40 : 0), rec * 30 + duck * 90);
    ctx.drawImage(this.cache.killerBody, 0, 0, this.W, this.H);
    drawComicKillerHead(ctx, this.kind, this.stage, { t, react: rec, ko: this.ko && this.impactT && t > this.impactT + 0.15, tremble, duck });
    ctx.restore();

    // hero
    ctx.save();
    ctx.translate(lunge, Math.sin(t * 2) * 4);
    ctx.drawImage(this.cache.heroBody, 0, 0, this.W, this.H);
    drawComicHeroHead(ctx, t, this.charge);
    // grabbing hand on the collar (drawn over the killer)
    drawGrabHand(ctx, rec * 70 - lunge * 0.4, rec * 25 + duck * 60);
    // raised / punching arm
    const S = [175, 820];
    let target, elbowUp = true;
    if (this.punchT && t >= this.punchT) {
      const k = Ease.inCubic(punchF);
      const [fx, fy] = this.fist();
      const tx = whiff ? 780 : 735, ty = whiff ? 580 : 680;
      target = [lerp(fx, tx - lunge, k), lerp(fy, ty, k)];
      elbowUp = true; // overhead smash: the arm arcs above the head, never across the face
      if (this.impactT) target = [tx - lunge + (whiff ? 40 : 0), ty];
    } else target = this.fist();
    drawHeroArm(ctx, S, target, elbowUp, this.charge, t);
    ctx.restore();

    // target ring + lightning marks
    if (!this.punchT) {
      const [fx, fy] = this.fist();
      const pulse = 1 + Math.sin(t * 8) * 0.05;
      ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,243,176,0.85)';
      ctx.beginPath(); ctx.arc(fx, fy, 128 * pulse, 0, TAU); ctx.stroke();
      ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.beginPath(); ctx.arc(fx, fy, 140 * pulse, 0, TAU); ctx.stroke();
      for (const m of this.marks) {
        if (m.state === 'hit') continue;
        if (t < m.t0) continue;
        const [x, y, u] = this.markPos(m.arrive);
        if (m.state === 'miss') continue;
        drawBoltMark(ctx, x, y, 1 + (1 - Math.min(u, 1)) * 0.3, t, u);
      }
    }

    // particles
    for (const p of this.parts) drawComicPart(ctx, p);
    // impact burst
    if (this.impactT && !whiff) {
      const f = (t - this.impactT);
      if (f < 0.5) drawImpactStar(ctx, 700, 700, 1 + this.charge * 0.35, f);
    }
    // killer hearts
    drawComicHearts(ctx, this);
    ctx.restore();

    // impact frame flash + panel frame
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (this.flash > 0) { ctx.fillStyle = `rgba(255,252,240,${Math.min(1, this.flash)})`; ctx.fillRect(0, 0, Screen.pw, Screen.ph); }
    const b = Math.max(6, Screen.pw * 0.018);
    ctx.strokeStyle = INK; ctx.lineWidth = b * 2; ctx.strokeRect(0, 0, Screen.pw, Screen.ph);
    ctx.strokeStyle = '#f4efe6'; ctx.lineWidth = b * 0.4; ctx.strokeRect(b * 1.3, b * 1.3, Screen.pw - b * 2.6, Screen.ph - b * 2.6);
    if (t < 0.9) { // tap hint: a pulsing finger, no words
      const a = (1 - t / 0.9);
      drawTapHint(ctx, Screen.pw * 0.5, Screen.ph * 0.88, Screen.pw * 0.07, a, t);
    }
    if (this.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${this.fade})`; ctx.fillRect(0, 0, Screen.pw, Screen.ph); }
    ctx.restore();
  },

  buildCache() {
    const pw = Screen.pw, ph = Screen.ph;
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    // background in device space
    const bg = mk(pw, ph), g = bg.getContext('2d');
    g.setTransform(this.s, 0, 0, this.s, this.ox, this.oy);
    drawComicBackground(g, this.W, this.H, (this.oy / this.s), (Screen.ph / this.s));
    // character layers in design space (scaled ×s, drawn back with the main transform)
    const res = Math.min(1, this.s * 1.15);
    const hero = mk(Math.ceil(this.W * res), Math.ceil(this.H * res)), hg = hero.getContext('2d');
    hg.scale(res, res); drawComicHeroBody(hg);
    const kb = mk(Math.ceil(this.W * res), Math.ceil(this.H * res)), kg = kb.getContext('2d');
    kg.scale(res, res); drawComicKillerBody(kg, this.kind, this.stage);
    this.cache = { pw, ph, bg, heroBody: hero, killerBody: kb };
  },
};

// ═════════════ comic drawing helpers (design space) ═════════════
function ink(g, build, fill, lw = 9) {
  g.beginPath(); build(g);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (lw) { g.lineWidth = lw; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
}
function hatch(g, build, ang, gap, lw, box, col = 'rgba(10,6,8,0.55)') {
  g.save(); g.beginPath(); build(g); g.clip();
  g.strokeStyle = col; g.lineWidth = lw; g.beginPath();

function ik2(S, T, a, b, up) {
  const dx = T[0] - S[0], dy = T[1] - S[1];
  const d = clamp(Math.hypot(dx, dy), 1, a + b - 1);
  const base = Math.atan2(dy, dx);
  const k = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const ang = base + (up ? -k : k);
  const E = [S[0] + Math.cos(ang) * a, S[1] + Math.sin(ang) * a];
  const tx = S[0] + Math.cos(base) * d, ty = S[1] + Math.sin(base) * d;
  return { E, W: [tx, ty] };
}

  const mx = (A[0] + B[0]) / 2 + nx * bulge, my = (A[1] + B[1]) / 2 + ny * bulge;

  }
  ink(g, (q) => {
    q.moveTo(A[0] + nx * wa / 2, A[1] + ny * wa / 2);
    q.quadraticCurveTo(mx + nx * (wa + wb) / 3, my + ny * (wa + wb) / 3, B[0] + nx * wb / 2, B[1] + ny * wb / 2);
    q.lineTo(B[0] - nx * wb / 2, B[1] - ny * wb / 2);
    q.quadraticCurveTo(mx - nx * (wa + wb) / 4, my - ny * (wa + wb) / 4, A[0] - nx * wa / 2, A[1] - ny * wa / 2);
    q.closePath();
  }, fill, 9);
}

function newGame(kindOverride) {

function updateWorld(dt) {

  dec('dupT'); dec('exposeT'); dec('blackoutT'); dec('eyeT'); dec('sirenT'); dec('toiletCd'); dec('whiteFlash', 1.6); dec('redFlash', 1.4);

    if (K.alive && !K.trav && dist(P.x, P.y, K.x, K.y) < 0.95) { startPhase('closeup'); return; }

function bloodWord(g, word, x, y, size, t, seed) {
  g.save();
  g.font = `900 ${size}px ${FONT_DISPLAY}`;
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const w = g.measureText(word).width;
  const sx = Math.min(1.25, (Screen.pw * 0.9) / w);
  g.translate(x, y); g.scale(sx, 1);
  // drips
  const n = 9;
  for (let i = 0; i < n; i++) {
    const hx = (hash2(i, seed) - 0.5) * w * 0.9;
    const sp = 0.25 + hash2(i, seed + 9) * 0.6;
    const maxL = size * (0.3 + hash2(i, seed + 3) * 0.9);
    const len = (((t * sp * size * 0.25) + hash2(i, seed + 5) * maxL) % (maxL * 1.6));
    const L2 = Math.min(len, maxL);
    const wd = size * (0.035 + hash2(i, seed + 7) * 0.03);
    g.fillStyle = '#9a0f1b';
    g.fillRect(hx - wd / 2, -size * 0.06, wd, L2);
    g.beginPath(); g.arc(hx, L2 - size * 0.06, wd * 0.85, 0, TAU); g.fill();
    if (len > maxL) { g.beginPath(); g.arc(hx, L2 + (len - maxL) * 1.8, wd * 0.6, 0, TAU); g.fill(); }
  }
  g.lineJoin = 'round';
  g.lineWidth = size * 0.09; g.strokeStyle = '#0a0608'; g.strokeText(word, 0, 0);
  const gr = g.createLinearGradient(0, -size * 0.8, 0, 0);
  gr.addColorStop(0, '#fbf6ee'); gr.addColorStop(0.6, '#d9d0c4'); gr.addColorStop(1, '#a8382f');
  g.fillStyle = gr; g.fillText(word, 0, 0);
  g.restore();
}

function drawIntroHi() {

}
function spacedText(g, str, x, y, sp) {
  const chars = [...str];
  const widths = chars.map((c) => g.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
  let cx = x - total / 2;
  const al = g.textAlign; g.textAlign = 'left';
  chars.forEach((c, i) => { g.fillText(c, cx, y); cx += widths[i] + sp; });
  g.textAlign = al;
}
