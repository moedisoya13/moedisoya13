<style>
  /* Single dark look on purpose: a horror game screen, no light theme */
  :root { --bg: #07060a; --fg: #efe8dc; --blood: #d4192a; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
  #cv { display: block; width: 100%; height: 100%; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center; text-align: center;
    background: var(--bg); color: var(--fg); padding-inline: 16px; font: 600 16px/1.5 "Apple SD Gothic Neo", system-ui, sans-serif; }
  #rotate b { color: var(--blood); }
  @media (orientation: landscape) and (max-height: 520px) { #rotate { display: flex; } }
</style>
