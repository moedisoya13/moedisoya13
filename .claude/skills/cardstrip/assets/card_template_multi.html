<!doctype html>
<meta charset="utf-8">
<title>__PLATFORM_NAME__ packages strip</title>
<style>
  @font-face { font-family: "Source Sans 3"; font-weight: 400; src: url(__FONT_SS_REG__) format("woff2"); }
  @font-face { font-family: "Source Sans 3"; font-weight: 600; src: url(__FONT_SS_SEMI__) format("woff2"); }
  @font-face { font-family: "Source Sans 3"; font-weight: 700; src: url(__FONT_SS_BOLD__) format("woff2"); }
  @font-face { font-family: "Source Code Pro"; font-weight: 400; src: url(__FONT_SCP_REG__) format("woff2"); }
  @font-face { font-family: "Source Code Pro"; font-weight: 500; src: url(__FONT_SCP_MED__) format("woff2"); }

  :root {
    /* Same palette contract as card_template.html — filled from the same
       references/palette-<platform>.json entry. This is a second template
       (not a mode flag on the first) because the DOM shape genuinely
       differs: N tiles in a row instead of one name/summary/install stack. */
    --gradient-light: __COLOR_GRADIENT_LIGHT__;
    --base:            __COLOR_BASE__;
    --gradient-dark:   __COLOR_GRADIENT_DARK__;
    --chip:            __COLOR_CHIP__;
    --text:            __COLOR_TEXT__;
    --rule:            __COLOR_RULE__;
    --accent:          __COLOR_ACCENT__;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }

  /* Width is computed by generate.py from the tile count (see MIN_TILE_W /
     GAP there) and injected here; height is intrinsic, same as the single
     card template — no fixed box, no dead space. */
  .card {
    position: relative;
    width: __CARD_W__px;
    overflow: hidden;
    background:
      radial-gradient(120% 160% at 8% 0%, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(145deg, var(--gradient-light) 0%, var(--base) 46%, var(--gradient-dark) 100%);
    font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .card::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 12px;
    background: var(--accent);
    z-index: 2;
  }
  .card::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: rgba(255,255,255,.14);
  }
  .watermark {
    position: absolute; right: 40px; bottom: 18px;
    width: 260px; height: 247px; opacity: .085;
    background: url(__WATERMARK__) no-repeat center / contain;
  }

  .inner {
    padding: 42px 56px 44px 74px;
  }

  /* ---------- platform row (identical to the single-card template) ---------- */
  .platform { display: flex; align-items: center; gap: 16px; height: 52px; }
  .platform img { height: 50px; width: auto; display: block;
                  filter: drop-shadow(0 2px 6px rgba(0,0,0,.28)); }
  .platform .wordmark {
    font-size: 32px; font-weight: 700; letter-spacing: .005em; line-height: 1;
  }
  .platform .index {
    font-size: 14px; font-weight: 600; letter-spacing: .21em;
    text-transform: uppercase; opacity: .72; line-height: 1; padding-top: 4px;
  }
  .platform .divider { width: 1px; height: 34px; background: var(--rule); opacity: .55; }

  .chip-meta {
    margin-left: auto; align-self: center;
    font-family: "Source Code Pro", monospace; font-weight: 500;
    font-size: 21px; line-height: 1;
    padding: 9px 14px 8px;
    border: 1px solid var(--rule); border-radius: 4px;
    background: rgba(0,0,0,.14);
    white-space: nowrap;
  }

  /* ---------- package tiles ---------- */
  .tiles { margin-top: 32px; display: flex; align-items: stretch; gap: 40px; }
  .tile { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tile + .tile { border-left: 1px solid var(--rule); padding-left: 40px; }

  .tile-name {
    font-size: 42px; font-weight: 700; letter-spacing: -.015em; line-height: 1.05;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .tile-summary {
    margin-top: 10px;
    font-size: 19px; font-weight: 400; line-height: 1.3;
    opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile-install {
    margin-top: auto; padding-top: 18px;
  }
  .tile-install .cmd {
    display: block;
    font-family: "Source Code Pro", monospace; font-weight: 500;
    font-size: 18px; line-height: 1.1;
    padding: 11px 14px;
    background: var(--chip);
    border: 1px dotted var(--rule);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>

<div class="card">
  <div class="watermark"></div>
  <div class="inner">

    <div class="platform">
      <img src="__LOGO__" alt="">
      <span class="wordmark">__PLATFORM_NAME__</span>
      <span class="divider"></span>
      <span class="index">__META_LABEL__</span>
      <span class="chip-meta">__CHIP_TEXT__</span>
    </div>

    <div class="tiles">
__TILES__
    </div>

  </div>
</div>

<script>
  /* Shrink-to-fit for each tile name independently, same pattern as the
     single-card template — CSS ellipsis is still the safety net beyond
     the font floor. */
  function fit(el, max, min) {
    const room = el.parentElement.clientWidth || el.clientWidth;
    let size = max;
    el.style.fontSize = size + "px";
    while (el.scrollWidth > room && size > min) {
      size -= 1;
      el.style.fontSize = size + "px";
    }
  }
  document.fonts.ready.then(() => {
    document.querySelectorAll(".tile-name").forEach((el) => fit(el, 42, 22));
    document.documentElement.dataset.ready = "1";
  });
</script>
