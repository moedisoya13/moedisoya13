<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1f2328; --muted:#5b636e; --rule:#e3e3dd;
    --accent:#7a5c00; --card:#f2f1ea; --link:#0b57d0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e6e6e3; --muted:#9aa0a8; --rule:#2c2f36;
      --accent:#e8c766; --card:#20242b; --link:#8ab4f8;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:1.02rem/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .wrap{max-width:44rem; margin:0 auto; padding:2.4rem 1.15rem 4rem}
  header{border-bottom:2px solid var(--rule); padding-bottom:1.2rem; margin-bottom:1.8rem}
  h1{font-size:1.7rem; line-height:1.35; margin:0 0 .5rem}
  .meta{font-size:.86rem; color:var(--muted); margin:0}
  .meta a{color:var(--link)}
  .lead{font-size:1.08rem; color:var(--fg); margin:1.4rem 0 0; font-weight:500}
  h2{font-size:1.28rem; margin:2.4rem 0 .7rem; padding-top:.4rem; border-top:1px solid var(--rule)}
  h3{font-size:1.06rem; margin:1.6rem 0 .5rem}
  p{margin:.75rem 0}
  ul,ol{margin:.7rem 0; padding-left:1.4rem}
  li{margin:.32rem 0}
  strong{font-weight:650}
  blockquote{
    margin:1.1rem 0; padding:.2rem 0 .2rem 1rem;
    border-left:3px solid var(--accent); color:var(--muted); font-style:italic;
  }
  .callout{
    background:var(--card); border:1px solid var(--rule); border-radius:.55rem;
    padding:.85rem 1rem; margin:1.2rem 0;
  }
  .callout .k{display:block; font-size:.78rem; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin-bottom:.25rem}
  .takeaways{background:var(--card); border-radius:.6rem; padding:1rem 1.15rem; margin:2rem 0 0}
  .takeaways h2{border:0; margin:0 0 .5rem; padding:0}
  footer{margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule); font-size:.82rem; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{META}}</p>
    <p class="lead">{{SUMMARY}}</p>
  </header>

  <main>
{{BODY}}
  </main>

  <div class="takeaways">
    <h2>핵심 정리</h2>
{{TAKEAWAYS}}
  </div>

  <footer>{{FOOTER}}</footer>
</div>
</body>
</html>
