<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="video-article-source" content="{{SOURCE}}">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1f2328; --muted:#5b636e; --rule:#e3e3dd;
    --accent:#7a5c00; --card:#f2f1ea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e6e6e3; --muted:#9aa0a8; --rule:#2c2f36;
      --accent:#e8c766; --card:#20242b;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:1.02rem/1.78 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .wrap{max-width:44rem; margin:0 auto; padding:2.4rem 1.15rem 4rem}
  header{border-bottom:2px solid var(--rule); padding-bottom:1.1rem; margin-bottom:1.6rem}
  h1{font-size:1.7rem; line-height:1.35; margin:0 0 .5rem}
  .meta{font-size:.86rem; color:var(--muted); margin:0}
  h2{font-size:1.25rem; margin:2.3rem 0 .7rem; padding-top:.4rem; border-top:1px solid var(--rule)}
  h3{font-size:1.06rem; margin:1.6rem 0 .5rem}
  .ts{font:500 .78rem/1 ui-monospace,Consolas,monospace; color:var(--accent); margin-left:.5rem; vertical-align:middle}
  p{margin:.8rem 0}
  ul,ol{margin:.7rem 0; padding-left:1.4rem}
  li{margin:.32rem 0}
  code{font-family:ui-monospace,Consolas,monospace; font-size:.9em; background:var(--card); padding:.05rem .3rem; border-radius:.25rem}
  blockquote{margin:1.1rem 0; padding:.2rem 0 .2rem 1rem; border-left:3px solid var(--accent); color:var(--muted)}
  .note{background:var(--card); border:1px solid var(--rule); border-radius:.55rem; padding:.85rem 1rem; margin:1.2rem 0; color:var(--muted); font-size:.94rem}
  footer{margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule); font-size:.82rem; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{META}}</p>
  </header>

  <main>
{{BODY}}
  </main>

  <footer>영상 음성을 Whisper로 전사한 뒤 한국어로 옮긴 글입니다. 고유명사·수치는 원본 영상과 대조해 확인하세요. · 생성 {{DATE}}</footer>
</div>
</body>
</html>
