<title>BB 필드 테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: dark;
  --bg: #13131c;          /* the level's own background (graybox.BACKGROUND) */
  --panel: #1c1c27;
  --line: #2c2c3a;
  --text: #ecebe8;
  --muted: #a7a5ad;
  --accent: #dc9a5c;      /* the mannequin's clay colour */
  --accent-ink: #1a1208;
  --focus: #ffd08a;
  --pad: rgba(236, 235, 232, 0.10);
  --pad-edge: rgba(236, 235, 232, 0.28);
  --knob: rgba(236, 235, 232, 0.55);
  --btn: rgba(28, 28, 39, 0.78);
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
body { font: 14px/1.4 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
.app {
  height: 100%; display: flex; flex-direction: column; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
}
.bar { flex: none; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 14px; row-gap: 2px; min-width: 0; }
.bar h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
.bar p { margin: 0; color: var(--muted); font-size: 13px; min-width: 0; }
.bar .help { color: var(--text); flex-basis: 100%; }
kbd { font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 5px; border: 1px solid var(--line);
      border-bottom-width: 2px; border-radius: 4px; background: var(--panel); color: var(--text); }
.touch-only { display: none; }
@media (pointer: coarse) { .touch-only { display: inline; } .keys-only { display: none; } }
.stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden;
         border-radius: 8px; background: var(--bg); touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#view { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; border-radius: 2px; }
canvas#view:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus); }
.hud { position: absolute; left: 8px; top: 6px; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
       color: var(--text); background: rgba(19, 19, 28, 0.72); padding: 3px 6px; border-radius: 4px; pointer-events: none; }
.status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; }
.status[hidden] { display: none; }
.pad { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
       background: var(--pad); border: 2px solid var(--pad-edge); pointer-events: none; display: none; }
.pad .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
             background: var(--knob); }
.pad.on { display: block; }
.pad-hint { position: absolute; left: 14px; bottom: 14px; width: 104px; height: 104px; border-radius: 50%;
            border: 2px dashed var(--pad-edge); color: var(--muted); font-size: 12px; display: none; place-items: center;
            text-align: center; pointer-events: none; }
@media (pointer: coarse) { .pad-hint { display: grid; } .stage.sticking .pad-hint { display: none; } }
.acts { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: flex-end; }
.acts button {
  width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); background: var(--btn); color: var(--text);
  font: 700 15px/1 system-ui, sans-serif; touch-action: none; cursor: pointer; display: grid; place-items: center; gap: 2px;
  transition: transform 80ms ease-out, background-color 80ms ease-out;
}
.acts button small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
.acts button:nth-child(2) { transform: translateY(-22px); }
.acts button.down, .acts button:active { background: var(--accent); color: var(--accent-ink); }
.acts button.down small, .acts button:active small { color: var(--accent-ink); }
.acts button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (pointer: fine) { .acts button { width: 54px; height: 54px; font-size: 13px; } .acts button:nth-child(2) { transform: none; } }
@media (pointer: coarse) { .acts button { width: 76px; height: 76px; font-size: 17px; } .acts button small { display: none; } }
@media (prefers-reduced-motion: reduce) { .acts button { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <h1>BB 필드 테스트</h1>
    <p>기본 몸(BB)을 그레이박스 테스트 맵에 세운 것 · 45° 카메라 · 모션은 복싱 카탈로그에서 가져옴</p>
    <p class="help">
      <span class="keys-only">이동 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 방향키 · <kbd>J</kbd> 원투 · <kbd>K</kbd> 스텝 인·아웃</span>
      <span class="touch-only">왼쪽을 누른 채 끌면 이동 · 오른쪽 버튼: 원투, 스텝</span>
    </p>
  </header>
  <main class="stage" id="stage">
    <canvas id="view" tabindex="0" aria-label="게임 화면: 그레이박스 맵 위의 BB. 방향키로 걷고 J, K로 동작"></canvas>
    <div class="hud" id="hud" aria-hidden="true"></div>
    <div class="status" id="status" role="status">불러오는 중…</div>
    <div class="pad-hint" aria-hidden="true">끌어서<br>이동</div>
    <div class="pad" id="pad" aria-hidden="true"><div class="knob" id="knob"></div></div>
    <div class="acts">
      <button type="button" id="bJ" aria-label="원투 (J)">원투<small>J</small></button>
      <button type="button" id="bK" aria-label="스텝 인·아웃 (K)">스텝<small>K</small></button>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), canvas = $("view"), hud = $("hud"), statusEl = $("status");
  const ctx = canvas.getContext("2d", { alpha: false });

  // ------------------------------------------------------------------ assets
  const loadImage = (src) => new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => fail(new Error(src + " 을(를) 불러오지 못했습니다"));
    im.src = src;
  });
  function pixels(im) {
    const c = document.createElement("canvas");
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(im, 0, 0);
    return x.getImageData(0, 0, c.width, c.height);
  }

  let M, L, T, SP;           // manifest, level, terrain, sprites
  async function load() {
    M = await (await fetch("assets/manifest.json")).json();
    const lv = M.level, sp = M.sprites, tr = lv.terrain;
    const [ci, di, ti, si, sdi] = await Promise.all(
      [lv.color, lv.depth, tr.file, sp.color, sp.data].map((f) => loadImage("assets/" + f)));
    const col = pixels(ci), dep = pixels(di), ter = pixels(ti);
    const W = col.width, H = col.height;
    // level: colour as packed 32-bit pixels, depth as floats (Infinity = nothing), sunlit flag
    const depth = new Float32Array(W * H), lit = new Uint8Array(W * H);
    const k = (lv.depth_hi - lv.depth_lo) / (lv.depth_empty - 1);
    for (let i = 0; i < W * H; i++) {
      const q = dep.data[4 * i] * 256 + dep.data[4 * i + 1];
      depth[i] = q >= lv.depth_empty ? Infinity : lv.depth_lo + q * k;
      lit[i] = dep.data[4 * i + 2] >= 128 ? 1 : 0;
    }
    L = { W, H, rgba: new Uint32Array(col.data.buffer.slice(0)), depth, lit,
          bg: packRGB(lv.background.map((v) => Math.round(v * 255))), ratio: lv.shadow_ratio, rowDepth: lv.flat_depth_per_row };
    const nx = tr.size[0], nz = tr.size[1];
    const height = new Float32Array(nx * nz), walk = new Uint8Array(nx * nz);
    for (let i = 0; i < nx * nz; i++) {
      height[i] = (ter.data[4 * i] * 256 + ter.data[4 * i + 1] - tr.height_zero) / tr.height_scale;
      walk[i] = ter.data[4 * i + 2] >= 128 ? 1 : 0;
    }
    T = { nx, nz, cell: tr.cell, ox: tr.origin[0], oz: tr.origin[1], height, walk };
    const sc = pixels(si), sd = pixels(sdi);
    SP = { W: sc.width, rgba: sc.data, data: sd.data, frames: sp.frames, anims: sp.anims, scale: sp.depth_scale, zero: sp.depth_zero };
  }
  const LITTLE = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
  function packRGB([r, g, b]) { return LITTLE ? ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0 : ((r << 24) | (g << 16) | (b << 8) | 255) >>> 0; }

  // ------------------------------------------------------------------ terrain
  function cellIndex(x, z) {
    const i = Math.floor((x - T.ox) / T.cell), j = Math.floor((z - T.oz) / T.cell);
    return (i < 0 || j < 0 || i >= T.nx || j >= T.nz) ? -1 : j * T.nx + i;
  }
  const walkable = (x, z) => { const c = cellIndex(x, z); return c >= 0 && T.walk[c] === 1; };
  function heightAt(x, z) {          // bilinear between cell centres
    const fx = (x - T.ox) / T.cell - 0.5, fz = (z - T.oz) / T.cell - 0.5;
    const i0 = Math.max(0, Math.min(T.nx - 2, Math.floor(fx))), j0 = Math.max(0, Math.min(T.nz - 2, Math.floor(fz)));
    const tx = Math.max(0, Math.min(1, fx - i0)), tz = Math.max(0, Math.min(1, fz - j0));
    const h = T.height, n = T.nx, a = j0 * n + i0;
    return (h[a] * (1 - tx) + h[a + 1] * tx) * (1 - tz) + (h[a + n] * (1 - tx) + h[a + n + 1] * tx) * tz;
  }
  function tryMove(dx, dz) {          // slide along walls: the whole step, else one axis
    const p = S;
    if (walkable(p.x + dx, p.z + dz)) { p.x += dx; p.z += dz; return Math.hypot(dx, dz); }
    if (Math.abs(dx) > 1e-6 && walkable(p.x + dx, p.z)) { p.x += dx; return Math.abs(dx); }
    if (Math.abs(dz) > 1e-6 && walkable(p.x, p.z + dz)) { p.z += dz; return Math.abs(dz); }
    return 0;
  }

  // ------------------------------------------------------------------ the player
  const S = { x: 0, z: 0, facing: 0, anim: "idle", t: 0, phase: 0, k: 0 };
  const FACING_DEG = (i) => i * 45;
  function startAction(name) {
    if (!SP || !SP.anims[name] || S.anim === "onetwo" || S.anim === "inout") return;
    S.anim = name; S.t = 0; S.k = 0;
  }
  function currentFrame() {
    const a = SP.anims;
    if (S.anim === "walk") {
      const w = a.walk, n = w.frames[S.facing].length;
      return w.frames[S.facing][((Math.floor(S.phase * w.frames_per_cycle) % n) + n) % n];
    }
    if (S.anim === "onetwo" || S.anim === "inout") return a[S.anim].frames[S.facing][S.k];
    const idle = a.idle, src = a[idle.of].frames[S.facing], n = idle.count;
    const step = Math.floor(S.t * idle.fps) % (2 * n - 2);
    return src[idle.first + (step < n ? step : 2 * n - 2 - step)];
  }

  // ------------------------------------------------------------------ input
  const keys = new Set();
  const KEYMAP = { KeyW: "u", ArrowUp: "u", KeyS: "d", ArrowDown: "d", KeyA: "l", ArrowLeft: "l", KeyD: "r", ArrowRight: "r" };
  window.addEventListener("keydown", (e) => {
    if (e.target && e.target.tagName === "BUTTON" && (e.code === "Enter" || e.code === "Space")) return;
    if (KEYMAP[e.code]) { keys.add(KEYMAP[e.code]); e.preventDefault(); }
    else if (e.code === "KeyJ" && !e.repeat) { startAction("onetwo"); flash("bJ"); }
    else if (e.code === "KeyK" && !e.repeat) { startAction("inout"); flash("bK"); }
  });
  window.addEventListener("keyup", (e) => { if (KEYMAP[e.code]) keys.delete(KEYMAP[e.code]); });
  window.addEventListener("blur", () => { keys.clear(); stick.active = false; showPad(false); });
  function flash(id) { const b = $(id); b.classList.add("down"); setTimeout(() => b.classList.remove("down"), 140); }
  for (const [id, name] of [["bJ", "onetwo"], ["bK", "inout"]]) {
    const b = $(id);
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); startAction(name); flash(id); });
    b.addEventListener("click", (e) => { if (e.detail === 0) { startAction(name); flash(id); } });  // keyboard (Enter / Space)
  }
  // virtual stick: press anywhere on the left part of the game area and drag
  const stick = { active: false, id: -1, cx: 0, cy: 0, dx: 0, dy: 0 };
  const pad = $("pad"), knob = $("knob"), R = 52;
  function showPad(on) { pad.classList.toggle("on", on); stage.classList.toggle("sticking", on); }
  stage.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" || stick.active) return;
    const r = stage.getBoundingClientRect();
    if (e.clientX - r.left > r.width * 0.6) return;
    stick.active = true; stick.id = e.pointerId; stick.cx = e.clientX - r.left; stick.cy = e.clientY - r.top; stick.dx = stick.dy = 0;
    pad.style.left = stick.cx + "px"; pad.style.top = stick.cy + "px"; knob.style.transform = ""; showPad(true);
    try { stage.setPointerCapture(e.pointerId); } catch (_) { /* (synthetic events have nothing to capture) */ }
    e.preventDefault();
  });
  stage.addEventListener("pointermove", (e) => {
    if (!stick.active || e.pointerId !== stick.id) return;
    const r = stage.getBoundingClientRect();
    let dx = e.clientX - r.left - stick.cx, dy = e.clientY - r.top - stick.cy;
    const m = Math.hypot(dx, dy);
    if (m > R) { dx *= R / m; dy *= R / m; }
    stick.dx = dx / R; stick.dy = dy / R;
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
  });
  const endStick = (e) => { if (e.pointerId === stick.id) { stick.active = false; stick.dx = stick.dy = 0; showPad(false); } };
  stage.addEventListener("pointerup", endStick);
  stage.addEventListener("pointercancel", endStick);
  function inputVector() {          // screen-relative: x = right, y = down (= world +x, +z: the camera looks north)
    let x = 0, y = 0;
    if (keys.has("l")) x -= 1; if (keys.has("r")) x += 1; if (keys.has("u")) y -= 1; if (keys.has("d")) y += 1;
    if (x || y) { const m = Math.hypot(x, y); return [x / m, y / m, 1]; }
    if (stick.active) { const m = Math.hypot(stick.dx, stick.dy); if (m > 0.25) return [stick.dx / m, stick.dy / m, Math.min(1, m)]; }
    return [0, 0, 0];
  }

  // ------------------------------------------------------------------ update
  function update(dt) {
    const a = SP.anims;
    if (S.anim === "onetwo" || S.anim === "inout") {
      const an = a[S.anim], n = an.frames[S.facing].length;
      S.t += dt;
      const k = Math.min(n - 1, Math.floor(S.t * an.fps));
      if (k !== S.k) {                // root motion of the frames passed, turned to the facing
        const f = FACING_DEG(S.facing) * Math.PI / 180, c = Math.cos(f), s = Math.sin(f);
        const fw = an.root[k][0] - an.root[S.k][0], sd = an.root[k][1] - an.root[S.k][1];
        tryMove(fw * c + sd * s, fw * s - sd * c);
        S.k = k;
      }
      if (S.t * an.fps >= n) { S.anim = "idle"; S.t = 0; }
      return;
    }
    const [ix, iy, mag] = inputVector();
    if (mag > 0) {
      const ang = Math.atan2(iy, ix) * 180 / Math.PI;
      S.facing = ((Math.round(ang / 45) % 8) + 8) % 8;
      const step = M.walk_speed * mag * dt;
      const moved = tryMove(ix * step, iy * step);
      if (S.anim !== "walk") { S.anim = "walk"; S.phase = 0.07; }
      S.phase += moved / a.walk.stride_m;   // the cycle advances with the ground covered: no foot sliding
      if (moved < 1e-5) S.phase = Math.round(S.phase * 2) / 2 + 0.07;  // blocked: a planted pose, not a treadmill
    } else if (S.anim === "walk") { S.anim = "idle"; S.t = 0; }
    else S.t += dt;
  }

  // ------------------------------------------------------------------ drawing
  let view = { w: 200, h: 120, scale: 2 }, buf = null, buf32 = null;
  const cam = { x: 0, y: 0, lagX: 0, lagY: 0, showX: 0, showY: 0, ax: null, ay: null };
  function layout() {
    const dpr = window.devicePixelRatio || 1, r = stage.getBoundingClientRect();
    const sCss = Math.max(2, Math.floor(Math.min(r.width / 200, r.height / 118)));
    const sDev = Math.max(2, Math.round(sCss * dpr));          // whole device pixels per art pixel
    const w = Math.max(32, Math.floor(r.width * dpr / sDev)), h = Math.max(32, Math.floor(r.height * dpr / sDev));
    view = { w, h, scale: sDev / dpr };
    canvas.width = w; canvas.height = h;
    canvas.style.width = (w * sDev / dpr) + "px"; canvas.style.height = (h * sDev / dpr) + "px";
    buf = ctx.createImageData(w, h); buf32 = new Uint32Array(buf.data.buffer);
  }
  const W2S = () => M.camera.world_to_screen;
  function project(x, z) {
    const U = M.camera.units_per_m, X = x * U, Y = M.camera.ground_y + heightAt(x, z) * U, Z = z * U, m = W2S();
    return [m[0][0] * X + m[0][1] * Y + m[0][2] * Z + m[0][3], m[1][0] * X + m[1][1] * Y + m[1][2] * Z + m[1][3],
            m[2][0] * X + m[2][1] * Y + m[2][2] * Z + m[2][3]];
  }
  function follow(px, py, dt) {
    // The camera trails the player by a smooth lag (it keeps its place in the world while the player moves,
    // then catches up), measured on the player's EXACT screen position so it is a smooth number, steady at
    // a steady walk.  The camera itself sits a whole number of art pixels from the player's snapped pixel,
    // and that number changes only when the smooth lag has moved 0.75 px away from it (hysteresis): while
    // walking at a steady speed the camera and the figure step by the same pixel in the same frame, so the
    // figure does not shake by a pixel on screen.
    const ax = Math.floor(px), ay = Math.floor(py);
    if (cam.ax !== null) { cam.lagX += cam.ax - px; cam.lagY += cam.ay - py; }
    cam.ax = px; cam.ay = py;
    const k = Math.exp(-dt / 0.22);
    cam.lagX *= k; cam.lagY *= k;
    const lim = 0.3 * Math.min(view.w, view.h);
    cam.lagX = Math.max(-lim, Math.min(lim, cam.lagX)); cam.lagY = Math.max(-lim, Math.min(lim, cam.lagY));
    if (Math.abs(cam.lagX - cam.showX) > 0.75) cam.showX = Math.round(cam.lagX);
    if (Math.abs(cam.lagY - cam.showY) > 0.75) cam.showY = Math.round(cam.lagY);
    cam.x = ax - Math.floor(view.w / 2) + cam.showX;
    cam.y = ay - Math.floor(view.h * 0.58) + cam.showY;
  }
  const BIAS = 0.15;                    // world units: a sprite pixel this much behind the level still shows (feet on slopes)
  function draw() {
    const { w, h } = view, x0 = cam.x, y0 = cam.y;
    // level window (world-locked: whole pixels of one image)
    for (let r = 0; r < h; r++) {
      const ly = y0 + r, row = r * w;
      if (ly < 0 || ly >= L.H) { buf32.fill(L.bg, row, row + w); continue; }
      const a = Math.max(0, -x0), b = Math.min(w, L.W - x0);
      if (a > 0) buf32.fill(L.bg, row, row + Math.min(a, w));
      if (b > a) buf32.set(L.rgba.subarray(ly * L.W + x0 + a, ly * L.W + x0 + b), row + a);
      if (b < w) buf32.fill(L.bg, row + Math.max(b, 0), row + w);
    }
    // the figure
    const [px, py, pd] = project(S.x, S.z);
    const ax = Math.floor(px), ay = Math.floor(py);
    const fi = currentFrame(), [fx, fy, fw, fh, ox, oy] = SP.frames[fi];
    const ratio = L.ratio, d8 = buf.data;
    const inShade = (ax >= 0 && ay >= 0 && ax < L.W && ay < L.H) ? !L.lit[ay * L.W + ax] : false;
    // 1) its shadow: flat ground at the figure's height, only where the level is at that depth and lit
    for (let v = 0; v < fh; v++) {
      const sy = ay + oy + v, ry = sy - y0;
      if (ry < 0 || ry >= h || sy < 0 || sy >= L.H) continue;
      const want = pd + (oy + v) * L.rowDepth;
      for (let u = 0; u < fw; u++) {
        const si = 4 * ((fy + v) * SP.W + fx + u);
        if (SP.data[si + 2] < 128) continue;
        const sx = ax + ox + u, rx = sx - x0;
        if (rx < 0 || rx >= w || sx < 0 || sx >= L.W) continue;
        const li = sy * L.W + sx;
        if (!L.lit[li] || Math.abs(L.depth[li] - want) > 0.35) continue;
        const o = 4 * (ry * w + rx);
        d8[o] = d8[o] * ratio[0]; d8[o + 1] = d8[o + 1] * ratio[1]; d8[o + 2] = d8[o + 2] * ratio[2];
      }
    }
    // 2) its pixels, where they are nearer than the level
    const sh = inShade ? ratio : [1, 1, 1];
    for (let v = 0; v < fh; v++) {
      const sy = ay + oy + v, ry = sy - y0;
      if (ry < 0 || ry >= h) continue;
      for (let u = 0; u < fw; u++) {
        const si = 4 * ((fy + v) * SP.W + fx + u);
        if (SP.rgba[si + 3] < 128) continue;
        const sx = ax + ox + u, rx = sx - x0;
        if (rx < 0 || rx >= w) continue;
        const dz = pd + (SP.data[si] * 256 + SP.data[si + 1] - SP.zero) / SP.scale;
        const ld = (sx >= 0 && sy >= 0 && sx < L.W && sy < L.H) ? L.depth[sy * L.W + sx] : Infinity;
        if (dz > ld + BIAS) continue;
        const o = 4 * (ry * w + rx);
        d8[o] = SP.rgba[si] * sh[0]; d8[o + 1] = SP.rgba[si + 1] * sh[1]; d8[o + 2] = SP.rgba[si + 2] * sh[2]; d8[o + 3] = 255;
      }
    }
    ctx.putImageData(buf, 0, 0);
    return [ax, ay];
  }

  // ------------------------------------------------------------------ loop
  let last = 0, hudT = 0;
  function frame(ts) {
    const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0);
    last = ts;
    update(dt);
    const [px, py] = project(S.x, S.z);
    follow(px, py, dt);
    draw();
    hudT -= dt;
    if (hudT <= 0) {
      hudT = 0.2;
      hud.textContent = `x ${S.x.toFixed(1)}  z ${S.z.toFixed(1)}  높이 ${heightAt(S.x, S.z).toFixed(2)} m  ×${+view.scale.toFixed(2)}`;
    }
    requestAnimationFrame(frame);
  }

  async function start() {
    try {
      await load();
    } catch (err) {
      statusEl.textContent = "불러오지 못했습니다: " + err.message;
      return;
    }
    S.x = M.start.at[0]; S.z = M.start.at[1]; S.facing = Math.round(M.start.facing / 45) % 8; S.anim = "idle";
    layout();
    new ResizeObserver(() => { layout(); }).observe(stage);
    statusEl.hidden = true;
    canvas.focus({ preventScroll: true });
    // for automated checks (and curious players): read the state, put the figure somewhere
    window.bbDebug = {
      state: () => ({ ...S, height: heightAt(S.x, S.z), walkable: walkable(S.x, S.z), view: { ...view }, cam: { x: cam.x, y: cam.y } }),
      teleport: (x, z, facing) => { if (walkable(x, z)) { S.x = x; S.z = z; } if (facing !== undefined) S.facing = Math.round(facing / 45) % 8; return walkable(x, z); },
      walkable, heightAt,
    };
    requestAnimationFrame(frame);
  }
  start();
})();
</script>
