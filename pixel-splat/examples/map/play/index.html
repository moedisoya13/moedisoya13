<title>BB 필드 테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: dark;
  --bg: #13131c;          /* the level's own background (graybox.BACKGROUND) */
  --panel: #1c1c27;
  --line: #2c2c3a;
  --text: #ecebe8;
  --muted: #a7a5ad;
  --accent: #dc9a5c;      /* the mannequin's clay colour */
  --accent-ink: #1a1208;
  --focus: #ffd08a;
  --pad: rgba(236, 235, 232, 0.10);
  --pad-edge: rgba(236, 235, 232, 0.28);
  --knob: rgba(236, 235, 232, 0.55);
  --btn: rgba(28, 28, 39, 0.78);
  --hint-bg: rgba(19, 19, 28, 0.80);
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text);
             -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html.scroll, html.scroll body { overflow: auto; }   /* (a window too short for the game: scroll rather than clip) */
body { font: 14px/1.4 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
/* The host already pads :root by the top and bottom safe-area insets (the notch / Dynamic Island, the home
   indicator).  The app adds only what is left of them (--inset-top / --inset-bottom, set by fit(): 0 inside the
   host, the insets themselves when the page is opened on its own) - adding env() again here doubled them
   (93 CSS px of an iPhone 15's 852).  The sides are ours (viewport-fit-sides: cover). */
.app {
  height: 100%; min-height: 260px; display: flex; flex-direction: column; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(8px + var(--inset-top, 0px)); padding-bottom: calc(8px + var(--inset-bottom, 0px));
}
.bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; column-gap: 14px; row-gap: 2px; min-width: 0; }
.bar h1 { font-size: 16px; line-height: 22px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
.bar p { margin: 0; color: var(--muted); font-size: 13px; line-height: 18px; min-width: 0; }
.bar .help { color: var(--text); flex-basis: 100%; }
kbd { font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 5px; border: 1px solid var(--line);
      border-bottom-width: 2px; border-radius: 4px; background: var(--panel); color: var(--text); }
.touch-only { display: none; }
@media (pointer: coarse) {
  .touch-only { display: inline; } .keys-only { display: none; }
  .bar .desc { display: none; }                 /* phones: a compact header, the game gets the screen */
  .bar .help { flex-basis: auto; font-size: 12.5px; }
}
@media (pointer: coarse) and (max-height: 500px) {   /* a phone on its side: one short line */
  .app { gap: 6px; padding-top: calc(4px + var(--inset-top, 0px)); padding-bottom: calc(6px + var(--inset-bottom, 0px)); }
  .bar { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
  .bar h1 { font-size: 14px; line-height: 20px; } .bar p { line-height: 20px; } .bar .help { overflow: hidden; text-overflow: ellipsis; }
}
/* .play: the game area (.stage) and, on a phone held upright, the control deck under it; the stick and the button
   live in .play.  Upright, the game area is at most 7:5 (tall:wide) and the deck takes the rest: the thumbs do not
   cover the game, and the figure stands in the upper half of the screen (a preview that shows only the top of the
   page still shows him) */
.play { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.stage { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; border-radius: 8px; background: var(--bg); }
.deck { display: none; }
@media (pointer: coarse) and (orientation: portrait) {
  .stage { flex: 100 1 0; max-height: calc((100vw - 32px) * 1.4); min-height: 160px; }
  .deck { display: block; flex: 1 0 160px; border-radius: 8px; background: var(--panel); }
}
/* the focus ring is drawn by the stage (inset), so the stage's own clipping cannot hide it */
.stage::after { content: ""; position: absolute; inset: 0; border-radius: 8px; pointer-events: none;
                box-shadow: inset 0 0 0 3px var(--focus); opacity: 0; }
.stage.kbd-focus::after { opacity: 1; }
/* #view is placed by layout() on whole DEVICE pixels (not centred by the grid: centring can land on a fraction of one,
   and then the level canvas and the figure canvas are rounded to different device pixels) */
#view { position: absolute; left: 0; top: 0; overflow: hidden; outline: none; background: var(--bg); }
#view canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; image-rendering: crisp-edges; }
.hud { position: absolute; left: 8px; top: 6px; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
       color: var(--text); background: rgba(19, 19, 28, 0.72); padding: 3px 6px; border-radius: 4px; pointer-events: none; }
.status { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--muted);
          text-align: center; padding: 16px; background: rgba(19, 19, 28, 0.55); }
.status.error { color: var(--text); background: rgba(19, 19, 28, 0.88); }
.status[hidden] { display: none; }
.status .meter { width: min(240px, 60vw); height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.status .meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 120ms linear; }
.status.error .meter { display: none; }
.pad { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; z-index: 2;
       background: var(--pad); border: 2px solid var(--pad-edge); pointer-events: none; display: none; }
.pad::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 1px dashed var(--pad-edge); }
.pad .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
             background: var(--knob); }
.pad.run .knob { background: var(--accent); }
.pad.on { display: block; }
.pad-hint { position: absolute; left: 14px; bottom: 14px; width: 104px; height: 104px; border-radius: 50%;
            border: 2px dashed var(--pad-edge); background: var(--hint-bg); color: var(--text); font-size: 13px; font-weight: 600;
            display: none; place-items: center; text-align: center; pointer-events: none; }
@media (pointer: coarse) { .pad-hint { display: grid; } .play.sticking .pad-hint { display: none; } }
.acts { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: flex-end; z-index: 1; }
@media (pointer: coarse) and (orientation: portrait) { .pad-hint { left: 22px; bottom: 22px; } .acts { right: 22px; bottom: 36px; } }
.acts button {
  width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); background: var(--btn); color: var(--text);
  font: 700 15px/1 system-ui, sans-serif; touch-action: none; cursor: pointer; display: grid; place-items: center; gap: 2px;
  transition: transform 80ms ease-out, background-color 80ms ease-out;
}
.acts button small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
.acts button.down, .acts button:active { background: var(--accent); color: var(--accent-ink); }
.acts button.down small, .acts button:active small { color: var(--accent-ink); }
.acts button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (pointer: fine) { .acts button { width: 54px; height: 54px; font-size: 13px; } }
@media (pointer: coarse) { .acts button { width: 76px; height: 76px; font-size: 17px; } .acts button small { display: none; } }
@media (prefers-reduced-motion: reduce) { .acts button { transition: none; } .status .meter i { transition: none; } }
</style>

<div class="app" id="app">
  <header class="bar">
    <h1>BB 필드 테스트</h1>
    <p class="desc">기본 몸(BB)을 그레이박스 테스트 맵에 세운 것 · 45° 카메라 · 걷기·달리기는 리그, 원투는 복싱 카탈로그에서</p>
    <p class="help">
      <span class="keys-only">이동 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 방향키 · <kbd>Shift</kbd> 누른 채 달리기 · <kbd>J</kbd> 원투</span>
      <span class="touch-only">왼쪽 끌기: 걷기 · 끝까지: 달리기 · 원투 버튼</span>
    </p>
  </header>
  <main class="play" id="play">
    <div class="stage" id="stage">
      <div id="view" tabindex="0" role="img" aria-label="게임 화면: 그레이박스 맵 위의 BB. 방향키로 걷고, Shift로 달리고, J로 원투">
        <canvas id="level"></canvas><canvas id="fig"></canvas>
      </div>
      <div class="hud" id="hud" aria-hidden="true"></div>
      <div class="status" id="status" role="status"><span id="statusText">불러오는 중…</span><div class="meter" aria-hidden="true"><i id="meter"></i></div></div>
    </div>
    <div class="deck" aria-hidden="true"></div>
    <div class="pad-hint" aria-hidden="true">끌어서<br>이동</div>
    <div class="pad" id="pad" aria-hidden="true"><div class="knob" id="knob"></div></div>
    <div class="acts">
      <button type="button" id="bJ" aria-label="원투 (J)">원투<small>J</small></button>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const app = $("app"), play_ = $("play"), stage = $("stage"), canvas = $("view"), hud = $("hud"), statusEl = $("status");
  const statusText = $("statusText"), meter = $("meter");
  const viewEl = canvas, levelEl = $("level"), figEl = $("fig");
  const figCtx = figEl.getContext("2d");
  const FPS = 60;
  let running = true;

  function say(text, frac) {
    statusText.textContent = text;
    if (frac !== undefined) meter.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + "%";
  }
  function fail(err) {               // anything that goes wrong is shown, never a silent freeze
    running = false;
    statusEl.hidden = false;
    statusEl.classList.add("error");
    say("오류가 나서 멈췄습니다: " + (err && err.message ? err.message : String(err)));
    if (window.console) console.error(err);
  }
  window.addEventListener("error", (e) => fail(e.error || e.message));
  window.addEventListener("unhandledrejection", (e) => fail(e.reason));

  // ------------------------------------------------------------------ fitting the screen
  // The page fills what is visible, never more: html / body are 100 % of the window inside the host's padding (the
  // safe areas top and bottom).  fit() adds what the host did not pad (a page opened on its own), and when the
  // visible area is shorter than the layout (the on-screen keyboard, a browser bar over the page) it shrinks the
  // app to the visual viewport, so nothing ends up below the bottom edge where overflow: hidden would hide it.
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
                        "padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0";
  document.body.appendChild(probe);
  const px = (v) => parseFloat(v) || 0;
  function fit() {
    const root = getComputedStyle(document.documentElement), env = getComputedStyle(probe);
    const padT = px(root.paddingTop), padB = px(root.paddingBottom);
    app.style.setProperty("--inset-top", Math.max(0, px(env.paddingTop) - padT) + "px");
    app.style.setProperty("--inset-bottom", Math.max(0, px(env.paddingBottom) - padB) + "px");
    app.style.height = "";
    let bottom = window.innerHeight - padB;          // the body's bottom edge when the window is all visible
    const vv = window.visualViewport;
    if (vv && Math.abs(vv.scale - 1) < 0.01) bottom = Math.min(bottom, vv.offsetTop + vv.height);   // (not when pinch-zoomed)
    const top = app.getBoundingClientRect().top + (window.scrollY || 0), r = app.getBoundingClientRect();
    if (r.bottom > bottom + 0.5) app.style.height = Math.max(260, bottom - top) + "px";
    document.documentElement.classList.toggle("scroll", bottom - top < 260);
    if (!document.documentElement.classList.contains("scroll") && (window.scrollX || window.scrollY)) window.scrollTo(0, 0);
  }
  fit();

  // ------------------------------------------------------------------ assets
  // Downloads all files at once (with progress: the build lists every file's size in the manifest), then decodes
  // them one by one.  The sprite atlases are the big ones (15.8 M pixels): they are drawn into a small canvas a strip
  // at a time and each frame's pixels are copied into two compact arrays (colour + flags, depth), so the memory
  // never holds a whole decoded atlas twice (image + full-size canvas + full ImageData, as before: ~315 MB peak).
  async function fetchAll(urls, sizes) {
    const got = urls.map(() => 0), total = sizes.reduce((a, b) => a + b, 0) || 1;
    const show = () => {
      const g = got.reduce((a, b) => a + b, 0);
      say("불러오는 중… " + (g / 1e6).toFixed(1) + " / " + (total / 1e6).toFixed(1) + " MB", 0.9 * g / total);
    };
    show();
    return Promise.all(urls.map(async (u, i) => {
      const r = await fetch(u);
      if (!r.ok) throw new Error(u + " 을(를) 불러오지 못했습니다 (" + r.status + ")");
      if (!r.body || !r.body.getReader) { const b = await r.blob(); got[i] = b.size; show(); return b; }
      const rd = r.body.getReader(), parts = [];
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        parts.push(value); got[i] += value.length; show();
      }
      return new Blob(parts, { type: r.headers.get("content-type") || "" });
    }));
  }
  // Decoded pixels from the bytes: an ImageBitmap where there is one (it is let go the moment it is used: close()),
  // else an <img>.  No premultiplying and no colour conversion: byte-exact (tests).  Returns [image, release].
  async function decode(blob, name) {
    if (window.createImageBitmap) {
      try {
        const bm = await createImageBitmap(blob, { premultiplyAlpha: "none", colorSpaceConversion: "none" });
        return [bm, () => bm.close()];
      } catch (_) { /* (an older Safari: no options, or no blobs) the <img> below */ }
    }
    const im = await decodeImg(blob, name);
    return [im, () => { im.src = ""; }];
  }
  async function decodeImg(blob, name) {
    const url = URL.createObjectURL(blob), im = new Image();
    try {
      im.src = url;
      await new Promise((ok, no) => { im.onload = ok; im.onerror = () => no(new Error(name + " 을(를) 풀지 못했습니다")); });
      return im;
    } finally { URL.revokeObjectURL(url); }
  }
  function pixels([im, release]) {   // small images only (the level layers)
    const c = document.createElement("canvas");
    c.width = im.naturalWidth || im.width; c.height = im.naturalHeight || im.height;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(im, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height);
    c.width = c.height = 0;          // let the browser drop the scratch canvas now
    release();
    return d;
  }
  const STRIP = 256;                  // rows per strip (4096 x 256 x 4 = 4 MB of canvas and as much ImageData)
  // copy one atlas page into the compact arrays: "color" -> RGB + opaque bit, "data" -> depth + shadow bit
  function unpackPage([im, release], kind, page, frames, base) {
    const W = im.naturalWidth || im.width, H = im.naturalHeight || im.height, c = document.createElement("canvas");
    c.width = W; c.height = Math.min(STRIP, H);
    const x = c.getContext("2d", { willReadFrequently: true });
    x.imageSmoothingEnabled = false;
    const pxs = SP.px, dz = SP.dz, zero = SP.zero;
    for (let y0 = 0; y0 < H; y0 += STRIP) {
      const h = Math.min(STRIP, H - y0);
      x.clearRect(0, 0, W, c.height);
      x.drawImage(im, 0, y0, W, h, 0, 0, W, h);
      const d = x.getImageData(0, 0, W, h).data;
      for (let i = 0; i < frames.length; i++) {
        const f = frames[i];
        if ((f[6] || 0) !== page || f[1] >= y0 + h || f[1] + f[3] <= y0) continue;
        const fw = f[2], v0 = Math.max(0, y0 - f[1]), v1 = Math.min(f[3], y0 + h - f[1]);
        for (let v = v0; v < v1; v++) {
          let s = 4 * ((f[1] + v - y0) * W + f[0]), o = base[i] + v * fw;
          if (kind === "color") {
            for (let u = 0; u < fw; u++, s += 4, o++) {
              const q = 4 * o;
              pxs[q] = d[s]; pxs[q + 1] = d[s + 1]; pxs[q + 2] = d[s + 2];
              pxs[q + 3] = (pxs[q + 3] & 1) | (d[s + 3] >= 128 ? 0x80 : 0);
            }
          } else {
            for (let u = 0; u < fw; u++, s += 4, o++) {
              dz[o] = d[s] * 256 + d[s + 1] - zero;
              if (d[s + 2] >= 128) pxs[4 * o + 3] |= 1;
            }
          }
        }
      }
    }
    c.width = c.height = 0;
    release();
  }

  let M, L, T, SUN, SP;               // manifest, level, terrain, ground sun, sprites
  let UY = [0, 0, 0, 0];               // world height (units) of the level point at pixel (x, y) and depth d:
  //                                      UY[0] x + UY[1] y + UY[2] d + UY[3] (the pixel's centre; the camera map inverted)
  function heightRow(m) {
    const a = m.map((r) => r.slice(0, 3)), t = m.map((r) => r[3]);
    const det = a[0][0] * (a[1][1] * a[2][2] - a[1][2] * a[2][1]) - a[0][1] * (a[1][0] * a[2][2] - a[1][2] * a[2][0])
              + a[0][2] * (a[1][0] * a[2][1] - a[1][1] * a[2][0]);
    const r = [(a[1][2] * a[2][0] - a[1][0] * a[2][2]) / det, (a[0][0] * a[2][2] - a[0][2] * a[2][0]) / det,
               (a[0][2] * a[1][0] - a[0][0] * a[1][2]) / det];   // row 1 of the inverse (the cofactors of column 1)
    return [r[0], r[1], r[2], 0.5 * (r[0] + r[1]) - (r[0] * t[0] + r[1] * t[1] + r[2] * t[2])];
  }
  const nextFrame = () => new Promise((ok) => setTimeout(ok, 0));   // (lets the progress text paint between decodes)
  async function load() {
    const r = await fetch("assets/manifest.json");
    if (!r.ok) throw new Error("assets/manifest.json 을(를) 불러오지 못했습니다 (" + r.status + ")");
    M = await r.json();
    const lv = M.level, sp = M.sprites, tr = lv.terrain, sn = lv.sun;
    UY = heightRow(M.camera.world_to_screen);
    // atlas pages: [{color, data}] (play.py now), or one colour + one data atlas (older builds)
    const pages = sp.pages || [{ color: sp.color, data: sp.data }];
    const files = [lv.color, lv.depth, tr.file, sn.file].concat(...pages.map((p) => [p.color, p.data]));
    const sizes = files.map((f) => (M.files && M.files[f]) || 0);
    const blobs = await fetchAll(files.map((f) => "assets/" + f), sizes);
    say("그림 푸는 중…", 0.9);
    await nextFrame();
    const lvIm = [];                   // the level layers: small (2 M pixels at most)
    for (let i = 0; i < 4; i++) { lvIm.push(pixels(await decode(blobs[i], files[i]))); blobs[i] = null; }
    setupLevel(lvIm[0], lvIm[1], lvIm[2], lvIm[3], lv, tr, sn);
    lvIm.length = 0;
    // sprites: every frame's pixels, packed one after another (its rectangle's rows), in two arrays
    const frames = sp.frames, base = new Int32Array(frames.length);
    let n = 0;
    for (let i = 0; i < frames.length; i++) { base[i] = n; n += frames[i][2] * frames[i][3]; }
    SP = { px: new Uint8Array(4 * n), dz: new Int16Array(n), base, frames, anims: sp.anims, scale: sp.depth_scale,
           zero: sp.depth_zero, nf: sp.facings.length, step: 360 / sp.facings.length, pixels: n };
    for (let p = 0; p < pages.length; p++) {
      for (const kind of ["data", "color"]) {
        const i = 4 + 2 * p + (kind === "color" ? 0 : 1);
        say("그림 푸는 중… " + (p + 1) + " / " + pages.length, 0.9 + 0.1 * (2 * p + (kind === "data" ? 0 : 1)) / (2 * pages.length));
        await nextFrame();
        unpackPage(await decode(blobs[i], files[i]), kind, p, frames, base);
        blobs[i] = null;
      }
    }
    for (const [name, a] of Object.entries(SP.anims)) {
      if (!a.frames || !a.frames.length || !a.frames[0].length) throw new Error("애니메이션 " + name + " 에 프레임이 없습니다");
    }
    for (const need of ["idle", "walk", "run", "onetwo"]) if (!SP.anims[need]) throw new Error("애니메이션 " + need + " 이(가) 없습니다");
    for (const f of SP.frames) { FIGW = Math.max(FIGW, f[2]); FIGH = Math.max(FIGH, f[3]); }
    figEl.width = FIGW + 2; figEl.height = FIGH + 2;   // (a clear 1 px margin: the compositor softens a scaled layer's edge pixels)
    figImg = figCtx.createImageData(FIGW, FIGH); fig32 = new Uint32Array(figImg.data.buffer);
    rowShown = new Int32Array(FIGH); rowOpaque = new Int32Array(FIGH); allowedAt = new Int32Array(FIGW * FIGH);
  }
  function setupLevel(col, dep, ter, sun, lv, tr, sn) {
    levelEl.width = col.width; levelEl.height = col.height;   // the level picture, moved by the compositor
    levelEl.getContext("2d").putImageData(col, 0, 0);
    const W = col.width, H = col.height;
    // level: colour as packed 32-bit pixels, depth as floats (Infinity = nothing), flags (sunlit, ground)
    const depth = new Float32Array(W * H), flag = new Uint8Array(W * H);
    const k = (lv.depth_hi - lv.depth_lo) / (lv.depth_empty - 1), dd = dep.data;
    for (let i = 0, j = 0; i < W * H; i++, j += 4) {
      const q = dd[j] * 256 + dd[j + 1];
      depth[i] = q >= lv.depth_empty ? Infinity : lv.depth_lo + q * k;
      flag[i] = dd[j + 2];
    }
    const bgc = lv.background.map((v) => Math.round(v * 255));
    L = { W, H, rgba: new Uint32Array(col.data.buffer), depth, flag, LIT: lv.depth_flags.lit, GROUND: lv.depth_flags.ground,

  // Whole device pixels per art pixel.  The level is art at 3x the reference grid's density, so one art pixel
  // is shown as one CSS pixel (one point) on a phone - the figure about 48 pt tall, 1 m of ground 34 pt: an iPhone
  // 15 upright shows 361 art px = 10.5 m across, on its side 734 = 21 m (the reference screen's width).  Fewer
  // device pixels per art pixel would show more ground but shrink the figure to 32 pt (dpr 3) or 24 pt (dpr 2);
  // more would show only 7.9 m across.  2 CSS px once the game area is 700 CSS px or wider (1280 px desktop:
  // 624 art px = 18.2 m, one reference screen)
  function layout() {
    const dpr = window.devicePixelRatio || 1, r = stage.getBoundingClientRect();
    const cssPerArt = Math.max(1, Math.round(r.width / 700));
    const sDev = Math.max(1, Math.round(cssPerArt * dpr));
    const w = Math.max(32, Math.floor(r.width * dpr / sDev)), h = Math.max(32, Math.floor(r.height * dpr / sDev));
    const sc = sDev / dpr;
    view = { w, h, scale: sc, sDev, cssPerArt, dpr, css: [+r.width.toFixed(2), +r.height.toFixed(2)] };
    viewEl.style.width = (w * sc) + "px"; viewEl.style.height = (h * sc) + "px";
    // centred in the stage, its top-left corner on a whole device pixel: both canvases inside move by whole
    // device pixels from there, so they stay in register (at dpr 2.625 the centre fell on 160.125 device px)
    const left = Math.round((r.left + (r.width - w * sc) / 2) * dpr) / dpr - r.left;
    const top = Math.round((r.top + (r.height - h * sc) / 2) * dpr) / dpr - r.top;
    viewEl.style.transform = `translate(${left}px, ${top}px)`;   // (a transform: layout would round left / top to 1/64 px)
    if (!L) return;
    // the canvases keep their own size in CSS px and are scaled by their transform: a CSS width of 79 * 8/7 px
    // is rounded to 1/64 px by layout (236.99 device px for 237), and that slips a column
    levelEl.style.width = L.W + "px"; levelEl.style.height = L.H + "px";
    figEl.style.width = (FIGW + 2) + "px"; figEl.style.height = (FIGH + 2) + "px";
    lastCam = null;
  }
  function relayout() { fit(); layout(); }
  function project(x, z) {
    const U = M.camera.units_per_m, X = x * U, Y = M.camera.ground_y + heightAt(x, z) * U, Z = z * U, m = M.camera.world_to_screen;
    return [m[0][0] * X + m[0][1] * Y + m[0][2] * Z + m[0][3], m[1][0] * X + m[1][1] * Y + m[1][2] * Z + m[1][3],
            m[2][0] * X + m[2][1] * Y + m[2][2] * Z + m[2][3]];
  }
  function follow(px, py, dt) {
    // The camera trails the player by a smooth lag measured on the player's EXACT screen position; it sits a
    // whole number of art pixels from the player's anchor pixel and changes that number only when the smooth
    // lag is 0.75 px away from it (hysteresis): at a steady walk camera and figure step together.  During the
    // one-two the anchor does not move at all (its root motion is inside the sprites), so neither does the camera.
    const ax = Math.floor(px), ay = Math.floor(py);
    if (cam.ax !== null) { cam.lagX += cam.ax - px; cam.lagY += cam.ay - py; }
    cam.ax = px; cam.ay = py;
    const k = Math.exp(-dt / 0.22);
    cam.lagX *= k; cam.lagY *= k;
    const lim = 0.3 * Math.min(view.w, view.h);
    cam.lagX = Math.max(-lim, Math.min(lim, cam.lagX)); cam.lagY = Math.max(-lim, Math.min(lim, cam.lagY));
    if (Math.abs(cam.lagX - cam.showX) > 0.75) cam.showX = Math.round(cam.lagX);
    if (Math.abs(cam.lagY - cam.showY) > 0.75) cam.showY = Math.round(cam.lagY);
    cam.x = ax - Math.floor(view.w / 2) + cam.showX;
    cam.y = ay - Math.floor(view.h * (view.h > view.w ? 0.52 : 0.58)) + cam.showY;   // (upright: nearer the middle)
  }
  const BIAS = 0.15;         // world units: a sprite pixel this much behind an object still shows
  const GROUND_BIAS = 0.6;   // ... and this much behind GROUND at the figure's own height (slopes, banks: the
  //                            ground at the feet must not cut them)
  const GROUND_NEAR = 0.3;   // metres: "own height" = the ground pixel's height is within this of the feet's.  A
  // plateau top 1.6 m up in front of a figure standing behind it is ground too, and must hide him (with the big
  // allowance his shoulders were drawn over it).  On a pixel's ray, ground dh above the feet lies about dh in
  // front of them, so this is "the ground within 0.3 m in front of the feet"
  function draw() {
    const x0 = cam.x, y0 = cam.y, sc = view.scale;
    if (!lastCam || lastCam[0] !== x0 || lastCam[1] !== y0) {
      levelEl.style.transform = `translate(${-x0 * sc}px, ${-y0 * sc}px) scale(${sc})`;
      lastCam = [x0, y0];
    }
    const [px, py, pd] = project(S.x, S.z);
    const ax = Math.floor(px), ay = Math.floor(py);
    const fi = frameIndex(), [, , fw, fh, ox, oy] = SP.frames[fi], base = SP.base[fi];
    const bx = ax + ox, by = ay + oy;                 // the box, in level pixels
    const LW = L.W, LH = L.H, rgba = L.rgba;
    // 0) the level's own pixels in the box
    for (let v = 0; v < fh; v++) {
      const ly = by + v, row = v * FIGW;
      if (ly < 0 || ly >= LH) { fig32.fill(L.bg, row, row + fw); continue; }
      const a = Math.max(0, -bx), b = Math.min(fw, LW - bx);
      if (a > 0) fig32.fill(L.bg, row, row + Math.min(a, fw));
      if (b > a) fig32.set(rgba.subarray(ly * LW + bx + a, ly * LW + bx + b), row + a);
      if (b < fw) fig32.fill(L.bg, row + Math.max(b, 0), row + fw);
    }
    nAllowed = 0;
    const ratio = L.ratio, d8 = figImg.data, depth = L.depth, flag = L.flag, LITF = L.LIT, GR = L.GROUND;
    const spx = SP.px, sdz = SP.dz, dscale = SP.scale, rowD = L.rowDepth;   // sprite pixel i: spx[4i..4i+3], sdz[i]
    const shade = !sunAt(S.x, S.z);
    const footY = M.camera.ground_y + heightAt(S.x, S.z) * M.camera.units_per_m, nearU = GROUND_NEAR * M.camera.units_per_m;
    // 1) its shadow: flat ground at the figure's height, only where the level is at that depth and lit
    for (let v = 0; v < fh; v++) {
      const sy = by + v;
      if (sy < 0 || sy >= LH) continue;
      const want = pd + (oy + v) * rowD;
      let si = base + v * fw, li = sy * LW + bx, o = 4 * v * FIGW;
      for (let u = 0; u < fw; u++, si++, li++, o += 4) {
        if (!(spx[4 * si + 3] & 1)) continue;
        const sx = bx + u;
        if (sx < 0 || sx >= LW || !(flag[li] & LITF) || Math.abs(depth[li] - want) > 0.35) continue;
        d8[o] = d8[o] * ratio[0]; d8[o + 1] = d8[o + 1] * ratio[1]; d8[o + 2] = d8[o + 2] * ratio[2];
      }
    }
    // 2) its pixels, where they are nearer than the level (ground gets the larger allowance)
    const s0 = shade ? ratio[0] : 1, s1 = shade ? ratio[1] : 1, s2 = shade ? ratio[2] : 1;
    for (let v = 0; v < fh; v++) {
      const sy = by + v, inLevel = sy >= 0 && sy < LH;
      let si = base + v * fw, li = sy * LW + bx, o = 4 * v * FIGW, shown = 0, opaque = 0;
      for (let u = 0; u < fw; u++, si++, li++, o += 4) {
        const q = 4 * si;
        if (!(spx[q + 3] & 0x80)) continue;
        opaque++;
        const sx = bx + u;
        if (inLevel && sx >= 0 && sx < LW) {
          const dz = pd + sdz[si] / dscale;
          const dl = depth[li];
          if (dz > dl + BIAS) {                         // behind the level here: hidden, unless it is ground
            if (!(flag[li] & GR) || dz > dl + GROUND_BIAS) continue;   // at the feet's own height
            if (Math.abs(UY[0] * sx + UY[1] * sy + UY[2] * dl + UY[3] - footY) >= nearU) continue;
            allowedAt[nAllowed++] = li;
          }
        }
        d8[o] = spx[q] * s0; d8[o + 1] = spx[q + 1] * s1; d8[o + 2] = spx[q + 2] * s2; d8[o + 3] = 255;
        shown++;
      }
      rowShown[v] = shown; rowOpaque[v] = opaque;
    }
    rowN = fh;
    if (lastBox) figCtx.clearRect(1, 1, lastBox[2], lastBox[3]);
    figCtx.putImageData(figImg, 1, 1, 0, 0, fw, fh);
    figEl.style.transform = `translate(${(bx - x0 - 1) * sc}px, ${(by - y0 - 1) * sc}px) scale(${sc})`;
    lastBox = [bx, by, fw, fh];
    return [ax, ay];
  }
  function shownPixel(sx, sy) {      // what the game area shows at view pixel (sx, sy): the figure box, else the level
    const lx = cam.x + sx, ly = cam.y + sy;
    if (lastBox && lx >= lastBox[0] && ly >= lastBox[1] && lx < lastBox[0] + lastBox[2] && ly < lastBox[1] + lastBox[3]) {
      const o = 4 * ((ly - lastBox[1]) * FIGW + lx - lastBox[0]);
      return [figImg.data[o], figImg.data[o + 1], figImg.data[o + 2]];
    }
    if (lx < 0 || ly < 0 || lx >= L.W || ly >= L.H) return [L.bg & 255, (L.bg >>> 8) & 255, (L.bg >>> 16) & 255];
    const p = L.rgba[ly * L.W + lx];
    return [p & 255, (p >>> 8) & 255, (p >>> 16) & 255];
  }

  // ------------------------------------------------------------------ loop
  let last = 0, hudT = 0, frames = 0;
  const times = [];
  let fault = false;
  function frame(ts) {
    if (!running) return;
    try {
      if (fault) throw new Error("시험용 오류");
      const t0 = performance.now();
      const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0);
      last = ts;
      if ((window.devicePixelRatio || 1) !== view.dpr) layout();   // (zoom, a move to another screen)
      update(dt);
      const [px, py] = project(S.x, S.z);
      follow(px, py, dt);
      draw();
      frames++;
      times.push(performance.now() - t0); if (times.length > 240) times.shift();
      hudT -= dt;
      if (hudT <= 0) {
        hudT = 0.2;
        const what = { idle: "대기", walk: "걷기", run: "달리기", onetwo: "원투" }[S.anim] || "전환";
        hud.textContent = `x ${S.x.toFixed(1)}  z ${S.z.toFixed(1)}  높이 ${heightAt(S.x, S.z).toFixed(2)} m  ${what}`;
      }
    } catch (err) { fail(err); return; }
    requestAnimationFrame(frame);
  }

  function nearestWalkable(x, z) {
    if (walkable(x, z)) return [x, z];
    let best = null, bd = Infinity;
    for (let j = 0; j < T.nz; j++) for (let i = 0; i < T.nx; i++) {
      if (!T.walk[j * T.nx + i]) continue;
      const cx = T.ox + (i + 0.5) * T.cell, cz = T.oz + (j + 0.5) * T.cell, d = (cx - x) ** 2 + (cz - z) ** 2;
      if (d < bd) { bd = d; best = [cx, cz]; }
    }
    return best || [x, z];
  }

  // the window, the visible area or the orientation changes: fit the app to it, then the game area to the app
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", () => setTimeout(relayout, 60));   // (iOS reports the new size late)
  if (window.visualViewport) window.visualViewport.addEventListener("resize", relayout);
  new ResizeObserver(() => layout()).observe(stage);
  layout();

  async function start() {
    try {
      await load();
    } catch (err) {
      statusEl.classList.add("error");
      say("불러오지 못했습니다: " + err.message);
      return;
    }
    [S.x, S.z] = nearestWalkable(M.start.at[0], M.start.at[1]);
    S.facing = S.want = ((Math.round(M.start.facing / SP.step) % SP.nf) + SP.nf) % SP.nf;
    play("idle", 0);
    relayout();
    statusEl.hidden = true;
    canvas.focus({ preventScroll: true });
    // for automated checks (and curious players): read the state, put the figure somewhere
    window.bbDebug = {
      state: () => ({ x: S.x, z: S.z, facing: S.facing * SP.step, want: S.want * SP.step, anim: S.anim, k: S.k, phase: S.phase,
                      queue: S.queue, height: heightAt(S.x, S.z), walkable: walkable(S.x, S.z), shade: !sunAt(S.x, S.z),
                      view: { ...view }, cam: { x: cam.x, y: cam.y }, frame: frameIndex(), frames, sc: S.sc, box: lastBox,
                      stick: { active: stick.active, dx: stick.dx, dy: stick.dy, run: stick.run, cx: stick.cx, cy: stick.cy },
                      gi: SP.anims[S.anim].kind === "gait" ? gaitShown(SP.anims[S.anim].frames[0].length) : -1 }),
      teleport: (x, z, facing) => {
        if (walkable(x, z)) { S.x = x; S.z = z; }
        if (facing !== undefined) S.facing = S.want = ((Math.round(facing / SP.step) % SP.nf) + SP.nf) % SP.nf;
        play("idle", 0); S.sc = S.gaitSc = S.scFrom = 1; S.goff = 0; cam.ax = null; cam.lagX = cam.lagY = cam.showX = cam.showY = 0; lastCam = null;
        return walkable(x, z);
      },
      times: () => times.slice(),
      // the figure's pixels in the last frame drawn, per row from the top of its box: [drawn, there]
      rows: () => Array.from({ length: rowN }, (_, v) => [rowShown[v], rowOpaque[v]]),
      // figure pixels drawn in the last frame only thanks to the ground allowance (the level was nearer by more
      // than BIAS), over ground more than h metres above the feet: [lx, ly, height] (should be none for h >= 0.3)
      drawnOver: (h) => {
        const feet = heightAt(S.x, S.z), out = [];
        for (let i = 0; i < nAllowed; i++) {
          const li = allowedAt[i], lx = li % L.W, ly = (li - lx) / L.W, d = L.depth[li];
          if (!Number.isFinite(d)) continue;
          const gh = (UY[0] * lx + UY[1] * ly + UY[2] * d + UY[3] - M.camera.ground_y) / M.camera.units_per_m - feet;
          if (gh > h && (L.flag[li] & L.GROUND)) out.push([lx, ly, +gh.toFixed(3)]);
        }
        return { allowed: nAllowed, over: out };
      },
      groundHeight: (pts) => pts.map(([lx, ly]) => {   // metres, of the level point a pixel shows (null: nothing)
        const d = L.depth[ly * L.W + lx];
        return Number.isFinite(d) ? (UY[0] * lx + UY[1] * ly + UY[2] * d + UY[3] - M.camera.ground_y) / M.camera.units_per_m : null; }),
      advance: (name, k) => { applyAdvance(SP.anims[name], k); return [S.x, S.z]; },
      fault: () => { fault = true; },
      countRed: () => {           // shown pixels of the (test) figure's pure red (the figure box)
        let n = 0, maxR = 0;
        const d = figImg.data;
        if (lastBox) for (let v = 0; v < lastBox[3]; v++) for (let u = 0; u < lastBox[2]; u++) {
          const i = 4 * (v * FIGW + u), r = d[i], g = d[i + 1], b = d[i + 2];
          if (r > 90 && g < 50 && b < 50 && r > 2.5 * Math.max(g, b, 1)) { n++; if (r > maxR) maxR = r; }
        }
        return [n, maxR];
      },
      walkable, heightAt, sunAt, canStep, project,
      pixel: shownPixel,
      level: (lx, ly) => { const p = L.rgba[ly * L.W + lx]; return [p & 255, (p >>> 8) & 255, (p >>> 16) & 255]; },
      levelDepth: (pts) => pts.map(([lx, ly]) => { const d = L.depth[ly * L.W + lx]; return Number.isFinite(d) ? d : null; }),
      // the decoded sprite pixels, frame after frame, row by row (tests compare them with the atlas files):
      // [sum of r + 3g + 7b over opaque pixels, sum of depth offset * (i % 13 + 1), shadow pixels, opaque pixels]
      atlasSums: () => {
        let c = 0, d = 0, sh = 0, op = 0;
        for (let i = 0; i < SP.pixels; i++) {
          const q = 4 * i;
          if (SP.px[q + 3] & 0x80) { c += SP.px[q] + 3 * SP.px[q + 1] + 7 * SP.px[q + 2]; op++; }
          if (SP.px[q + 3] & 1) sh++;
          d += SP.dz[i] * ((i % 13) + 1);
        }
        return [c, d, sh, op];
      },
    };
    requestAnimationFrame(frame);
  }
  start();
})();
</script>
