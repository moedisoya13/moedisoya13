<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>달빛 결투</title>
<style>
  :root { --ink: #0b0d14; --paper: #f4f7ff; --steel: #bccbdb; --red: #d23a38; --gold: #e9cd80; --teal: #5fd0c0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; overscroll-behavior: none;
    font: 700 14px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK KR", monospace; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr; }
  #stagebox { position: relative; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  /* upright phone: the picture takes the top of the screen, the controls the rest */
  @media (orientation: portrait) {
    #game { grid-template-rows: min(96vw, 54vh) 1fr; }
    #controls { position: relative !important; }
  }
  #hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left)); pointer-events: none; }
  .side { display: flex; flex-direction: column; gap: 4px; }
  .side.right { align-items: flex-end; }
  .name { font-size: 11px; letter-spacing: .12em; opacity: .8; text-shadow: 0 2px 0 var(--ink); }
  .hp { display: flex; gap: 3px; }
  .side.right .hp { flex-direction: row-reverse; }
  .hp i { width: 14px; height: 10px; background: var(--red); box-shadow: 0 0 0 2px var(--ink), inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.3); }
  .side.right .hp i { background: var(--teal); }
  .hp i.lost { background: #2b2733; box-shadow: 0 0 0 2px var(--ink); }
  #stage { font-size: 11px; letter-spacing: .2em; opacity: .7; padding-top: 2px; text-shadow: 0 2px 0 var(--ink); }
  #chance { position: absolute; left: 50%; top: 24%; transform: translate(-50%, 0) scale(.6); opacity: 0; pointer-events: none;
    font-size: clamp(22px, 7vw, 44px); letter-spacing: .08em; color: var(--gold); text-shadow: 3px 3px 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
  #chance.on { opacity: 1; transform: translate(-50%, 0) scale(1); transition: transform .08s steps(2); animation: blink .16s steps(2) infinite; }
  @keyframes blink { 50% { color: var(--paper); } }
  #fps { position: absolute; left: 8px; bottom: 6px; font-size: 10px; opacity: .6; pointer-events: none; }

  #controls { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  [data-pad] { position: relative; }
  [data-nub] { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 3px solid rgba(244,247,255,.25);
    opacity: 0; pointer-events: none; transition: opacity .1s; --dx: 0px; }
  [data-nub]::after { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%;
    background: rgba(244,247,255,.35); transform: translateX(var(--dx)); }
  #buttons { position: relative; }
  #buttons button { position: absolute; border-radius: 50%; border: 3px solid rgba(244,247,255,.55); background: rgba(11,13,20,.45);
    color: var(--paper); font: inherit; font-size: 15px; letter-spacing: .05em; padding: 0; touch-action: none; }
  #buttons button.down { background: rgba(244,247,255,.85); color: var(--ink); transform: scale(.94); }
  [data-button=attack] { width: 92px; height: 92px; right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); border-color: var(--red) !important; }
  [data-button=parry] { width: 70px; height: 70px; right: calc(124px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); border-color: var(--gold) !important; }
  [data-button=dodge] { width: 62px; height: 62px; right: calc(40px + env(safe-area-inset-right)); bottom: calc(128px + env(safe-area-inset-bottom)); }
  .hint { position: absolute; left: calc(20px + env(safe-area-inset-left)); bottom: calc(20px + env(safe-area-inset-bottom)); font-size: 11px; opacity: .45; pointer-events: none; }

  .sheet { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; background: rgba(11,13,20,.62); z-index: 5; }
  .sheet.on { display: grid; }
  .sheet h1 { margin: 0 0 6px; font-size: clamp(30px, 9vw, 60px); letter-spacing: .12em; color: var(--paper); text-shadow: 4px 4px 0 var(--red); }
  .sheet p { margin: 6px 0; opacity: .85; }
  .sheet dl { display: grid; grid-template-columns: auto auto; gap: 4px 14px; justify-content: center; margin: 14px 0; text-align: left; font-size: 13px; }
  .sheet dt { color: var(--gold); }
  .sheet dd { margin: 0; opacity: .85; }
  .go { display: inline-block; margin-top: 10px; padding: 10px 18px; border: 3px solid var(--paper); animation: blink 1s steps(2) infinite; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--ink); }
</style>
</head>
<body>
<div id="game">
  <div id="stagebox">
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="side"><span class="name">나그네</span><div class="hp" id="hp0"></div></div>
      <div id="stage"></div>
      <div class="side right"><span class="name">자객</span><div class="hp" id="hp1"></div></div>
    </div>
    <div id="chance">CHANCE!</div>
    <div id="fps"></div>
  </div>
  <div id="controls">
    <div data-pad><div data-nub></div><span class="hint">끌어서 이동 · 튕겨서 회피</span></div>
    <div id="buttons">
      <button data-button="dodge">회피</button>
      <button data-button="parry">막기</button>
      <button data-button="attack">베기</button>
    </div>
  </div>
</div>

<div class="sheet on" id="title">
  <div>
    <h1>달빛 결투</h1>
    <p>자객의 칼을 막아내면 찌를 틈이 열린다</p>
    <dl>
      <dt>베기</dt><dd>빠른 한 칼 · J</dd>
      <dt>막기</dt><dd>칼이 닿기 직전에 · K</dd>
      <dt>회피</dt><dd>뒤로 물러서기 · L / 방향 두 번</dd>
      <dt>CHANCE!</dt><dd>막아낸 뒤 베기 = 찌르기</dd>
    </dl>
    <span class="go">화면을 눌러 시작</span>
  </div>
</div>
<div class="sheet" id="result">
  <div>
    <h1 id="verdict"></h1>
    <span class="go" id="next"></span>
  </div>
</div>
<div id="loading">불러오는 중…</div>
<script type="module" src="src/main.mjs"></script>
</body>
</html>
