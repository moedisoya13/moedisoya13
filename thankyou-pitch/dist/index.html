t-size:clamp(11px,1.5vw,15px);letter-spacing:.4em;color:var(--accent);margin-bottom:18px;text-indent:.4em}.title-card__main{margin:0;font-size:clamp(46px,12vw,148px);font-weight:900;letter-spacing:-.03em;line-height:.95;color:#fff;text-shadow:0 0 70px rgba(255,212,94,.4),0 0 140px rgba(255,107,74,.25)}.title-card__sub{margin-top:14px;font-family:var(--mono);font-size:clamp(10px,1.5vw,14px);letter-spacing:.55em;color:#f2f5f88c;text-indent:.55em}.title-card__note{margin-top:30px;font-size:clamp(10px,1.2vw,12px);letter-spacing:.04em;color:#9aa6b2b3}#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}#controls{position:fixed;left:50%;bottom:16px;transform:translate(-50%);z-index:30;display:flex;align-items:center;gap:10px;height:var(--ctl-h);padding:0 14px;width:min(94vw,1080px);background:var(--bar);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--edge);border-radius:14px;box-shadow:0 18px 50px #0000008c;opacity:.28;transition:opacity .3s ease}#controls:hover,#controls:focus-within,#controls.is-awake{opacity:1}.ctl{flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .18s ease,color .18s ease,border-color .18s ease}.ctl:hover{background:#ffffff1a}.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.ctl--icon{width:36px;height:36px}.ctl--icon svg{width:19px;height:19px;fill:currentColor}.ctl--text{height:30px;padding:0 11px;font-size:12px;letter-spacing:.05em;color:var(--dim);border-color:var(--edge)}.ctl--text.is-on{color:#0b0e13;background:var(--accent);border-color:var(--accent);font-weight:700}.ico-play{display:none}#controls.is-paused .ico-play{display:block}#controls.is-paused .ico-pause{display:none}.ctl__time{flex:none;font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}.scrub{flex:1 1 auto;min-width:80px;height:36px;display:flex;align-items:center;cursor:pointer;touch-action:none}.scrub__track{position:relative;width:100%;height:4px;border-radius:2px;background:#ffffff29}.scrub__fill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:2px;background:linear-gradient(90deg,var(--accent-hot),var(--accent))}.scrub__knob{position:absolute;top:50%;left:0%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #00000073;transition:transform .15s ease}.scrub:hover .scrub__knob,.scrub:focus-visible .scrub__knob{transform:scale(1.25)}.scrub__marks{position:absolute;inset:0}.scrub__mark{position:absolute;top:-2px;width:2px;height:8px;background:#fff6;transform:translate(-1px)}.chapters{flex:none;display:flex;gap:4px}.chip{width:22px;height:22px;border-radius:6px;border:1px solid var(--edge);background:transparent;color:var(--dim);font-family:var(--mono);font-size:10px;cursor:pointer;padding:0;transition:background .18s ease,color .18s ease,border-color .18s ease}.chip:hover{background:#ffffff1f;color:var(--ink)}.chip.is-active{background:var(--accent);border-color:var(--accent);color:#0b0e13;font-weight:700}.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#hint{position:fixed;left:50%;bottom:calc(16px + var(--ctl-h) + 9px);transform:translate(-50%);z-index:29;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#9aa6b28c;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s ease}#controls:hover~#hint,#controls.is-awake~#hint{opacity:1}.noscript{position:fixed;inset:0;display:grid;place-items:center;background:#05070b;color:var(--ink);font-size:16px;z-index:99}@media(max-width:760px){:root{--ctl-h: 50px}#controls{gap:7px;padding:0 10px;bottom:12px}.chapters{display:none}.ctl__time{font-size:10px}#hint{display:none}#subtitles{bottom:calc(var(--ctl-h) + 44px);width:92vw}#hud{gap:10px}}@media(max-width:460px){.ctl--text{padding:0 8px;font-size:11px}.letterbox{height:3.4vh}}@media(prefers-reduced-motion:reduce){.sub,.title-card__inner,#chapter-label,#hud{transition-duration:.01ms}}</style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="overlay">
      <div class="letterbox letterbox--top"></div>
      <div class="letterbox letterbox--bottom"></div>

      <!-- 좌상단: 챕터 라벨 -->
      <div id="chapter-label">
        <span class="chapter-label__no">CH.1</span>
        <span class="chapter-label__title">소문</span>
      </div>

      <!-- 우상단: 남은 공 / 구속 / 카운트 -->
      <div id="hud">
        <div class="hud__block hud__block--pitches">
          <div class="hud__caption">던질 수 있는 공</div>
          <div class="hud__pips" id="hud-pips">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          </div>
        </div>
        <div class="hud__block hud__block--speed" id="hud-speed" hidden>
          <div class="hud__value"><span id="hud-speed-value">0</span><em>km/h</em></div>
          <div class="hud__pitchname" id="hud-pitch-name"></div>
        </div>
        <div class="hud__block hud__block--count" id="hud-count" hidden>
          <div class="hud__caption">COUNT</div>
          <div class="hud__value hud__value--count">
            <span id="hud-strikes">0</span><em>S</em>
          </div>
        </div>
      </div>

      <!-- 하단 중앙: 자막 -->
      <div id="subtitles" aria-live="polite"></div>

      <!-- 엔딩 타이틀 카드 -->
      <div id="title-card">
        <div class="title-card__inner">
          <div class="title-card__kicker">3구 승부, 다시 시작된다</div>
          <h1 class="title-card__main">땡큐&nbsp;피치</h1>
          <div class="title-card__sub">THANK YOU PITCH</div>
          <div class="title-card__note">
            원작: 스미요시 큐 『サンキューピッチ』 · Three.js 시네마틱 재구성
          </div>
        </div>
      </div>

      <!-- 화면 전체 플래시 -->
      <div id="flash"></div>
    </div>

    <!-- 컨트롤 바 -->
    <div id="controls">
      <button id="btn-play" class="ctl ctl--icon" type="button" aria-label="일시정지" title="재생/일시정지 (Space)">
        <svg viewBox="0 0 24 24" class="ico ico-pause" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-play" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.53.85l10.6-6.8a1 1 0 0 0 0-1.7L9.53 4.35A1 1 0 0 0 8 5.2Z"/></svg>
      </button>

      <button id="btn-replay" class="ctl ctl--icon" type="button" aria-label="처음부터" title="처음부터 (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
      </button>

      <div class="ctl__time"><span id="time-now">0:00</span> / <span id="time-total">1:02</span></div>

      <div id="scrub" class="scrub" role="slider" tabindex="0"
           aria-label="타임라인" aria-valuemin="0" aria-valuemax="62" aria-valuenow="0">
        <div class="scrub__track">
          <div class="scrub__marks" id="scrub-marks"></div>
          <div class="scrub__fill" id="scrub-fill"></div>
          <div class="scrub__knob" id="scrub-knob"></div>
        </div>
      </div>

      <div id="chapters" class="chapters"></div>

      <button id="btn-cc" class="ctl ctl--text is-on" type="button" title="자막 켜기/끄기 (C)">자막</button>
      <button id="btn-sound" class="ctl ctl--text" type="button" title="사운드 켜기/끄기 (M)">사운드</button>
    </div>

    <div id="hint">Space 재생/정지 · ←/→ 5초 · 1~8 챕터 · M 사운드 · C 자막 · R 리플레이</div>

    <noscript>
      <div class="noscript">이 작품을 보려면 JavaScript와 WebGL이 필요합니다.</div>
    </noscript>

  </body>
</html>
