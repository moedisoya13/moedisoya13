<!doctype html>
<meta charset="utf-8">
<title>__NAME__ card mockup</title>
<style>
  @font-face { font-family: "Source Sans 3"; font-weight: 400; src: url(__FONT_SS_REG__) format("woff2"); }
  @font-face { font-family: "Source Sans 3"; font-weight: 600; src: url(__FONT_SS_SEMI__) format("woff2"); }
  @font-face { font-family: "Source Sans 3"; font-weight: 700; src: url(__FONT_SS_BOLD__) format("woff2"); }
  @font-face { font-family: "Source Code Pro"; font-weight: 400; src: url(__FONT_SCP_REG__) format("woff2"); }
  @font-face { font-family: "Source Code Pro"; font-weight: 500; src: url(__FONT_SCP_MED__) format("woff2"); }

  :root {
    --blue:       #006dad;   /* $primary-color           */
    --blue-light: #0073b7;   /* $header-background-color */
    --blue-chip:  #005d93;   /* adjust($primary, -5%)    */
    --blue-dark:  #004d7a;   /* $primary-color-dark      */
    --rule:       rgba(255,255,255,.40);
    --yellow:     #ffd343;   /* $highlight-color         */
    --radius:     38px;      /* 3.18 mm at 300 dpi (ISO/IEC 7810 ID-1) */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { -webkit-font-smoothing: antialiased; }

  /* ------------------------------------------------------------------ scene */
  .scene {
    position: relative; width: 1420px; height: 880px; overflow: hidden;
    background:
      radial-gradient(130% 116% at 16% 2%, #b3bec8 0%, #8b98a4 18%, #5f6c78 40%, #3a444e 66%, #222a32 88%, #1a2027 100%);
  }
  body.flat .scene { background: none; width: 1011px; height: 638px; }

  .scene::after {                       /* lens vignette */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(80% 70% at 48% 42%, rgba(0,0,0,0) 44%, rgba(0,0,0,.30) 100%);
  }
  body.flat .scene::after { display: none; }

  .stage {
    position: absolute; inset: 0;
    perspective: 2400px; perspective-origin: 52% 42%;
  }
  .rig {
    position: absolute; inset: 0; display: grid; place-items: center;
    transform: scale(.82); transform-style: preserve-3d;
  }
  body.flat .rig { transform: none; }

  .tilt { transform: rotateX(6.5deg) rotateY(-16deg) rotateZ(-1.4deg); transform-style: preserve-3d; }
  body.flat .tilt { transform: none; }

  /* cast shadow on the backdrop, sheared to match the card angle */
  .cast {
    position: absolute; left: 50%; top: 50%;
    width: 860px; height: 300px; border-radius: 50%;
    background: #04070a; opacity: .72; filter: blur(60px);
    transform: translate(-50%, -50%) translate(78px, 286px) skewX(-13deg) scaleY(.62);
  }
  .cast--core {
    width: 690px; height: 190px; opacity: .60; filter: blur(22px);
    transform: translate(-50%, -50%) translate(44px, 264px) skewX(-13deg) scaleY(.52);
  }
  body.flat .cast { display: none; }

  /* ------------------------------------------------------------------- card */
  .card {
    position: relative;
    width: 1011px; height: 638px;               /* 85.6 x 54 mm at 300 dpi */
    border-radius: var(--radius);
    overflow: hidden;
    font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(120% 145% at 8% 0%, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(145deg, var(--blue-light) 0%, var(--blue) 46%, var(--blue-dark) 100%);
    box-shadow:
      -4px 5px 0 -2px rgba(226,236,243,.30),             /* white core sliver   */
      -8px 11px 0 -3px rgba(1,26,44,.55),                /* card thickness      */
      -12px 17px 0 -6px rgba(1,26,44,.32),
      0 46px 70px -26px rgba(0,0,0,.75),                 /* contact shadow      */
      inset 0 1px 0 rgba(255,255,255,.42),               /* top bevel           */
      inset 0 -1px 0 rgba(0,0,0,.28),                    /* bottom bevel        */
      inset 0 0 0 1px rgba(255,255,255,.10);             /* edge                */
  }
  body.flat .card { box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 0 0 1px rgba(255,255,255,.10); }

  /* printed spine */
  .card .spine { position: absolute; inset: 0 auto 0 0; width: 12px; background: var(--yellow); z-index: 3; }

  /* package cubes, PyPI's own glyph, as a quiet watermark */
  .watermark {
    position: absolute; right: 40px; bottom: 22px;
    width: 292px; height: 277px; opacity: .085;
    background: url(__CUBES__) no-repeat center / contain;
  }

  /* laminate: broad specular sweep + a tight highlight along the sweep */
  .laminate {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background:
      linear-gradient(104deg,
        rgba(255,255,255,0)    18%,
        rgba(255,255,255,.055) 34%,
        rgba(255,255,255,.13)  46%,
        rgba(255,255,255,.045) 58%,
        rgba(255,255,255,0)    76%),
      radial-gradient(80% 120% at 12% -10%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 46%),
      linear-gradient(0deg,   rgba(0,0,0,.20) 0%, rgba(0,0,0,0) 24%),
      linear-gradient(270deg, rgba(0,0,0,.14) 0%, rgba(0,0,0,0) 30%);
    mix-blend-mode: screen;
  }
  /* PVC grain */
  .grain {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    opacity: .055; mix-blend-mode: overlay;
    background: url(__NOISE__);
  }

  .inner {
    position: relative; z-index: 2; height: 100%;
    padding: 46px 58px 44px 76px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* --------------------------------------------------------------- platform */
  .platform { display: flex; align-items: center; gap: 15px; }
  .platform img { width: 58px; height: 51px; display: block;
                  filter: drop-shadow(0 2px 6px rgba(0,0,0,.30)); }
  .platform .wordmark { font-size: 31px; font-weight: 700; line-height: 1; }
  .platform .divider  { width: 1px; height: 35px; background: var(--rule); opacity: .55; }
  .platform .index {
    font-size: 13.5px; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; opacity: .72; line-height: 1; padding-top: 4px;
  }
  .version {
    margin-left: auto; align-self: center;
    font-family: "Source Code Pro", monospace; font-weight: 500;
    font-size: 21px; line-height: 1; padding: 9px 14px 8px;
    border: 1px solid var(--rule); border-radius: 4px; background: rgba(0,0,0,.10);
  }

  /* ------------------------------------------------------------ chip + NFC  */
  .hardware { display: flex; align-items: center; gap: 22px; }
  .chip {
    width: 84px; height: 63px; border-radius: 9px;
    background:
      linear-gradient(148deg, #fdf0c0 2%, #d9b45f 26%, #b8912f 48%, #eed892 62%, #c19c3e 84%, #8f6d20 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.45), 0 2px 4px rgba(0,0,0,.38);
    position: relative; overflow: hidden;
  }
  .chip svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .nfc { width: 34px; height: 40px; opacity: .62; }

  /* -------------------------------------------------------------- identity  */
  .name {
    font-size: 74px; font-weight: 700; letter-spacing: -.018em; line-height: 1.02;
    white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.16);
  }
  .summary {
    margin-top: 14px;
    font-size: 25px; font-weight: 400; line-height: 1.34;
    opacity: .88; max-width: 760px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* --------------------------------------------------------------- install  */
  .install { display: flex; align-items: stretch; }
  .install .cmd {
    font-family: "Source Code Pro", monospace; font-weight: 500;
    font-size: 24px; line-height: 1; padding: 14px 17px;
    background: var(--blue-chip); border: 1px dotted var(--rule); white-space: nowrap;
  }
  .install .copy {
    display: flex; align-items: center; justify-content: center; width: 54px;
    background: var(--blue-chip); border: 1px dotted var(--rule); border-left: 0;
  }
  .install .copy svg { width: 23px; height: 23px; }
</style>

<body class="__BODYCLASS__">
<div class="scene">
  <div class="cast"></div>
  <div class="cast cast--core"></div>
  <div class="stage">
    <div class="rig">
    <div class="tilt">
      <div class="card">
        <span class="spine"></span>
        <div class="watermark"></div>

        <div class="inner">

          <div class="platform">
            <img src="__LOGO__" alt="">
            <span class="wordmark">PyPI</span>
            <span class="divider"></span>
            <span class="index">Python Package Index</span>
            <span class="version">__VERSION__</span>
          </div>

          <div class="hardware">
            <span class="chip">
              <svg viewBox="0 0 84 63" fill="none" stroke="rgba(96,72,16,.85)" stroke-width="2.4">
                <rect x="27" y="19" width="30" height="25" rx="4"></rect>
                <path d="M0 19h27M57 19h27M0 44h27M57 44h27M27 31.5H0M57 31.5h27M42 19V0M42 44v19"></path>
              </svg>
            </span>
            <svg class="nfc" viewBox="0 0 26 34" fill="none" stroke="#fff"
                 stroke-width="2.6" stroke-linecap="round">
              <path d="M4 8a14 14 0 0 1 0 18"></path>
              <path d="M11 4a21 21 0 0 1 0 26"></path>
              <path d="M18 1a27 27 0 0 1 0 32"></path>
            </svg>
          </div>

          <div class="identity">
            <h1 class="name" id="name">__NAME__</h1>
            <p class="summary">__SUMMARY__</p>
          </div>

          <div class="install">
            <span class="cmd" id="cmd">__COMMAND__</span>
            <span class="copy">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="12" height="12" rx="2"></rect>
                <path d="M6 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V6"></path>
              </svg>
            </span>
          </div>

        </div>

        <div class="laminate"></div>
        <div class="grain"></div>
      </div>
      </div>
    </div>
  </div>
</div>

<script>
  function fit(el, max, min) {
    const room = el.parentElement.clientWidth || el.clientWidth;
    let size = max;
    el.style.fontSize = size + "px";
    while (el.scrollWidth > room && size > min) { size -= 1; el.style.fontSize = size + "px"; }
  }
  document.fonts.ready.then(() => {
    fit(document.getElementById("name"), 74, 38);
    const cmd = document.getElementById("cmd");
    let s = 24;
    cmd.style.fontSize = s + "px";
    while (cmd.getBoundingClientRect().width > 740 && s > 14) { s -= 1; cmd.style.fontSize = s + "px"; }
    document.documentElement.dataset.ready = "1";
  });
</script>
