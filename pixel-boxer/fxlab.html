<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>타격 이펙트 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
  /* the same wall chart as the motion catalogue: one canvas behind the page, each card's stage a window onto its own bout */
  :root {
    --bg: #e9ebf2; --card: #f7f8fb; --fg: #151826; --dim: #5a6077; --line: #c6cada; --accent: #c42a30;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0d0f19; --card: #151826; --fg: #f1f2f7; --dim: #9aa1b8; --line: #2a2f45; --accent: #f05a4a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0d0f19; --card: #151826; --fg: #f1f2f7; --dim: #9aa1b8; --line: #2a2f45; --accent: #f05a4a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--body); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; z-index: 0; }
  .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
  header { background: var(--bg); display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font: 400 clamp(32px, 8vw, 54px)/1.05 var(--display); letter-spacing: .02em; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--accent); }
  .lede { margin: 0; max-width: 62ch; color: var(--dim); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font: 500 12px/1 var(--data); color: var(--dim); }
  .seg { display: inline-flex; border: 1.5px solid var(--line); }
  .controls button { font: inherit; color: var(--fg); background: var(--card); border: 0; padding: 9px 13px; min-width: 44px; cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .controls button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  section { display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; padding: 6px 0; background: var(--bg); font: 600 13px/1.2 var(--body); letter-spacing: .14em; color: var(--dim); border-bottom: 1.5px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 760px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card { display: flex; flex-direction: column; border: 1.5px solid var(--line); }
  /* (the stage is a hole in the page: the canvas shows through it) */
  .stage { aspect-ratio: 1; }
  .info { background: var(--card); border-top: 1.5px solid var(--line); padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  h3 { margin: 0; font: 400 17px/1.15 var(--display); letter-spacing: .02em; }
  .info p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--dim); }
  .stats { font: 500 11px/1.3 var(--data); color: var(--dim); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--fg); font-weight: 500; }
  .fill { background: var(--bg); }
  .key { background: var(--bg); margin: 0; padding: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; max-width: 72ch; font-size: 13.5px; }
  .key dt { font-family: var(--display); font-size: 17px; }
  .key dd { margin: 0; color: var(--dim); }
  #loading[hidden] { display: none; }
  #loading { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; background: var(--bg); color: var(--dim); font: 500 13px var(--data); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">불러오는 중…</div>
<div class="page">
  <header>
    <h1>타격 <em>이펙트</em> 시안</h1>
    <p class="lede">타격이 들어오는 방향을 빛으로 보면, 맞은 부위에서 그늘지는 면 전체가 땀을 뿌립니다. 입자 하나하나의 방향은 그 자리의 면이 향한 쪽과 타격 방향으로 계산되고, 뻗는 거리와 입자 수는 충격량에 비례합니다. 흰 번쩍임 대신, 맞은 자리에서 시작한 파문이 빛 없이 몸을 일렁이게 하며 퍼지다 사라집니다.</p>
    <div class="controls">
      <span>속도</span>
      <span class="seg"><button data-speed="1" aria-pressed="true">1×</button><button data-speed="0.5" aria-pressed="false">½×</button><button data-speed="0.25" aria-pressed="false">¼×</button></span>
    </div>
    <dl class="key" id="key"></dl>
  </header>
  <main id="lab" style="display:flex;flex-direction:column;gap:24px"></main>
</div>
<script type="module" src="src/fxlab.mjs"></script>
</body>
</html>
