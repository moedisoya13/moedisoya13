<text x="24" y="30" font-size="16" font-weight="700" fill="#222">팔방: 상대의 정면을 기준으로 한 여덟 칸과 거리 띠 (위에서 본 그림, 가운데가 상대, 위쪽이 그의 정면)</text>
<text x="24" y="50" fill="#555">실선은 커밋 4c726b9에서 잰 지금의 길(움직이는 선수의 중심, 동작이 시작할 때의 상대 정면 기준). 별표와 점선은 목표.</text>
