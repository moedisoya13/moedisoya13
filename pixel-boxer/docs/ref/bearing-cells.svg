<text x="58" y="838" font-weight="700" fill="#222" font-size="12">타이슨 시프트 4명</text>
<text x="286" y="838" fill="#444" font-size="11.5">지금 22° (0.5칸), 누른 뒤 0.32 s, 0.72 m에 내려섬 (굵은 선: 내려설 때까지, 가는 점선: 주먹 셋과 돌아오기)</text>
<text x="286" y="855" fill="#444" font-size="11.5">목표 ★ 72° (2칸: 앞손 옆 칸의 문턱 67.5°와 여유 4°를 넘김), 0.80 m, 발이 뜬 뒤 0.38 s</text>
<rect x="28" y="868" width="22" height="6" fill="#1f6fb2" />
<text x="58" y="877" font-weight="700" fill="#222" font-size="12">파도 4명</text>
<text x="286" y="877" fill="#444" font-size="11.5">지금 초당 30° (한 칸에 1.49 s), 둘레 0.86 m/s, 1.63 m, 5.5 s에 159° (점은 1 s마다)</text>
<text x="286" y="894" fill="#444" font-size="11.5">목표 한 칸에 0.71 s (1.8 m/s): 2칸 ★ 1.4 s, 4칸 ★ 2.8 s</text>
<rect x="28" y="907" width="22" height="6" fill="#2e8b57" />
<text x="58" y="916" font-weight="700" fill="#222" font-size="12">측면 대시 3</text>
<text x="286" y="916" fill="#444" font-size="11.5">지금 44° (1칸), 0.22 s, 1.25 → 1.70 m (띠 하나 밖으로 나감)</text>
<rect x="28" y="929" width="22" height="6" fill="#7d5ba6" />
<text x="58" y="938" font-weight="700" fill="#222" font-size="12">서클링 카드 3</text>
<text x="286" y="938" fill="#444" font-size="11.5">지금 1.25 s에 42°, 가장 빠를 때 초당 54°</text>
<text x="286" y="955" fill="#444" font-size="11.5">(스틱을 끝까지 밀어 걸으면 1.0 m에서 초당 131°: 한 칸에 0.34 s)</text>
<rect x="28" y="968" width="22" height="6" fill="#b8860b" />
<text x="58" y="977" font-weight="700" fill="#222" font-size="12">사이드 스텝 카드 3 (0.5 m)</text>
<text x="286" y="977" fill="#444" font-size="11.5">지금 21° (0.46칸), 0.30 s, 1.25 → 1.33 m</text>
<rect x="28" y="990" width="22" height="6" fill="#6b6b6b" />
<text x="58" y="999" font-weight="700" fill="#222" font-size="12">피봇 아웃(실선) · 서클 아웃(파선) 3</text>
<text x="286" y="999" fill="#444" font-size="11.5">지금 24° · 29° (0.5 · 0.6칸) 돈 뒤 밖으로, 1.53 · 1.52 m에서 끝남</text>
<rect x="28" y="1012" width="22" height="6" fill="#d98b2b" fill-opacity="0.45"/>
<text x="58" y="1021" font-weight="700" fill="#222" font-size="12">그의 주먹이 돌지 않고 닿는 호</text>
<text x="286" y="1021" fill="#444" font-size="11.5">잰 값(잽 · 스트레이트 · 훅): 뒷손 쪽은 67.5°까지, 앞손 쪽은 22.5°까지 온전하고</text>
<text x="286" y="1038" fill="#444" font-size="11.5">45°에서는 잽 13 · 훅 31 N·s뿐, 그 밖은 빗나감</text>
<text x="24" y="1066" fill="#555" font-size="11.5">칸의 번호: 정면 0, 그의 앞손 쪽(바깥)으로 +1 +2 +3, 등 뒤 4, 뒷손 쪽(안)으로 −1 −2 −3. 경계는 22.5° + 45° × k, 넘어갈 때 4°의 여유.</text>
<text x="24" y="1086" fill="#555" font-size="11.5">거리 띠(중심 사이, m): 붙음 0.62~0.74 · 훅 0.74~0.90 · 잽 0.90~1.15 · 문턱 1.15~1.55 · 밖 1.55~1.95 (파도 1.55~1.85) · 먼 1.95~.</text>
