<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#090a11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<title>한밤의 링</title>
<style>
  /* one screen: the ring fills it, the two men and the round's clock along the top, a few buttons along the bottom; nobody
     is at the controls (an auto battler: both corners are boxed by their heads) */
  :root { --ink: #090a11; --paper: #f6f3ea; --red: #e6382e; --blue: #2a84ec; --gold: #ffc24a; --muted: #a9a8b8; --line: rgba(246,243,234,.22);
    --panel: rgba(9,10,17,.8); --side: max(16px, env(safe-area-inset-left, 0px)); --side-r: max(16px, env(safe-area-inset-right, 0px)); color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; overscroll-behavior: none;
    font: 700 14px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK KR", monospace; }
  body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #stagebox { position: fixed; inset: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #hud { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-left: var(--side); padding-right: var(--side-r); pointer-events: none; }
  .side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .side.right { align-items: flex-end; text-align: right; }
  .name { font-size: 11px; letter-spacing: .08em; text-shadow: 0 2px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .side:first-child .name b { color: #ff8a80; }
  .side.right .name b { color: #8cc4ff; }
  .bar { width: 100%; max-width: 220px; height: 10px; background: #1b1d2b; box-shadow: 0 0 0 2px var(--ink); }
  .bar i { display: block; height: 100%; background: var(--red); transform-origin: left; transition: transform .12s steps(3); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.3); }
  .side.right .bar i { background: var(--blue); transform-origin: right; }
  .hp { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 var(--ink); }
  #clock { text-align: center; padding-top: 2px; text-shadow: 0 2px 0 var(--ink); }
  #clock b { display: block; font-size: 18px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  #stage { display: block; font-size: 10px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
  #seed { display: block; font-size: 9px; color: #6e6d7d; letter-spacing: .06em; white-space: nowrap; }
  /* the referee's count over a man down: its number, big */
  #count { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); font-size: clamp(44px, 16vw, 96px); line-height: 1; color: var(--gold);
    text-shadow: 4px 4px 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); font-variant-numeric: tabular-nums; pointer-events: none; display: none; }
  #count.on { display: block; }
  /* what the last punch delivered, for a moment */
  #blow { position: absolute; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font-size: 12px; letter-spacing: .1em; color: var(--gold); opacity: 0; pointer-events: none; text-shadow: 0 2px 0 var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #blow.on { animation: blow 1.1s steps(8) forwards; }
  @keyframes blow { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  /* a knockdown's replay, while it plays (src/replay.mjs): a small tag in the corner; any key or tap skips it */
  #replay { position: absolute; left: var(--side); top: calc(62px + env(safe-area-inset-top, 0px)); padding: 4px 7px; font-size: 11px; letter-spacing: .12em;
    background: var(--paper); color: var(--ink); box-shadow: 3px 3px 0 var(--red); opacity: 0; pointer-events: none; }
  #replay.on { opacity: 1; }
  #fps { position: absolute; left: var(--side); top: calc(92px + env(safe-area-inset-top, 0px)); font-size: 10px; opacity: .6; pointer-events: none; }
  /* the break between rounds: what the judges gave the round, and what each corner tells its man */
  #rest { position: absolute; left: var(--side); right: var(--side-r); top: 30%; display: none; justify-content: center; pointer-events: none; }
  #rest.on { display: flex; }
  #rest > div { background: var(--panel); border: 2px solid var(--line); padding: 12px 14px; text-align: center; max-width: 100%; }
  #rest h2 { margin: 0 0 6px; font-size: clamp(16px, 5vw, 24px); letter-spacing: .08em; text-shadow: 3px 3px 0 var(--red); }
  #rest p { margin: 3px 0; font-size: 12px; color: #d9d6cc; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
    padding: 8px var(--side-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--side); background: linear-gradient(transparent, rgba(9,10,17,.85) 40%); }
  button { font: inherit; font-size: 12px; color: var(--paper); background: rgba(9,10,17,.7); border: 2px solid rgba(246,243,234,.55); padding: 7px 10px; min-height: 36px; cursor: pointer; }
  button[aria-pressed="true"] { background: rgba(246,243,234,.88); color: var(--ink); }
  button.go { border-color: var(--gold); color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .sheet { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding-block: 24px;
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); background: rgba(9,10,17,.6); z-index: 5; }
  .sheet.on { display: grid; }
  .sheet > div { max-width: 100%; }
  .sheet h1 { margin: 0 0 6px; font-size: clamp(28px, 9vw, 60px); letter-spacing: .12em; color: var(--paper); text-shadow: 4px 4px 0 var(--red); text-wrap: balance; }
  .sheet p { margin: 6px 0; opacity: .85; font-size: 13px; text-wrap: balance; }
  .sheet .card { color: var(--gold); opacity: 1; }
  .sheet .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .go:not(button) { display: inline-block; margin-top: 10px; padding: 10px 18px; border: 3px solid var(--paper); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { color: var(--gold); } }
  #cards { font-variant-numeric: tabular-nums; }
  #result h1 { font-size: clamp(24px, 7vw, 44px); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    #blow.on { animation: none; opacity: 1; }
    .bar i { transition: none; }
    .go:not(button) { animation: none; }
  }
</style>
</head>
<body>
<div id="stagebox">
  <canvas id="view" aria-label="두 선수 AI가 시합을 하는 링"></canvas>
  <div id="hud">
    <div class="side"><span class="name" id="name0"><b>홍코너</b></span><div class="bar"><i id="hp0"></i></div><span class="hp" id="hpn0"></span></div>
    <div id="clock"><b id="time">1:00</b><span id="stage">1라운드</span><span id="seed"></span></div>
    <div class="side right"><span class="name" id="name1"><b>청코너</b></span><div class="bar"><i id="hp1"></i></div><span class="hp" id="hpn1"></span></div>
  </div>
  <div id="count" role="status" aria-live="polite"></div>
  <div id="blow"></div>
  <div id="replay">리플레이</div>
  <div id="fps"></div>
  <div id="rest" role="status" aria-live="polite"><div><h2 id="resthead"></h2><p id="restcards"></p><p id="restcorner"></p><p id="restleft"></p></div></div>
  <div id="bar">
    <button data-act="again" id="againbtn">다시</button>
    <button data-act="next" id="nextbtn">다음 시합</button>
    <button data-act="speed" id="speedbtn" aria-pressed="false" aria-label="속도">1×</button>
  </div>
</div>

<div class="sheet on" id="title">
  <div>
    <h1>한밤의 링</h1>
    <p>두 선수 AI가 라운드를 나눠 싸웁니다 · 다운에는 카운트, 끝까지 서 있으면 세 심판의 판정</p>
    <p class="card" id="titlecard"></p>
    <span class="go">화면을 눌러 시합 시작</span>
  </div>
</div>
<div class="sheet" id="result" role="status" aria-live="polite">
  <div>
    <h1 id="verdict"></h1>
    <p id="detail"></p>
    <p id="cards"></p>
    <div class="row"><button class="go" data-act="next">다음 시합</button><button data-act="again">다시 보기</button></div>
  </div>
</div>
<div id="loading">불러오는 중…</div>
<script type="module" src="src/main.mjs"></script>
</body>
</html>
