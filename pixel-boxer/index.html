<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#090a11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<title>한밤의 링</title>
<style>
  /* one screen: the ring fills it, the bout's state along the top, the controls under the thumbs */
  :root { --ink: #090a11; --paper: #f6f3ea; --red: #e6382e; --blue: #2a84ec; --gold: #ffc24a; --canvas: #546890; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; overscroll-behavior: none;
    font: 700 14px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK KR", monospace; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr; }
  #stagebox { position: relative; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  @media (orientation: portrait) {
    #game { grid-template-rows: min(100vw, 56vh) 1fr; }
    #controls { position: relative !important; }
  }
  #hud { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
  .side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .side.right { align-items: flex-end; }
  .name { font-size: 11px; letter-spacing: .12em; opacity: .85; text-shadow: 0 2px 0 var(--ink); }
  .bar { width: 100%; max-width: 220px; height: 10px; background: #1b1d2b; box-shadow: 0 0 0 2px var(--ink); }
  .bar i { display: block; height: 100%; background: var(--red); transform-origin: left; transition: transform .12s steps(3); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.3); }
  .side.right .bar i { background: var(--blue); transform-origin: right; }
  #stage { font-size: 11px; letter-spacing: .14em; opacity: .75; padding-top: 14px; text-shadow: 0 2px 0 var(--ink); white-space: nowrap; }
  #counter { position: absolute; left: 50%; top: 20%; transform: translate(-50%, 0) scale(.6); opacity: 0; pointer-events: none;
    font-size: clamp(22px, 7vw, 44px); letter-spacing: .08em; color: var(--gold); text-shadow: 3px 3px 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
  #counter.on { opacity: 1; transform: translate(-50%, 0) scale(1); transition: transform .08s steps(2); animation: blink .16s steps(2) infinite; }
  @keyframes blink { 50% { color: var(--paper); } }
  /* what the last punch delivered, for a moment */
  #blow { position: absolute; left: 50%; top: calc(34px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font-size: 12px; letter-spacing: .1em; color: var(--gold); opacity: 0; pointer-events: none; text-shadow: 0 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
  #blow.on { animation: blow 1.1s steps(8) forwards; }
  @keyframes blow { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  /* a knockdown's replay, while it plays (src/replay.mjs): a small tag in the corner; any key, tap or button skips it */
  #replay { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(62px + env(safe-area-inset-top, 0px)); padding: 4px 7px; font-size: 11px; letter-spacing: .12em;
    background: var(--paper); color: var(--ink); box-shadow: 3px 3px 0 var(--red); opacity: 0; pointer-events: none; }
  #replay.on { opacity: 1; }
  #fps { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(44px + env(safe-area-inset-top, 0px)); font-size: 10px; opacity: .6; pointer-events: none; }

  #controls { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  [data-pad] { position: relative; }
  [data-nub] { position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 3px solid rgba(246,243,234,.25);
    opacity: 0; pointer-events: none; transition: opacity .1s; --dx: 0px; --dy: 0px; }
  [data-nub]::after { content: ""; position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px; border-radius: 50%;
    background: rgba(246,243,234,.35); transform: translate(var(--dx), var(--dy)); }
  #buttons { position: relative; }
  #buttons button { position: absolute; border-radius: 50%; border: 3px solid rgba(246,243,234,.55); background: rgba(9,10,17,.45);
    color: var(--paper); font: inherit; font-size: 14px; letter-spacing: .04em; padding: 0; touch-action: none; }
  #buttons button.down { background: rgba(246,243,234,.85); color: var(--ink); transform: scale(.94); }
  [data-button=power] { width: 90px; height: 90px; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px)); border-color: var(--red) !important; }
  [data-button=jab] { width: 76px; height: 76px; right: calc(118px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); border-color: var(--gold) !important; }
  [data-button=cover] { width: 68px; height: 68px; right: calc(46px + env(safe-area-inset-right, 0px)); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); }
  .hint { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font-size: 11px; opacity: .45; pointer-events: none; }

  .sheet { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding-block: 24px;
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); background: rgba(9,10,17,.6); z-index: 5; }
  .sheet.on { display: grid; }
  .sheet h1 { margin: 0 0 6px; font-size: clamp(30px, 9vw, 60px); letter-spacing: .12em; color: var(--paper); text-shadow: 4px 4px 0 var(--red); text-wrap: balance; }
  .sheet p { margin: 6px 0; opacity: .85; }
  .sheet dl { display: grid; grid-template-columns: auto auto; gap: 4px 14px; justify-content: center; margin: 14px 0; text-align: left; font-size: 13px; }
  .sheet dt { color: var(--gold); }
  .sheet dd { margin: 0; opacity: .85; }
  .alt { display: inline-block; margin-top: 8px; padding: 8px 14px; border: 2px solid rgba(246,243,234,.5); font-size: 12px; }
  .go { display: inline-block; margin-top: 10px; padding: 10px 18px; border: 3px solid var(--paper); animation: blink 1s steps(2) infinite; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--ink); }
</style>
</head>
<body>
<div id="game">
  <div id="stagebox">
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="side"><span class="name">홍코너</span><div class="bar"><i id="hp0"></i></div></div>
      <div id="stage"></div>
      <div class="side right"><span class="name">청코너</span><div class="bar"><i id="hp1"></i></div></div>
    </div>
    <div id="counter">COUNTER!</div>
    <div id="blow"></div>
    <div id="replay">리플레이</div>
    <div id="fps"></div>
  </div>
  <div id="controls">
    <div data-pad><div data-nub></div><span class="hint">끌어서 이동 · 튕겨서 대시</span></div>
    <div id="buttons">
      <button data-button="cover">가드</button>
      <button data-button="jab">잽</button>
      <button data-button="power">강타</button>
    </div>
  </div>
</div>

<div class="sheet on" id="title">
  <div>
    <h1>한밤의 링</h1>
    <p>주먹이 닿기 직전에 올린 가드는 반격의 틈을 연다</p>
    <dl>
      <dt>잽</dt><dd>빠른 왼손 · J</dd>
      <dt>강타</dt><dd>스트레이트 → 훅 → 어퍼 · K</dd>
      <dt>가드</dt><dd>누르고 있기 · L</dd>
      <dt>대시</dt><dd>튕기기 · Space / 방향 두 번</dd>
      <dt>COUNTER!</dt><dd>직전 가드 뒤의 주먹은 1.8배</dd>
    </dl>
    <span class="go">화면을 눌러 시합 시작</span>
    <p><span class="alt" data-spar>스파링 · 상대는 서 있기만 함</span></p>
  </div>
</div>
<div class="sheet" id="result">
  <div>
    <h1 id="verdict"></h1>
    <span class="go" id="next"></span>
  </div>
</div>
<div id="loading">불러오는 중…</div>
<script type="module" src="src/main.mjs"></script>
</body>
</html>
