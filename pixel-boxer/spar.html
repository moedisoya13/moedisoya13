<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090a11">
<meta name="claude:viewport-fit-sides" content="cover">
<title>한 라운드 스파링</title>
<style>
  /* one screen: the ring fills it; the two men and the clock along the top, the two rails of what they do over the buttons
     along the bottom */
  :root { --ink: #090a11; --paper: #f6f3ea; --red: #e6382e; --blue: #2a84ec; --gold: #ffc24a; --line: rgba(246,243,234,.22);
    --panel: rgba(9,10,17,.8); --muted: #a9a8b8; --k-attack: #ffb84a; --k-evade: #58d6a4; --k-guard: #b49cff; --k-show: #e8e2cf; --k-hurt: #ff5470; --k-distance: #9aa3bd; --k-axis: #52c7ea; --side: max(16px, env(safe-area-inset-left, 0px)); --side-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden; overscroll-behavior: none;
    font: 700 13px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK KR", monospace; }
  body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #stagebox { position: fixed; inset: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; background: var(--ink); }

  #hud { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-left: var(--side); padding-right: var(--side-r); pointer-events: none; }
  .side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .side.right { align-items: flex-end; text-align: right; }
  .name { font-size: 11px; letter-spacing: .08em; color: var(--paper); text-shadow: 0 2px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .name b { font-weight: 700; }
  .side:first-child .name b { color: #ff8a80; }
  .side.right .name b { color: #8cc4ff; }
  .bar { width: 100%; max-width: 220px; height: 10px; background: #1b1d2b; box-shadow: 0 0 0 2px var(--ink); }
  .bar i { display: block; height: 100%; background: var(--red); transform-origin: left; transition: transform .12s steps(3); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.3); }
  .side.right .bar i { background: var(--blue); transform-origin: right; }
  .hp { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 var(--ink); }
  #clock { text-align: center; padding-top: 2px; text-shadow: 0 2px 0 var(--ink); }
  #clock b { display: block; font-size: 18px; letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--paper); }
  #clock span { font-size: 10px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }

  #blow { position: absolute; left: 50%; top: calc(52px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font-size: 12px; letter-spacing: .1em; color: var(--gold); opacity: 0; pointer-events: none; text-shadow: 0 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
  #blow.on { animation: blow 1.1s steps(8) forwards; }
  @keyframes blow { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  #tag { position: absolute; right: var(--side-r); top: calc(56px + env(safe-area-inset-top, 0px)); font-size: 11px; letter-spacing: .1em; color: var(--gold); text-shadow: 0 2px 0 var(--ink); display: none; }
  #tag.on { display: block; }

  /* the four lanes, along the bottom over the buttons: red's techniques and footwork, blue's footwork and techniques, a block
     an action, coloured by its kind; the present at the playhead, what is to come (약속) to its right; a tap opens the whole */
  #rails { position: absolute; left: var(--side); right: var(--side-r); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); background: var(--panel);
    border: 2px solid var(--line); padding: 4px 6px 6px; display: none; cursor: pointer; }
  #rails.on { display: block; }
  #rails:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #legend { display: flex; gap: 8px; align-items: center; font-size: 9px; letter-spacing: .04em; color: var(--muted); margin: 0 0 3px; white-space: nowrap; overflow: hidden; }
  #legend .k::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 3px; background: var(--c); }
  #legend .a { --c: var(--k-attack); } #legend .e { --c: var(--k-evade); } #legend .g { --c: var(--k-guard); } #legend .s { --c: var(--k-show); } #legend .h { --c: var(--k-hurt); } #legend .d { --c: var(--k-distance); } #legend .x { --c: var(--k-axis); }
  #legend .sep { color: #5d5c6c; }
  #legend .more { margin-left: auto; color: var(--gold); font-variant-numeric: tabular-nums; }
  #railcv { display: block; width: 100%; height: 80px; }

  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
    padding: 8px var(--side-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--side); background: linear-gradient(transparent, rgba(9,10,17,.85) 40%); }
  #bar button, #bar select, .sheet button { font: inherit; font-size: 12px; color: var(--paper); background: rgba(9,10,17,.7); border: 2px solid rgba(246,243,234,.55); padding: 7px 10px; min-height: 36px; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: rgba(246,243,234,.88); color: var(--ink); }
  #bar .go, .sheet .go { border-color: var(--gold); color: var(--gold); }
  #bar select { appearance: none; -webkit-appearance: none; padding-right: 10px; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #build { position: absolute; left: var(--side); top: calc(54px + env(safe-area-inset-top, 0px)); font-size: 9px; color: #6e6d7d; letter-spacing: .06em; pointer-events: none; text-shadow: 0 2px 0 var(--ink); }

  #busy { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 8px 14px; background: var(--panel); border: 2px solid var(--line); font-size: 12px; letter-spacing: .06em; display: none; white-space: nowrap; }
  #busy.on { display: block; }

  .sheet { position: absolute; left: 0; right: 0; display: none; justify-content: center; text-align: center; pointer-events: none;
    padding-left: var(--side); padding-right: var(--side-r); }
  .sheet.on { display: flex; }
  .sheet > div { pointer-events: auto; }
  #title { top: calc(64px + env(safe-area-inset-top, 0px)); }
  #title h1 { margin: 0 0 6px; font-size: clamp(26px, 8vw, 52px); letter-spacing: .1em; color: var(--paper); text-shadow: 4px 4px 0 var(--red); text-wrap: balance; }
  #title p { margin: 4px 0; color: #d9d6cc; font-size: 12px; text-shadow: 0 2px 0 var(--ink); }
  #result { top: calc(74px + env(safe-area-inset-top, 0px)); }
  #result > div { background: var(--panel); border: 2px solid var(--line); padding: 14px 16px 12px; }
  #result h2 { margin: 0 0 4px; font-size: clamp(16px, 5vw, 26px); letter-spacing: .06em; color: var(--paper); text-shadow: 3px 3px 0 var(--red); }
  #result p { margin: 2px 0 10px; color: #d9d6cc; font-size: 12px; }
  #result .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  #full { position: fixed; inset: 0; display: none; background: rgba(9,10,17,.97); z-index: 5; padding: calc(16px + env(safe-area-inset-top, 0px)) var(--side-r) calc(16px + env(safe-area-inset-bottom, 0px)) var(--side); }
  #full.on { display: flex; flex-direction: column; }
  #full header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  #full h2 { margin: 0; font-size: 14px; letter-spacing: .08em; }
  #full ol { list-style: none; margin: 0 auto; padding: 0; overflow: auto; flex: 1; border-top: 2px solid var(--line); width: 100%; max-width: 760px; }
  #full li { display: grid; grid-template-columns: 3.6em 1fr 1fr; gap: 0 8px; padding: 3px 0; border-bottom: 1px solid rgba(246,243,234,.08); font-size: 12px; line-height: 1.4; }
  #full li .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  #full li .c { min-width: 0; padding-left: 7px; border-left: 4px solid var(--c, transparent); }
  #full li .said { color: var(--gold); font-size: 11px; }
  #full li .cut { color: #ff8a9c; font-size: 11px; }
  #full li.done { color: #a5a4b2; }
  #full li.now { background: rgba(255,194,74,.12); }
  #full li.now .t { color: var(--gold); }
  #full li.ko { background: rgba(255,84,112,.16); }
  #full li.f { font-size: 11px; color: #9c9bab; padding: 1px 0; }
  #full li.f .c { border-left-width: 2px; margin-left: 10px; }
  #full .heads { display: grid; grid-template-columns: 3.6em 1fr 1fr; gap: 0 8px; font-size: 11px; color: var(--muted); margin: 0 auto 4px; width: 100%; max-width: 760px; }
  #full .heads b:nth-child(2) { color: #ff8a80; } #full .heads b:nth-child(3) { color: #8cc4ff; }
  #full button { font: inherit; font-size: 12px; color: var(--paper); background: transparent; border: 2px solid rgba(246,243,234,.55); padding: 6px 10px; min-height: 34px; cursor: pointer; }
  #full .meta { color: var(--muted); font-size: 11px; margin: 0 0 8px; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--ink); color: var(--paper); }
  @media (orientation: landscape) and (max-height: 500px) {
    #rails { bottom: calc(54px + env(safe-area-inset-bottom, 0px)); padding: 3px 6px 4px; }
    #railcv { height: 62px; }
    #legend { display: none; }
    #title { top: calc(48px + env(safe-area-inset-top, 0px)); }
  }
  @media (max-width: 520px) {
    #bar { gap: 4px; }
    #bar button, #bar select { padding-left: 7px; padding-right: 7px; }
    #legend { gap: 5px; font-size: 8.5px; letter-spacing: 0; }
    #legend .k::before { margin-right: 2px; }
    /* (and the lanes' names and the count's "약속 →", for the room the legend's seven kinds and the count take) */
    #legend .sep, #legend .lane, #legend .lead { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #blow.on { animation: none; opacity: 1; }
    .bar i { transition: none; }
  }
</style>
</head>
<body>
<div id="stagebox">
  <canvas id="view" aria-label="두 선수가 약속 대련을 하는 링"></canvas>
  <div id="hud">
    <div class="side"><span class="name" id="name0"><b>빨강</b></span><div class="bar"><i id="hp0"></i></div><span class="hp" id="hpn0"></span></div>
    <div id="clock"><b id="time">0:00</b><span id="seed">대련 —</span></div>
    <div class="side right"><span class="name" id="name1"><b>파랑</b></span><div class="bar"><i id="hp1"></i></div><span class="hp" id="hpn1"></span></div>
  </div>
  <div id="blow"></div>
  <div id="tag">리플레이</div>
  <div id="busy" role="status" aria-live="polite">대본을 짜는 중…</div>
  <div id="rails" role="button" tabindex="0" aria-label="두 선수의 기술과 풋워크 타임라인 네 줄: 눌러서 전체 보기">
    <div id="legend"><span class="lane">기술</span><span class="k a">공격</span><span class="k e">회피</span><span class="k g">방어</span><span class="k s">도발</span><span class="k h">피격</span><span class="sep">|</span><span class="lane">발</span><span class="k d">거리</span><span class="k x">축</span><span class="more"><span class="lead">약속 → </span><span id="railnote"></span></span></div>
    <canvas id="railcv"></canvas>
  </div>
  <div class="sheet on" id="title">
    <div>
      <h1>한 라운드 스파링</h1>
      <p>시작을 누를 때마다 새로 짠 약속 대련을 첫 KO까지</p>
      <p>두 선수가 쉬지 않고 주고받고, 올 기술과 풋워크가 아래 네 줄에 미리 보입니다</p>
    </div>
  </div>
  <div class="sheet" id="result" role="status" aria-live="polite">
    <div>
      <h2 id="verdict"></h2>
      <p id="detail"></p>
      <div class="row"><button class="go" data-act="start">시작</button><button data-act="again">다시 보기</button></div>
    </div>
  </div>
  <div id="build"></div>
  <div id="bar">
    <button class="go" data-act="start" id="startbtn">시작</button>
    <button data-act="again" id="againbtn" disabled>다시 보기</button>
    <button data-act="speed" id="speedbtn" aria-pressed="false" aria-label="속도">1×</button>
    <button data-act="sound" id="soundbtn" aria-pressed="false">소리 끔</button>
    <select id="wear" aria-label="옷"><option value="">맨몸</option><option value="training">체육복</option><option value="training-up">후드</option></select>
    <select id="arena" aria-label="경기장"><option value="ring">링</option><option value="underground">지하</option></select>
  </div>
</div>
<div id="full" role="dialog" aria-modal="true" aria-labelledby="fulltitle">
  <header><h2 id="fulltitle">액션 타임라인</h2><button data-act="close">닫기</button></header>
  <p class="meta" id="fullmeta"></p>
  <div class="heads"><span></span><b>빨강</b><b>파랑</b></div>
  <ol id="fullrows"></ol>
</div>
<div id="loading">불러오는 중…</div>
<script type="module" src="src/spar.mjs"></script>
</body>
</html>
